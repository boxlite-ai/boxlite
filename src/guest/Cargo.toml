[package]
name = "boxlite-guest"
version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Boxlite Guest Runtime"
edition = "2021"

[[bin]]
name = "boxlite-guest"
path = "src/main.rs"

[dependencies]
boxlite-shared.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "net", "fs", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29", features = ["mount", "process", "fs", "sched", "socket", "poll"] }
async-trait = "0.1"
uuid = { version = "1.10", features = ["v4"] }
tonic = "0.12"
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }
futures = "0.3"
async-stream = "0.3"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
tar = "0.4"
# `ring` (not `aws-lc-rs`) so this cross-compiles from macOS to the guest's
# musl target without needing a C/cmake toolchain for aws-lc. `rsa` for
# RSA-SHA2 client key support alongside the default Ed25519 host key.
russh = { version = "0.62", default-features = false, features = ["ring", "rsa"] }
# In-process SFTP subsystem handler paired with russh; the wire protocol is
# implemented here, not hand-rolled, and not an external sftp-server binary.
russh-sftp = "2.3"
rand = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18.0"
tokio-vsock = { version = "0.7", features = ["tonic012"] }
libcontainer = { version = "0.6", default-features = false, features = ["v2", "libseccomp"] }
oci-spec = "0.6"
rtnetlink = "0.14"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
