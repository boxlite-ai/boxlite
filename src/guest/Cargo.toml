[package]
name = "boxlite-guest"
version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Boxlite Guest Runtime"
edition = "2021"

[[bin]]
name = "boxlite-guest"
path = "src/main.rs"

[dependencies]
boxlite-shared.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "net", "fs", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29", features = ["mount", "process", "fs", "sched", "socket", "poll"] }
async-trait = "0.1"
uuid = { version = "1.10", features = ["v4"] }
tonic = "0.12"
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }
futures = "0.3"
async-stream = "0.3"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
tar = "0.4"
# `ring` (not `aws-lc-rs`) to avoid aws-lc's cmake toolchain. Note ring is
# still C: cross-compiling from macOS needs a musl cross-compiler (see the
# note on `clippy` in make/quality.mk). `rsa` is enabled
# so russh can decode an RSA certificate and our own verifier can reject it
# explicitly, rather than the algorithm silently failing to parse.
russh = { version = "0.62", default-features = false, features = ["ring", "rsa"] }
# In-process SFTP subsystem handler paired with russh; the wire protocol is
# implemented here, not hand-rolled, and not an external sftp-server binary.
russh-sftp = "2.3"
rand = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18.0"
tokio-vsock = { version = "0.7", features = ["tonic012"] }
libcontainer = { version = "0.6", default-features = false, features = ["v2", "libseccomp"] }
oci-spec = "0.6"
rtnetlink = "0.14"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
