[package]
name = "boxlite-test-utils"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
boxlite = { path = "../boxlite" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "io-util", "fs"] }
libc = "0.2"
parking_lot = "0.12"
paste = "1"
futures = "0.3"
hex = "0.4.3"
oci-client = { version = "0.15", default-features = false, features = ["rustls-tls"] }
serde_json = "1.0"
sha2 = "0.11"
