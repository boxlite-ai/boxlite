[package]
name = "boxlite-vmm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Virtual machine lifecycle and device model for BoxLite"
repository = "https://github.com/boxlite-ai/boxlite"

[dependencies]
boxlite-hypervisor.workspace = true
libc = "0.2"
# The disk format layer; `sync` keeps tokio out of the crate.
imago = { version = "0.2.6", default-features = false, features = ["sync"] }
mio = { version = "1.2.0", default-features = false, features = ["os-poll", "net"] }
tracing = "0.1"
virtio-queue = "0.18.0"
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }

[dev-dependencies]
# Tests poll real pipes as virtio backend sources.
mio = { version = "1.2.0", default-features = false, features = ["os-poll", "os-ext"] }
# Disk images live in temporary directories.
tempfile = "3"
# `MockSplitQueue` is the driver side of a queue in the block device tests.
virtio-queue = { version = "0.18.0", features = ["test-utils"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
vm-superio = "0.8.2"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
linux-loader = { version = "0.14.0", default-features = false, features = ["elf"] }
