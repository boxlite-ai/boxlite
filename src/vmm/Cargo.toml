[package]
name = "boxlite-vmm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Virtual machine lifecycle and device model for BoxLite"

[dependencies]
boxlite-hypervisor.workspace = true
mio = { version = "1.2.0", default-features = false, features = ["os-poll"] }
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
# 0.8.2 raises THRE on every IER write, so Linux drives transmit by IRQ 4.
# Against 0.8.1 it enables its UART_BUG_TXEN workaround instead.
vm-superio = "0.8.2"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
linux-loader = { version = "0.14.0", default-features = false, features = ["elf"] }
