# Test Go SDK and tag Go module for publishing.
#
# Release builds download the published native library and test the Go SDK,
# validating the same workflow that end users follow. Manual builds produce
# the native library from the selected commit before testing its Go SDK.
#
# User workflow:
#   go get github.com/boxlite-ai/boxlite/sdks/go
#   go run github.com/boxlite-ai/boxlite/sdks/go/cmd/setup
#   go build ./...
#
# Triggers:
# - workflow_run: After a successful release C SDK build (archives are published)
# - workflow_dispatch: Build and test the selected commit's C and Go SDKs together
name: Build Go SDK

on:
  workflow_run:
    workflows: ["Build C SDK"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release')
    uses: ./.github/workflows/config.yml

  build-c:
    name: Build manual commit C SDK
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: ./.github/workflows/build-c.yml
    with:
      ref: ${{ github.sha }}

  test:
    name: Test (${{ matrix.target }})
    needs: [config, build-c]
    if: >-
      !cancelled() &&
      needs.config.result == 'success' &&
      (needs['build-c'].result == 'success' || needs['build-c'].result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.config.outputs.platforms) }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ needs.config.outputs.go-version }}

      - name: Download prebuilt library
        if: github.event_name != 'workflow_dispatch'
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          PLATFORM="${{ matrix.target }}"
          ARCHIVE="boxlite-c-v${VERSION}-${PLATFORM}.tar.gz"
          URL="https://github.com/boxlite-ai/boxlite/releases/download/v${VERSION}/${ARCHIVE}"
          echo "Downloading: ${URL}"
          curl -sL "${URL}" | tar xz -C /tmp/
          cp "/tmp/boxlite-c-v${VERSION}-${PLATFORM}/lib/libboxlite.a" sdks/go/

      - name: Download commit libboxlite.a
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: c-sdk-${{ matrix.target }}
          path: /tmp/c-sdk

      - name: Extract commit libboxlite.a
        if: github.event_name == 'workflow_dispatch'
        env:
          PLATFORM: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive=$(find /tmp/c-sdk -maxdepth 1 -name "boxlite-c-v*-${PLATFORM}.tar.gz" -print -quit)
          test -n "$archive"
          tar xzf "$archive" -C /tmp/
          cp "/tmp/$(basename "$archive" .tar.gz)/lib/libboxlite.a" sdks/go/libboxlite.a

      - name: Test Go SDK
        run: |
          cd sdks/go
          go build ./...
          go test -v ./...

  tag-go-module:
    name: Tag Go Module
    needs: test
    # The manual C build is skipped on releases; publication must also override implicit success().
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Go module tag
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAG="sdks/go/v${VERSION}"
          echo "Creating tag: ${TAG}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping"
            exit 0
          fi

          git tag "${TAG}"
          git push origin "${TAG}"
