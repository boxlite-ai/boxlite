# Shadow rehearsal: real approvals and marked Slack notifications, with simulated build, upload and deployment steps.
name: Build Go SDK
'on':
  workflow_dispatch: null
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  config:
    uses: ./.github/workflows/config.yml
    permissions:
      contents: read
      actions: read
  build-c:
    name: Build manual commit C SDK
    if: ${{ !inputs.ref }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/build-c.yml
    with:
      ref: ${{ github.sha }}
  test:
    name: Test (${{ matrix.target }})
    needs:
      - config
      - build-c
    permissions:
      contents: read
      actions: read
    if: '!cancelled() && needs.config.result == ''success'' && (needs[''build-c''].result == ''success'' || needs[''build-c''].result == ''skipped'')'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.config.outputs.platforms) }}
    steps:
      - name: actions/checkout@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/setup-go
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Download commit libboxlite.a
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Extract commit libboxlite.a
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Test Go SDK
        shell: bash
        run: printf '%s\n' 'Simulated'
