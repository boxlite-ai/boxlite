name: Agent tooling

on:
  pull_request:
    paths:
      - ".agent-tooling/**"
      - ".agents/plugins/marketplace.json"
      - ".claude/settings.json"
      - ".github/copilot/settings.json"
      - ".github/workflows/agent-tooling.yml"
      - "AGENTS.md"
      - "CLAUDE.md"
  push:
    branches: [main]
    paths:
      - ".agent-tooling/**"
      - ".agents/plugins/marketplace.json"
      - ".claude/settings.json"
      - ".github/copilot/settings.json"
      - ".github/workflows/agent-tooling.yml"
      - "AGENTS.md"
      - "CLAUDE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tooling.ref, validate the profile, adopt the tip
        run: ./.agent-tooling/install.sh
      - name: Guidance block is current (an explicit install splices; drift becomes a diff)
        run: git diff --exit-code -- AGENTS.md CLAUDE.md
