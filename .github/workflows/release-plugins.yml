name: Release BoxLite plugin

on:
  pull_request:
    paths:
      - 'plugins/boxlite/**'
      - 'scripts/plugins/**'
      - 'tests/plugins/**'
      - 'make/plugins.mk'
      - 'make/test.mk'
      - 'Makefile'
      - '.github/actions/setup-python/**'
      - '.github/workflows/release-plugins.yml'
  push:
    tags: ['boxlite-plugin-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.package.outputs.version }}
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Claude manifest validator
        run: npm install --global @anthropic-ai/claude-code@2.1.328
      - name: Build and validate both host packages
        run: make plugin:boxlite:check:cc plugin:boxlite:review-kit
      - name: Bind artifacts to the plugin version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.version' plugins/boxlite/plugin.json)"
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "boxlite-plugin-v$version" ]]; then
              echo 'Release builds must run on the boxlite-plugin-vVERSION tag matching plugin.json.' >&2
              exit 1
            fi
          fi
          printf 'version=%s\nartifact=boxlite-plugins-%s-%s-%s\n' \
            "$version" "$version" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          cd target/plugins
          sha256sum --check SHA256SUMS
          sha256sum --check "boxlite-review-kit-$version.zip.sha256"
      - name: Save validated packages for release or PR preview
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            target/plugins/boxlite-${{ steps.package.outputs.version }}.zip
            target/plugins/boxlite-marketplace-${{ steps.package.outputs.version }}.zip
            target/plugins/SHA256SUMS
            target/plugins/boxlite-review-kit-${{ steps.package.outputs.version }}.zip
            target/plugins/boxlite-review-kit-${{ steps.package.outputs.version }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: packages
      - name: Publish complete versioned release
        working-directory: packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="boxlite-plugin-v$PLUGIN_VERSION"
          sha256sum --check SHA256SUMS
          sha256sum --check "boxlite-review-kit-$PLUGIN_VERSION.zip.sha256"
          cat > "$RUNNER_TEMP/plugin-release-notes.md" <<EOF
          ## BoxLite plugin $PLUGIN_VERSION

          Built from commit $GITHUB_SHA for Codex and Claude Code.

          - Plugin ZIP: OpenAI submission payload.
          - Marketplace ZIP: installable catalog for both native hosts.
          - Review kit: public reviewer instructions, cases, and checklist.
          - Checksum files: verify the downloaded archives before use.

          Packaging validation does not establish marketplace approval or completion of the review checklist.
          EOF
          # Include drafts: gh release create --draft alone can create duplicate drafts.
          existing="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name')"
          if grep -Fxq -- "$tag" <<< "$existing"; then
            echo "Release $tag already exists; inspect it or publish a new plugin version." >&2
            exit 1
          fi
          remote_sha="$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo 'The remote plugin tag no longer matches the validated commit.' >&2
            exit 1
          fi
          # Never replace assets or publish a partial upload.
          gh release create "$tag" --verify-tag --draft --latest=false \
            --title "BoxLite plugin $PLUGIN_VERSION" --notes-file "$RUNNER_TEMP/plugin-release-notes.md" \
            "boxlite-$PLUGIN_VERSION.zip" "boxlite-marketplace-$PLUGIN_VERSION.zip" SHA256SUMS \
            "boxlite-review-kit-$PLUGIN_VERSION.zip" "boxlite-review-kit-$PLUGIN_VERSION.zip.sha256"
          gh release edit "$tag" --draft=false --latest=false
          gh release view "$tag" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
