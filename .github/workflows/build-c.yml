# Shadow rehearsal: real approvals and marked Slack notifications, with simulated build, upload and deployment steps.
name: Build C SDK
'on':
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA to build. Defaults to the event commit.
        required: false
        default: ''
        type: string
      linux_x64_only:
        description: Build only the C archive the Linux AMD64 Runner consumes.
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  resolve-ref:
    name: Prepare build configuration and commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      platforms: ${{ steps.config.outputs.platforms }}
      rust-toolchain: ${{ steps.config.outputs.rust-toolchain }}
      artifact-retention-days: ${{ steps.config.outputs.artifact-retention-days }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-config
        id: config
      - name: Validate build commit
        id: ref
        shell: bash
        run: |-
          {
            echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
    permissions:
      contents: read
      actions: read
  build:
    name: Build (${{ matrix.target }})
    needs: resolve-ref
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJson(inputs.linux_x64_only && '[{"os":"ubuntu-latest","target":"linux-x64-gnu","rust_target":"x86_64-unknown-linux-gnu"}]'
          || needs.resolve-ref.outputs.platforms) }}
    steps:
      - name: actions/checkout@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/setup-rust
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/sccache
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/build-guest
        if: runner.os == 'Linux'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Build C SDK (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Build C SDK (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Package C SDK archive
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Record build origin
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Upload artifact
        shell: bash
        run: printf '%s\n' 'Simulated'
    permissions:
      contents: read
      actions: read
