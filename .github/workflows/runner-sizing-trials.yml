---
name: BoxLite right-sized CI qualification
'on':
  push:
    branches:
    - ci/boxlite-runner-trials-2833
    paths:
    - ".github/workflows/runner-sizing-trials.yml"
permissions:
  contents: read
  actions: read
jobs:
  python:
    runs-on: boxlite-2vcpu-4gbmem-30gbdisk
    steps:
    - name: Check worker resources
      shell: bash
      run: |
        set -eu
        test "$(nproc)" -eq 2
        awk -v gib="$EXPECTED_GIB" '/^MemTotal:/ {actual=$2/1048576; print "Guest RAM (GiB):", actual; exit !(actual >= gib*0.9 && actual <= gib*1.05)}' /proc/meminfo
        df -h /
      env:
        EXPECTED_GIB: '4'
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: 62328382819183db169dc4f1b845e5fc9b6d7c22
    - uses: "./.github/actions/setup-boxlite-runner"
      if: runner.environment == 'self-hosted'
    - uses: "./.github/actions/setup-python"
      with:
        python-version: "${{ matrix.python-version }}"
    - name: Run Python unit tests with coverage
      run: make coverage:python
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
  node:
    runs-on: boxlite-2vcpu-4gbmem-30gbdisk
    steps:
    - name: Check worker resources
      shell: bash
      run: |
        set -eu
        test "$(nproc)" -eq 2
        awk -v gib="$EXPECTED_GIB" '/^MemTotal:/ {actual=$2/1048576; print "Guest RAM (GiB):", actual; exit !(actual >= gib*0.9 && actual <= gib*1.05)}' /proc/meminfo
        df -h /
      env:
        EXPECTED_GIB: '4'
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: 62328382819183db169dc4f1b845e5fc9b6d7c22
    - uses: "./.github/actions/setup-boxlite-runner"
      if: runner.environment == 'self-hosted'
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "${{ matrix.node-version }}"
        cache: npm
        cache-dependency-path: sdks/node/package-lock.json
    - name: Install dependencies
      working-directory: sdks/node
      run: npm ci
    - name: Run Node.js unit tests
      if: matrix.node-version == '18'
      working-directory: sdks/node
      run: npm run test
    - name: Run Node.js unit tests with coverage
      if: matrix.node-version != '18'
      run: make coverage:node
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node-version:
        - '18'
        - '20'
        - '22'
  dashboard:
    runs-on: boxlite-2vcpu-4gbmem-30gbdisk
    defaults:
      run:
        working-directory: apps
    steps:
    - name: Check worker resources
      shell: bash
      run: |
        set -eu
        test "$(nproc)" -eq 2
        awk -v gib="$EXPECTED_GIB" '/^MemTotal:/ {actual=$2/1048576; print "Guest RAM (GiB):", actual; exit !(actual >= gib*0.9 && actual <= gib*1.05)}' /proc/meminfo
        df -h /
      env:
        EXPECTED_GIB: '4'
    - uses: actions/checkout@v5
      with:
        persist-credentials: "${{ false }}"
        ref: 62328382819183db169dc4f1b845e5fc9b6d7c22
    - uses: "./.github/actions/setup-boxlite-runner"
    - name: Install native Node build dependencies
      run: sudo apt-get install -y --no-install-recommends build-essential python3
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Enable Corepack
      run: corepack enable
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: yarn
        cache-dependency-path: apps/yarn.lock
    - name: Install app dependencies
      run: yarn install --immutable
    - name: Run dashboard unit tests
      run: yarn nx run dashboard:test --coverage --skip-nx-cache
    timeout-minutes: 30
  secret-server-postgres:
    runs-on: boxlite-2vcpu-4gbmem-30gbdisk
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: boxlite
          POSTGRES_PASSWORD: boxlite
          POSTGRES_DB: boxlite
        ports:
        - 5432/tcp
        options: --health-cmd "pg_isready -U boxlite -d boxlite" --health-interval
          5s --health-timeout 5s --health-retries 12
    steps:
    - name: Check worker resources
      shell: bash
      run: |
        set -eu
        test "$(nproc)" -eq 2
        awk -v gib="$EXPECTED_GIB" '/^MemTotal:/ {actual=$2/1048576; print "Guest RAM (GiB):", actual; exit !(actual >= gib*0.9 && actual <= gib*1.05)}' /proc/meminfo
        df -h /
      env:
        EXPECTED_GIB: '4'
    - uses: actions/checkout@v5
      with:
        ref: 62328382819183db169dc4f1b845e5fc9b6d7c22
    - uses: "./.github/actions/setup-boxlite-runner"
    - name: Install Go race detector dependencies
      run: sudo apt-get install -y --no-install-recommends gcc libc6-dev
    - uses: "./.github/actions/setup-go"
    - name: Run Secret Server PostgreSQL integration tests
      env:
        SECRET_TEST_DATABASE_URL: postgresql://boxlite:boxlite@127.0.0.1:${{ job.services.postgres.ports['5432']
          }}/boxlite
      run: make coverage:apps:secret-server:integration
  check-generated-clients:
    runs-on: boxlite-2vcpu-8gbmem-30gbdisk
    services:
      redis:
        image: redis:7
        ports:
        - 6379:6379
    env:
      REDIS_HOST: localhost
    defaults:
      run:
        working-directory: apps
    steps:
    - name: Check worker resources
      shell: bash
      run: |
        set -eu
        test "$(nproc)" -eq 2
        awk -v gib="$EXPECTED_GIB" '/^MemTotal:/ {actual=$2/1048576; print "Guest RAM (GiB):", actual; exit !(actual >= gib*0.9 && actual <= gib*1.05)}' /proc/meminfo
        df -h /
      env:
        EXPECTED_GIB: '8'
    - uses: actions/checkout@v5
      with:
        ref: 62328382819183db169dc4f1b845e5fc9b6d7c22
    - uses: "./.github/actions/setup-boxlite-runner"
    - name: Install native Node build dependencies
      run: sudo apt-get install -y --no-install-recommends build-essential python3
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: "./.github/actions/setup-go"
      with:
        cache: 'false'
    - name: Enable corepack (yarn 4)
      run: corepack enable
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: yarn
        cache-dependency-path: apps/yarn.lock
    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
    - name: Install dependencies
      run: yarn install --immutable
    - name: Prepare offline app env
      run: |
        printf 'DEFAULT_PACKAGE_VERSION=0.0.0-dev\n' > .env
        cp api/.env.example api/.env
    - name: Pin openapi-generator version
      run: |
        openapi_version="$(node -e "console.log(require('./openapitools.json')['generator-cli'].version)")"
        yarn openapi-generator-cli version-manager set "$openapi_version"
    - name: Regenerate API clients
      run: |
        yarn nx run api-client:generate:api-client
        yarn nx run api-client-go:generate:api-client
        yarn nx run analytics-api-client:generate:api-client
    - name: Contract boundary guard (single-owner contracts)
      run: |
        # The exported cloud spec must not re-grow box-operation endpoints —
        # those belong to openapi/box.openapi.yaml (served by boxlite-rest).
        spec=dist/apps/api/openapi.json
        if [ ! -f "$spec" ]; then
          echo "::error::$spec not found; the openapi export step must run before this guard."
          exit 1
        fi
        if jq -r '.paths | keys[]' "$spec" | grep -E '/toolbox/|/exec|/files|/workspace'; then
          echo "::error::Cloud API spec contains box-operation paths. Box operations belong to the Box API contract (openapi/box.openapi.yaml), served by apps/api/src/boxlite-rest."
          exit 1
        fi
        # The Box API dialect must stay tenancy-free so one SDK dialect works
        # against local, self-hosted, and cloud servers.
        if grep -nE 'organizationId|/organizations|billing' ../openapi/box.openapi.yaml; then
          echo "::error::Box API spec contains cloud/tenancy concepts. Those belong to the cloud API (apps/api controllers outside boxlite-rest)."
          exit 1
        fi
    - name: Fail on drift
      run: |
        if [ -n "$(git status --porcelain -- libs/api-client libs/api-client-go libs/analytics-api-client)" ]; then
          git status --porcelain -- libs/api-client libs/api-client-go libs/analytics-api-client
          git diff -- libs/api-client libs/api-client-go libs/analytics-api-client | head -200
          echo "::error::Generated API clients are stale. Run 'yarn nx run api-client:generate:api-client && yarn nx run api-client-go:generate:api-client && yarn nx run analytics-api-client:generate:api-client' in apps/ and commit the result."
          exit 1
        fi
    timeout-minutes: 30
  actions-scan:
    runs-on: boxlite-2vcpu-4gbmem-64gbdisk
    steps:
    - name: Check worker resources
      shell: bash
      run: |
        set -eu
        test "$(nproc)" -eq 2
        awk -v gib="$EXPECTED_GIB" '/^MemTotal:/ {actual=$2/1048576; print "Guest RAM (GiB):", actual; exit !(actual >= gib*0.9 && actual <= gib*1.05)}' /proc/meminfo
        df -h /
      env:
        EXPECTED_GIB: '4'
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        persist-credentials: false
        ref: 62328382819183db169dc4f1b845e5fc9b6d7c22
    - name: Initialize CodeQL
      uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
      with:
        languages: actions
        build-mode: none
    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
      with:
        upload: never
        category: "/language:actions"
    timeout-minutes: 30
  python-scan:
    runs-on: boxlite-2vcpu-8gbmem-30gbdisk
    steps:
    - name: Check worker resources
      shell: bash
      run: |
        set -eu
        test "$(nproc)" -eq 2
        awk -v gib="$EXPECTED_GIB" '/^MemTotal:/ {actual=$2/1048576; print "Guest RAM (GiB):", actual; exit !(actual >= gib*0.9 && actual <= gib*1.05)}' /proc/meminfo
        df -h /
      env:
        EXPECTED_GIB: '8'
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        persist-credentials: false
        ref: 62328382819183db169dc4f1b845e5fc9b6d7c22
    - name: Initialize CodeQL
      uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
      with:
        languages: python
        build-mode: none
    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
      with:
        upload: never
        category: "/language:python"
    timeout-minutes: 30
