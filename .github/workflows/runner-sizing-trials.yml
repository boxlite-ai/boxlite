---
name: BoxLite CodeQL qualification
'on':
  push:
    branches:
    - ci/boxlite-runner-trials-2833
    paths:
    - ".github/workflows/runner-sizing-trials.yml"
permissions:
  contents: read
  actions: read
jobs:
  scan:
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: none
          runner: boxlite-4vcpu-16gbmem-64gbdisk
        - language: go
          build-mode: autobuild
          runner: boxlite-4vcpu-16gbmem-30gbdisk
        - language: javascript-typescript
          build-mode: none
          runner: boxlite-4vcpu-16gbmem-64gbdisk
        - language: rust
          build-mode: none
          runner: boxlite-4vcpu-16gbmem-64gbdisk
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        persist-credentials: false
        ref: 6a96c6a7be1a8af2113ac7acc5154c7e18314b03
    - uses: "./.github/actions/setup-boxlite-runner"
      if: matrix.language == 'go'
    - name: Install Go autobuild dependencies
      if: matrix.language == 'go'
      run: sudo apt-get install -y --no-install-recommends gcc libc6-dev
    - uses: "./.github/actions/setup-go"
      if: matrix.language == 'go'
      with:
        cache: 'false'
    - uses: actions/setup-node@v4
      if: matrix.language == 'javascript-typescript'
      with:
        node-version: '22'
    - uses: "./.github/actions/setup-rust"
      if: matrix.language == 'rust'
      with:
        cache: 'false'
    - name: Initialize CodeQL
      uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
      with:
        languages: "${{ matrix.language }}"
        build-mode: "${{ matrix.build-mode }}"
    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
      with:
        upload: never
        category: "/language:${{ matrix.language }}"
