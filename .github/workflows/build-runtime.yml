# Build BoxLite core runtime and upload artifacts.
#
# This workflow builds the Rust runtime and populates the shared cache.
# On push to main: builds and caches (existing behavior).
# On release: builds and uploads runtime tarballs to GitHub Release.
#
# Note: SDK workflows (build-wheels, build-node) are self-contained
# and trigger independently on release.
name: Build Runtime

on:
  push:
    branches: [main]
    paths:
      - 'boxlite/**'
      - 'boxlite-shared/**'
      - 'guest/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-runtime.yml'
      - '.github/workflows/config.yml'
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SKIP_INSTALL_NODEJS: '1'

jobs:
  config:
    uses: ./.github/workflows/config.yml

  build:
    name: Build Runtime (${{ matrix.os }})
    needs: config
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.config.outputs.platforms) }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ needs.config.outputs.rust-toolchain }}

      # Cache Rust dependencies
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "boxlite"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Install platform dependencies
      - name: Install platform dependencies
        run: make setup

      - name: Build BoxLite runtime
        run: make runtime

      - name: Package runtime
        run: tar czf boxlite-runtime-${{ matrix.target }}.tar.gz -C target boxlite-runtime/

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: boxlite-runtime-${{ matrix.target }}.tar.gz
          retention-days: 7

  upload_to_release:
    name: Upload runtime to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Download all runtime artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: runtime-*
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/boxlite-runtime-*.tar.gz
          fail_on_unmatched_files: true
