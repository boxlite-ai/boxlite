# Shadow rehearsal: real approvals and marked Slack notifications, with simulated build, upload and deployment steps.
name: Build Runtime
'on':
  schedule:
    - cron: 0 1 * * 1
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
jobs:
  config:
    uses: ./.github/workflows/config.yml
    permissions:
      contents: read
      actions: read
  build:
    name: Build Runtime (${{ matrix.target }})
    needs: config
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.config.outputs.platforms) }}
    steps:
      - name: actions/checkout@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/setup-rust
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/sccache
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/build-guest
        if: runner.os == 'Linux'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Build and package runtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Build and package runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Upload runtime artifact
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Package CLI binary
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Record CLI build origin
        if: inputs.tag && matrix.target == 'linux-x64-gnu'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Upload CLI artifact
        shell: bash
        run: printf '%s\n' 'Simulated'
    permissions:
      contents: read
      actions: read
  package:
    name: Stage runtime distribution
    needs: build
    runs-on: ubuntu-latest
    if: inputs.tag != ''
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout (for scripts/release/install.sh.template)
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Download all build artifacts
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Generate per-tarball .sha256 sidecars
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Render install.sh for this release
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Generate install.sh.sha256 sidecar
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Generate SHA256SUMS
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Validate rendered installer
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Attest build provenance
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Record build origin
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Stage release files
        shell: bash
        run: printf '%s\n' 'Simulated'
permissions:
  contents: read
  actions: read
