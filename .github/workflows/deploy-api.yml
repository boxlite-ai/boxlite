name: Deploy API

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region containing the dev ECR repository.
        required: true
        default: ap-southeast-1
      image_tag:
        description: ECR tag to push for the API image.
        required: true
        default: api-9e153f8b

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-api-dev-temp
  cancel-in-progress: false

jobs:
  build:
    name: Build API image only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_E2E_CLOUD_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: build-api-dev-${{ github.run_id }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          image="${{ steps.ecr.outputs.registry }}/sst-asset:${{ inputs.image_tag }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "Will push $image"

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
