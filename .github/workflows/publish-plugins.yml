name: Publish BoxLite plugin packages

on:
  workflow_run:
    workflows: [Build BoxLite plugin packages]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: >-
      github.repository == 'boxlite-ai/boxlite' &&
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.source.outputs.version }}
      artifact_id: ${{ steps.source.outputs.artifact_id }}
      created: ${{ steps.source.outputs.created }}
      build_source: ${{ steps.source.outputs.build_source }}
    steps:
      - name: Verify build and locate its exact artifact
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_WORKFLOW: ${{ github.event.workflow_run.workflow_id }}
          BUILD_PATH: ${{ github.event.workflow_run.path }}
          BUILD_ID: ${{ github.event.workflow_run.id }}
          BUILD_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          pattern='^boxlite-plugin-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
          if [[ ! "$SOURCE_TAG" =~ $pattern ]]; then
            echo 'Expected a boxlite-plugin-vVERSION build tag.' >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if [[ ${#version} -gt 128 || ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ||
                ! "$BUILD_ID" =~ ^[1-9][0-9]*$ || ! "$BUILD_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Invalid release build metadata.' >&2
            exit 1
          fi
          canonical_id="$(gh api "$repo/actions/workflows/build-plugins.yml" --jq '.id')"
          if [[ "$BUILD_PATH" != '.github/workflows/build-plugins.yml' || "$BUILD_WORKFLOW" != "$canonical_id" ]]; then
            echo 'The triggering run is not the canonical plugin builder.' >&2
            exit 1
          fi
          # The retired workflow can still be run from old tags until it is disabled.
          legacy_state="$(gh api "$repo/actions/workflows/423888825" --jq '.state')"
          if [[ "$legacy_state" != disabled_manually && "$legacy_state" != deleted ]]; then
            echo 'Disable and drain the legacy Release BoxLite plugin workflow before publishing.' >&2
            exit 1
          fi
          commit="$(gh api "$repo/commits/tags%2F$SOURCE_TAG")"
          if [[ "$(jq -er '.sha' <<< "$commit")" != "$SOURCE_SHA" ]]; then
            echo 'The release tag no longer points to the validated build.' >&2
            exit 1
          fi
          created="$(jq -er '.commit.committer.date | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))' <<< "$commit")"
          ancestry="$(gh api "$repo/compare/$SOURCE_SHA...main" --jq '.status')"
          if [[ "$ancestry" != ahead && "$ancestry" != identical ]]; then
            echo 'The release tag must point to a commit on main.' >&2
            exit 1
          fi
          artifact="boxlite-plugins-$version-$BUILD_ID-$BUILD_ATTEMPT"
          artifact_id="$(gh api "$repo/actions/runs/$BUILD_ID/artifacts?name=$artifact" |
            jq -er --arg name "$artifact" '
              select(.total_count == 1 and .artifacts[0].name == $name and .artifacts[0].expired == false)
              | .artifacts[0].id | select(type == "number" and . > 0)')"
          build_source="$(jq -cn --arg commit "$SOURCE_SHA" --arg runId "$BUILD_ID" --arg runAttempt "$BUILD_ATTEMPT" \
            '{$commit, $runId, $runAttempt}')"
          printf 'version=%s\nartifact_id=%s\ncreated=%s\nbuild_source=%s\n' \
            "$version" "$artifact_id" "$created" "$build_source" >> "$GITHUB_OUTPUT"

  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: boxlite-plugin-ghcr
    concurrency:
      group: boxlite-plugin-publish-${{ needs.verify.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: packages
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6
      - name: Publish or recover the exact OCI artifact
        id: registry
        working-directory: packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ vars.GHCR_PUBLISH_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          CREATED: ${{ needs.verify.outputs.created }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          repository="boxlite-ai/boxlite-plugin"
          image="ghcr.io/$repository"
          reference="$image:$VERSION"
          tag="boxlite-plugin-v$VERSION"
          review_kit="boxlite-review-kit-$VERSION.zip"
          sha256sum --strict --check SHA256SUMS "$review_kit.sha256"
          layout="$RUNNER_TEMP/plugin-oci:$VERSION"
          oras push --oci-layout --artifact-type application/vnd.boxlite.plugin.v1 \
            --annotation "org.opencontainers.image.created=$CREATED" \
            --annotation "org.opencontainers.image.revision=$SOURCE_SHA" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "$layout" "boxlite-$VERSION.zip:application/zip" \
            "boxlite-marketplace-$VERSION.zip:application/zip" SHA256SUMS:text/plain \
            "$review_kit:application/zip" "$review_kit.sha256:text/plain"
          digest="$(oras resolve --oci-layout "$layout")"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'ORAS did not return a manifest digest.' >&2
            exit 1
          fi
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/tags%2F$tag" --jq '.sha')"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo 'The plugin tag changed after build verification.' >&2
            exit 1
          fi
          if [[ -z "$GHCR_USER" || -z "$GHCR_TOKEN" ]]; then
            echo 'Configure the protected boxlite-plugin-ghcr environment first.' >&2
            exit 1
          fi
          registry_token="$(curl -fsS --get --user "$GHCR_USER:$GHCR_TOKEN" \
            --data-urlencode service=ghcr.io --data-urlencode "scope=repository:$repository:pull,push" \
            https://ghcr.io/token | jq -er '.token | strings | select(length > 0)')"
          endpoint="https://ghcr.io/v2/$repository"
          # Package ACLs must already exist before the workflow publishes any version.
          curl -fsS --output /dev/null -H "Authorization: Bearer $registry_token" "$endpoint/tags/list?n=1"
          status="$(curl -sS --head --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $registry_token" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "$endpoint/manifests/$VERSION")"
          registry_config="$RUNNER_TEMP/plugin-registry.json"
          trap 'rm -f -- "$registry_config"' EXIT
          printf '%s\n' "$GHCR_TOKEN" |
            oras login ghcr.io --username "$GHCR_USER" --password-stdin --registry-config "$registry_config"
          case "$status" in
            404) oras cp --from-oci-layout --to-registry-config "$registry_config" "$layout" "$reference" ;;
            200) printf 'Checking existing version %s before resuming.\n' "$reference" ;;
            *) printf 'Registry returned HTTP %s while checking %s.\n' "$status" "$reference" >&2; exit 1 ;;
          esac
          if [[ "$(oras resolve --registry-config "$registry_config" "$reference")" != "$digest" ]]; then
            echo 'Version points to a different OCI manifest. The workflow will not replace it.' >&2
            exit 1
          fi
          printf 'image=%s\ndigest=%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the verified artifact
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.registry.outputs.image }}
          subject-digest: ${{ steps.registry.outputs.digest }}
      - name: Attest the verified tag build
        id: attest-source
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3.0.0
        with:
          subject-name: ${{ steps.registry.outputs.image }}
          subject-digest: ${{ steps.registry.outputs.digest }}
          predicate-type: https://boxlite.ai/attestations/plugin-build-source/v1
          predicate: ${{ needs.verify.outputs.build_source }}
      - name: Report the version and verified digest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE: ${{ steps.registry.outputs.image }}
          DIGEST: ${{ steps.registry.outputs.digest }}
        run: printf 'Plugin version `%s`\n\nDownload with `oras pull %s@%s`.\n' "$VERSION" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
