# Run unit tests across all SDKs.
#
# This workflow runs unit tests only (no VM/integration tests).
# GitHub runners do not support nested virtualization, so we cannot run
# tests that require actual VMs.
#
# Test coverage:
# - Rust: cargo-nextest (unit tests only, with llvm-cov coverage)
# - Python: pytest with -m "not integration"
# - Node.js: vitest (all tests are unit tests)
name: Test

on:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'src/boxlite/**'
      - 'src/shared/**'
      - 'src/cli/**'
      - 'src/guest/**'
      - 'src/deps/e2fsprogs-sys/**'
      - '.cargo/**'
      - '.gitmodules'
      - 'scripts/common.sh'
      - 'scripts/build/build-guest-deps.sh'
      - 'scripts/build/build-guest.sh'
      - 'scripts/build/build-libseccomp.sh'
      - 'scripts/util.sh'
      - 'scripts/setup/**'
      - 'scripts/test/test-guest-artifacts.sh'
      - 'scripts/test/test-guest-build-contracts.sh'
      - 'Makefile'
      - 'make/**'
      - 'rust-toolchain.toml'
      - 'sdks/**'
      - 'apps/api/**'
      - 'apps/package.json'
      - 'apps/yarn.lock'
      - 'apps/nx.json'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test.yml'
      - '.github/workflows/config.yml'
  # No path filter on pull_request: the `Test (conclusion)` job is a required
  # status check, so this workflow must run on EVERY PR and report it. A
  # path-skipped workflow leaves the required check stuck "Pending" → PR blocked.
  # Per-suite filtering still happens in the `changes` job (jobs skip when
  # unaffected); the conclusion job reports success-or-skipped.
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # Load shared configuration
  config:
    uses: ./.github/workflows/config.yml

  # Detect which files changed to conditionally run tests
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      cli: ${{ steps.filter.outputs.boxlite_cli }}
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      go: ${{ steps.filter.outputs.go }}
      api: ${{ steps.filter.outputs.api }}
      guest_artifacts: ${{ steps.filter.outputs.guest_artifacts }}
      setup: ${{ steps.filter.outputs.setup }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # In a merge queue, diff against the merge-group base/head (no PR base
          # exists). Empty on pull_request/push, where paths-filter ignores them.
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          filters: |
            rust:
              - 'src/boxlite/**'
              - 'src/shared/**'
              - 'src/guest/**'
              - 'make/test.mk'
              - '**/Cargo.toml'
              - 'Cargo.lock'
            cli:
              - 'src/cli/**'
            python:
              - 'sdks/python/**'
            node:
              - 'sdks/node/**'
            go:
              - 'sdks/go/**'
            api:
              - 'apps/api/**'
              - 'apps/package.json'
              - 'apps/yarn.lock'
              - 'apps/nx.json'
            guest_artifacts:
              - '.cargo/**'
              - '.gitmodules'
              - 'src/deps/e2fsprogs-sys/**'
              - 'src/guest/**'
              - 'src/shared/**'
              - 'scripts/build/build-guest-deps.sh'
              - 'scripts/build/build-guest.sh'
              - 'scripts/build/build-libseccomp.sh'
              - 'scripts/common.sh'
              - 'scripts/util.sh'
              - 'scripts/setup/**'
              - 'scripts/test/test-guest-artifacts.sh'
              - 'scripts/test/test-guest-build-contracts.sh'
              - 'Makefile'
              - 'make/**'
              - 'rust-toolchain.toml'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/config.yml'
              - '.github/workflows/test.yml'
            setup:
              - '.gitmodules'
              - 'scripts/setup/setup-submodules.sh'
              - 'scripts/test/test-setup-submodules.sh'
              - 'make/setup.mk'
              - 'make/test.mk'
              - '.github/workflows/test.yml'

  # Rust unit tests (boxlite-shared only - boxlite requires native libs not available in CI)
  rust:
    name: Rust Tests (${{ matrix.platform.target }})
    needs: [config, changes]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.config.outputs.platforms) }}

    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.config.outputs.rust-toolchain }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq libseccomp-dev protobuf-compiler util-linux

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Rust unit tests with coverage
        # Only test boxlite-shared - boxlite requires libkrun/libgvproxy not available in CI
        run: cargo llvm-cov nextest -p boxlite-shared --lib --profile ci --lcov --output-path lcov.info

      - name: Run OpenAPI reference-server unit tests
        # Keyed on BoxliteError's Display text (src/shared/src/errors.rs, in this
        # filter), so a new variant must add its row there before the reference
        # server can name the class. stdlib only — no extra setup.
        run: make test:unit:openapi

      - name: Run guest unit tests
        if: runner.os == 'Linux'
        run: make test:unit:guest

      - name: Run guest ownership tests
        if: runner.os == 'Linux'
        run: make test:guest-perms

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: lcov.info
          flags: rust-shared
          use_oidc: true
          fail_ci_if_error: false

  # cli unit tests (integration tests in tests/ are ignored - require VM)
  cli:
    name: CLI Unit Tests (${{ matrix.platform.target }})
    needs: [config, changes]
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.config.outputs.platforms) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.config.outputs.rust-toolchain }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - uses: ./.github/actions/sccache

      - name: Run boxlite-cli unit tests
        # Only run tests in src/ (name contains "::tests::"); skip integration tests in tests/ (require VM)
        env:
          BOXLITE_DEPS_STUB: "1"
        run: cargo nextest run -p boxlite-cli --profile ci -E 'test(::tests::)'

  # Python SDK unit tests
  python:
    name: Python Tests (${{ matrix.platform.target }} / Python ${{ matrix.python-version }})
    needs: [config, changes]
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.config.outputs.platforms) }}
        python-version: ${{ fromJson(needs.config.outputs.python-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio

      - name: Run Python unit tests
        working-directory: sdks/python
        run: python -m pytest tests/ -v -m "not integration"

  # Node.js SDK unit tests
  node:
    name: Node.js Tests (${{ matrix.platform.target }} / Node ${{ matrix.node-version }})
    needs: [config, changes]
    if: ${{ needs.changes.outputs.node == 'true' }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.config.outputs.platforms) }}
        node-version: ${{ fromJson(needs.config.outputs.node-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: sdks/node
        run: npm install

      - name: Run Node.js unit tests
        working-directory: sdks/node
        run: npm run test

  # Go SDK unit tests
  go:
    name: Go Tests (${{ matrix.platform.target }})
    needs: [config, changes]
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.config.outputs.platforms) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-go

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.config.outputs.rust-toolchain }}

      - name: Install build dependencies
        run: make setup:build

      - uses: ./.github/actions/sccache

      - name: Run Go unit tests
        run: make test:unit:go

  guest_artifacts:
    name: Guest Artifacts (${{ matrix.os }} / ${{ matrix.target }} / ${{ matrix.profile }})
    needs: [config, changes]
    if: ${{ needs.changes.outputs.guest_artifacts == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            profile: release
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            profile: debug
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            profile: release
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            profile: debug
          - os: macos-15
            target: aarch64-unknown-linux-musl
            profile: release
    permissions:
      contents: read
    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.config.outputs.rust-toolchain }}

      - name: Set up build dependencies
        run: make setup:build

      - name: Build and qualify guest artifacts
        run: make test:guest-artifacts GUEST_TARGET=${{ matrix.target }} PROFILE=${{ matrix.profile }}

  setup:
    name: Submodule setup tests
    needs: changes
    if: ${{ needs.changes.outputs.setup == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Test worktree submodule setup
        run: make test:setup:submodules

  # API tests need real Redis and Postgres services for integration coverage.
  api:
    name: API Tests
    needs: ["config", "changes"]
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: "ubuntu-latest"
    permissions: # Repository-controlled tests need no write scopes.
      contents: "read"
    services: # Integration dependencies used by API specs.
      redis: # Distributed-lock integration tests.
        image: "redis:7"
        ports: # Bind only on the ephemeral CI runner.
          - "6379:6379"
        options: >- # Wait for Redis before Jest starts.
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boxlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env: # Service connection values are non-secret CI-local defaults.
      REDIS_HOST: "localhost"
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: boxlite
    defaults: # Keep package-manager commands inside the apps workspace.
      run: # Applies only to shell steps, not actions.
        working-directory: "apps"
    steps: # Install exactly the lockfile-defined workspace before testing.
      - uses: actions/checkout@v5
        with: # Native workspace dependencies are submodules.
          submodules: "recursive"
          persist-credentials: ${{ false }}
      - name: Checkout Commerce contract provider
        uses: actions/checkout@v5
        with:
          repository: boxlite-ai/boxlite-commerce
          path: .contract/boxlite-commerce
          persist-credentials: ${{ false }}
      - name: Enable Corepack
        run: "corepack enable"
      - uses: actions/setup-node@v4
        with: # Match the apps workspace toolchain and cache key.
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "apps/yarn.lock"
      - name: Install app dependencies
        run: "yarn install --immutable"
      - name: Install Commerce contract dependencies
        working-directory: .contract/boxlite-commerce
        run: "npm ci --ignore-scripts --no-audit --no-fund"
      - name: Run API unit tests
        env:
          BOXLITE_COMMERCE_REPOSITORY: ${{ github.workspace }}/.contract/boxlite-commerce
        run: "yarn nx run api:test"

  # End API test job.

  # Single required status check for branch protection / merge queue.
  # Passes only if every job above succeeded or was skipped (path-filtered).
  # `if: !cancelled()` is required: without it a failed dependency would skip
  # this job, and GitHub treats a skipped required check as success.
  # NOTE: keep `needs` in sync with the jobs above when adding/removing jobs.
  test-conclusion:
    name: Test (conclusion)
    needs: [config, changes, rust, cli, python, node, go, setup, api, guest_artifacts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All test jobs passed or were skipped
        run: |
          jq -C <<< '${{ toJSON(needs) }}'
          jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< '${{ toJSON(needs) }}'
