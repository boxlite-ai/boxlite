# Run hosted-runner tests and collect coverage across the runtime and SDKs.
#
# Non-VM integration suites use test-only runtime construction because GitHub
# runners cannot provide the virtualization needed by production startup.
#
# Test coverage:
# - Rust: units and non-VM integration, with llvm-cov coverage
# - Python: pytest with -m "not integration"
# - Node.js: vitest unit project
# - Go: SDK and networking bridge; API: Jest with Postgres and Redis
name: Test

on:
  merge_group:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/boxlite/**'
      - 'src/shared/**'
      - 'src/cli/**'
      - 'src/guest/**'
      - 'src/test-utils/**'
      - 'src/deps/bubblewrap-sys/**'
      - 'src/deps/e2fsprogs-sys/**'
      - 'src/deps/libkrun-sys/**'
      - 'src/deps/libgvproxy-sys/**'
      - 'src/**/*.rs'
      - '.cargo/**'
      - '.config/nextest.toml'
      - '.gitmodules'
      - 'scripts/setup/**'
      - 'Makefile'
      - 'make/**'
      - 'rust-toolchain.toml'
      - 'sdks/**'
      - 'apps/api/**'
      - 'apps/package.json'
      - 'apps/yarn.lock'
      - 'apps/nx.json'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test.yml'
      - '.github/workflows/lint.yml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/config.yml'
      - '.github/actions/**'
      - '.github/ci-config.json'
      - 'openapi/**'
      - 'codecov.yml'
      - '!**/*.md'
  # No path filter on pull_request: the `Test (conclusion)` job is a required
  # status check, so this workflow must run on EVERY PR and report it. A
  # path-skipped workflow leaves the required check stuck "Pending" → PR blocked.
  # Per-suite filtering still happens in the `changes` job (jobs skip when
  # unaffected); the conclusion job reports success-or-skipped.
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # Detect which files changed to conditionally run tests
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      platforms: ${{ steps.config.outputs.platforms }}
      rust-toolchain: ${{ steps.config.outputs.rust-toolchain }}
      python-test-matrix: ${{ steps.config.outputs.python-test-matrix }}
      node-test-matrix: ${{ steps.config.outputs.node-test-matrix }}
      rust: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      python: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.python == 'true' }}
      node: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.node == 'true' }}
      go: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.go == 'true' }}
      api: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
      setup: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.setup == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate Makefile syntax
        run: make -n help
      - uses: ./.github/actions/ci-config
        id: config
        with:
          full-matrix: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          # In a merge queue, diff against the merge-group base/head (no PR base
          # exists). Empty on pull_request/push, where paths-filter ignores them.
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          # rust lists every local package its test builds compile
          # (cargo tree -e normal,build,dev --target all), plus everything else
          # the jobs read: manifests, toolchain, cargo, nextest, Codecov and CI
          # config, and the local composite actions they use. rust also matches
          # the Make recipes it runs, the OpenAPI reference server whose tests it
          # runs, and src/**/*.rs: a core unit test scans every Rust source
          # under src/ (no_config_json_in_tracing_sigil_workspace_wide).
          filters: |
            rust:
              - 'src/boxlite/**/!(*.md)'
              - 'src/cli/**/!(*.md)'
              - 'src/shared/**/!(*.md)'
              - 'src/guest/**/!(*.md)'
              - 'src/hypervisor/**/!(*.md)'
              - 'src/vmm/**/!(*.md)'
              - 'sdks/c/src/**/!(*.md)'
              - 'sdks/c/build.rs'
              - 'sdks/python/src/**/!(*.md)'
              - 'sdks/node/src/**/!(*.md)'
              - 'sdks/node/build.rs'
              - 'src/test-utils/**/!(*.md)'
              - 'src/deps/bubblewrap-sys/**/!(*.md)'
              - 'src/deps/e2fsprogs-sys/**/!(*.md)'
              - 'src/deps/libkrun-sys/**/!(*.md)'
              - 'src/**/*.rs'
              - '.gitmodules'
              - 'Makefile'
              - 'make/vars.mk'
              - 'make/dev.mk'
              - 'make/test.mk'
              - 'make/coverage.mk'
              - 'openapi/**/!(*.md)'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**/!(*.md)'
              - '.config/nextest.toml'
              - 'codecov.yml'
              - '.github/actions/setup-rust/**/!(*.md)'
              - '.github/actions/setup-python/**/!(*.md)'
              - '.github/ci-config.json'
              - '.github/actions/ci-config/**/!(*.md)'
              - '.github/workflows/test.yml'
            python:
              - 'sdks/python/**/!(*.md)'
              - 'Makefile'
              - 'make/vars.mk'
              - 'make/dev.mk'
              - 'make/test.mk'
              - 'make/coverage.mk'
              - 'codecov.yml'
              - '.github/actions/setup-python/**/!(*.md)'
              - '.github/ci-config.json'
              - '.github/actions/ci-config/**/!(*.md)'
              - '.github/workflows/test.yml'
            node:
              - 'sdks/node/**/!(*.md)'
              - 'Makefile'
              - 'make/vars.mk'
              - 'make/dev.mk'
              - 'make/test.mk'
              - 'make/coverage.mk'
              - 'codecov.yml'
              - '.github/ci-config.json'
              - '.github/actions/ci-config/**/!(*.md)'
              - '.github/workflows/test.yml'
            go:
              - 'sdks/go/**/!(*.md)'
              - 'src/deps/libgvproxy-sys/**/!(*.md)'
              - 'Makefile'
              - 'make/vars.mk'
              - 'make/build.mk'
              - 'make/setup.mk'
              - 'make/dev.mk'
              - 'make/test.mk'
              - 'make/coverage.mk'
              - 'make/quality.mk'
              - '.pre-commit-config.yaml'
              - 'codecov.yml'
              - '.github/actions/setup-go/**/!(*.md)'
              - '.github/actions/setup-rust/**/!(*.md)'
              - '.github/actions/sccache/**/!(*.md)'
              - '.github/ci-config.json'
              - '.github/actions/ci-config/**/!(*.md)'
              - '.github/workflows/test.yml'
              - '.github/workflows/lint.yml'
            api:
              - 'apps/api/**/!(*.md)'
              - 'apps/package.json'
              - 'apps/yarn.lock'
              - 'apps/nx.json'
              - 'apps/jest.preset.js'
              - 'codecov.yml'
              - '.github/workflows/test.yml'
            setup:
              - '.gitmodules'
              - 'scripts/setup/setup-submodules.sh'
              - 'scripts/test/test-setup-submodules.sh'
              - 'make/setup.mk'
              - 'make/test.mk'
              - '.github/workflows/test.yml'

  # Merge core, shared, REST, CLI, native VMM and Linux guest coverage.
  # Codecov gates changed lines at 90% and reports total coverage separately.
  rust:
    name: Rust Tests (${{ matrix.platform.target }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.changes.outputs.platforms) }}

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.changes.outputs.rust-toolchain }}

      - uses: ./.github/actions/setup-python
        # PyO3 unit tests embed an interpreter instead of building a wheel.

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq libseccomp-dev protobuf-compiler util-linux

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check out vendored libkrun
        # net::socket_path's vendor-pin unit test reads the libkrun source.
        # The libkrun build itself stays stubbed below.
        run: git submodule update --init --depth 1 -- src/deps/libkrun-sys/vendor/libkrun

      - name: Run Rust unit tests with coverage
        # The core crate's dev-dependency boxlite-test-utils re-enables its
        # default features, which pull in the -sys crates; those build from
        # vendored submodules this job does not check out.
        env:
          BOXLITE_DEPS_STUB: "1"
        run: make coverage:lcov NEXTEST_PROFILE=ci

      - name: Run OpenAPI reference-server unit tests
        # Keyed on BoxliteError's Display text (src/shared/src/errors.rs, in this
        # filter), so a new variant must add its row there before the reference
        # server can name the class. stdlib only — no extra setup.
        run: make test:unit:openapi

      - name: Run guest ownership tests
        if: runner.os == 'Linux'
        run: make test:guest-perms

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/coverage/lcov.info
          flags: rust-unit
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true

  # Python SDK unit tests
  python:
    name: Python Tests (${{ matrix.platform.target }} / Python ${{ matrix.python-version }})
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.python-test-matrix) }}

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python unit tests with coverage
        run: make coverage:python

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/coverage/python/coverage.xml
          flags: python
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true

  # Node.js SDK unit tests
  node:
    name: Node.js Tests (${{ matrix.platform.target }} / Node ${{ matrix.node-version }})
    needs: changes
    if: ${{ needs.changes.outputs.node == 'true' }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.node-test-matrix) }}

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json

      # `npm ci` installs the committed tree verbatim. `npm install` would
      # re-resolve per leg — npm picks manifests by `engines`, so Node 22 lands
      # on vite 8 while Node 18 lands on vite 6, and npm 10.x's arborist
      # crashes walking the Node 22 peer set. One committed tree removes both.
      # The lockfile is resolved under Node 18, the floor of the SDK's
      # supported range, which keeps vite on 6 — a tree all three legs run.
      # Regenerating under Node 22 pins vite 8, whose rolldown dependency
      # imports `styleText` from `node:util`, and the Node 18 leg then dies
      # at vitest startup. vitest 4 itself excludes Node 18 in its `engines`,
      # so that leg warns EBADENGINE either way; the suite passes there.
      - name: Install dependencies
        working-directory: sdks/node
        run: npm ci

      - name: Run Node.js unit tests
        if: matrix.node-version == '18'
        working-directory: sdks/node
        run: npm run test

      - name: Run Node.js unit tests with coverage
        if: matrix.node-version != '18'
        run: make coverage:node

      - name: Upload Node.js coverage to Codecov
        if: matrix.node-version != '18'
        uses: codecov/codecov-action@v5
        with:
          files: target/coverage/node/lcov.info
          flags: node
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true

  # Go SDK unit tests
  go:
    name: Go Tests (${{ matrix.platform.target }})
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.changes.outputs.platforms) }}

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-go

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.changes.outputs.rust-toolchain }}

      - name: Install build dependencies
        run: make setup:build

      - uses: ./.github/actions/sccache

      - name: Run Go SDK and networking tests with coverage
        run: make coverage:go

      # coverage:go has already built the native library needed by both analyzers.
      - name: Run Go vet
        if: matrix.platform.target == 'linux-x64-gnu'
        run: make lint:go

      - name: golangci-lint
        if: matrix.platform.target == 'linux-x64-gnu'
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          working-directory: sdks/go
          args: --timeout=5m --build-tags boxlite_dev

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/coverage/go-sdk.out,target/coverage/gvproxy.out
          flags: go
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true

  guest_artifacts:
    name: Guest Artifacts (${{ matrix.os }} / ${{ matrix.target }} / ${{ matrix.profile }})
    needs: changes
    # Qualify all five builds periodically without repeating them on routine CI runs.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            profile: release
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            profile: debug
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            profile: release
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            profile: debug
          - os: macos-15
            target: aarch64-unknown-linux-musl
            profile: release
    permissions:
      contents: read
    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.changes.outputs.rust-toolchain }}

      - name: Set up build dependencies
        run: make setup:build

      - name: Build and qualify guest artifacts
        run: make test:guest-artifacts GUEST_TARGET=${{ matrix.target }} PROFILE=${{ matrix.profile }}

  setup:
    name: Submodule setup tests
    needs: changes
    if: ${{ needs.changes.outputs.setup == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Test worktree submodule setup
        run: make test:setup:submodules

  # API tests need real Redis and Postgres services for integration coverage.
  api:
    name: API Tests
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: "ubuntu-latest"
    permissions: # Read source; OIDC authenticates the coverage upload.
      contents: "read"
      id-token: write
    services: # Integration dependencies used by API specs.
      redis: # Distributed-lock integration tests.
        image: "redis:7"
        ports: # Bind only on the ephemeral CI runner.
          - "6379:6379"
        options: >- # Wait for Redis before Jest starts.
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boxlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env: # Service connection values are non-secret CI-local defaults.
      REDIS_HOST: "localhost"
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: boxlite
    defaults: # Keep package-manager commands inside the apps workspace.
      run: # Applies only to shell steps, not actions.
        working-directory: "apps"
    steps: # Install exactly the lockfile-defined workspace before testing.
      - uses: actions/checkout@v5
        with: # Native workspace dependencies are submodules.
          submodules: "recursive"
          persist-credentials: ${{ false }}
      - name: Enable Corepack
        run: "corepack enable"
      - uses: actions/setup-node@v4
        with: # Match the apps workspace toolchain and cache key.
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "apps/yarn.lock"
      - name: Install app dependencies
        run: "yarn install --immutable"
      - name: Run API unit tests
        run: "yarn nx run api:test --coverage --skip-nx-cache"

      - name: Upload API coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/coverage/api/lcov.info
          flags: api
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true

  # A skipped test job cannot publish Codecov's separately required status.
  # Validate the PR's changed files with Codecov instead of forcing a pass.
  coverage-empty:
    name: Codecov (no coverage changes)
    needs: changes
    if: >-
      ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
          needs.changes.result == 'success' &&
          needs.changes.outputs.rust == 'false' &&
          needs.changes.outputs.python == 'false' &&
          needs.changes.outputs.node == 'false' &&
          needs.changes.outputs.go == 'false' &&
          needs.changes.outputs.api == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Report coverage is unnecessary for this change
        uses: codecov/codecov-action@v5
        with:
          run_command: empty-upload
          use_oidc: true
          fail_ci_if_error: true

  # Single required status check for branch protection / merge queue.
  # Passes only if every job above succeeded or was skipped (path- or event-filtered).
  # `if: !cancelled()` is required: without it a failed dependency would skip
  # this job, and GitHub treats a skipped required check as success.
  # NOTE: keep `needs` in sync with the jobs above when adding/removing jobs.
  test-conclusion:
    name: Test (conclusion)
    needs: [changes, rust, python, node, go, setup, api, guest_artifacts, coverage-empty]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All test jobs passed or were skipped
        run: |
          jq -C <<< '${{ toJSON(needs) }}'
          jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< '${{ toJSON(needs) }}'
