# Deploys BoxLite through mdeploy, on whichever cloud the stage lives in.
#
# The workflow makes no cloud decision of its own. A stage's declaration says
# which cloud it is in — `home` — and the preflight below reads it, so adding a
# stage on another cloud is an edit to that declaration rather than to this
# file. Nothing here names ECR, Artifact Registry, a region or a repository.
#
# That declaration is not in the checkout: `.mstage.config.json` names an
# account and is not committed, so setup-infra asks `mstage config get` for this
# stage's block and restores the file every tool below reads.
#
# One apply, always. Deploying module by module would mean `sst --target`, which
# aborts with `Duplicate resource URN` on a child of `sst:aws:Vpc`
# (pulumi/pulumi#24303, open) and which this repository bans outright after
# PR #1095 stalled a stack mid-provider-migration — a targeted update omits the
# shared resources it still depends on. Both engines order the stack themselves:
# every provider takes the handles it depends on as arguments and
# `stack/index.ts` threads them, and an unchanged module is a no-op in the diff,
# so a whole-stack apply does no more work.
#
# Everything that can refuse the deploy happens in the first job, and every one
# of those checks is a read.
name: mdeploy

on:
  workflow_dispatch:
    inputs:
      # A choice rather than free text: this value selects the job's deployment
      # Environment, and an Environment carries the secrets and the reviewers of
      # the stage it names. Enforced across every workflow by
      # apps/infra/deployment/release-safety.test.ts.
      stage:
        description: Stage to deploy, as declared in its .mstage.config.json block
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

      image_tag:
        description: Commit SHA of the images to deploy, or a git tag naming one (defaults to this ref)
        required: false
      runner_ref:
        description: >-
          Commit SHA, or a git tag, of a runner binary staged for this stage.
          Empty installs the published release instead.
        required: false
      apply:
        description: Apply the change. Off previews it and stops.
        required: true
        type: boolean
        default: false
      confirm:
        description: Required for a stage whose declaration marks it protected
        required: true
        type: boolean
        default: false

  # Called by an orchestrating workflow once the artifacts it names are in
  # place. The allowlist above is what a person types; a caller passes a string
  # because `workflow_call` has no choice type — and the caller is a workflow in
  # this repository whose own input is an allowlist.
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      image_tag:
        required: false
        type: string
        default: ''
      runner_ref:
        required: false
        type: string
        default: ''
      apply:
        required: false
        type: boolean
        default: false
      confirm:
        required: false
        type: boolean
        default: false

concurrency:
  # An app and stage keep one checkpoint, and two applies against one stage read
  # and write the same file — the second to finish erases what the first
  # recorded. A repository-wide group name is what serialises them.
  group: mdeploy-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  BOXLITE_IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
  # gh is installed on a runner but never signed in, and the stage declaration
  # names github a required provider — so every step that reaches mstage
  # fails on the session before it fails on anything worth reading.
  GH_TOKEN: ${{ github.token }}

jobs:
  preflight:
    name: preflight
    # The job that reaches a protected Environment reaches the cloud role behind
    # it, so it runs from main and nowhere else.
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.config.outputs.kind }}
      region: ${{ steps.config.outputs.region }}
      image_tag: ${{ steps.image.outputs.sha }}
      runner_ref: ${{ steps.runner.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Tags and the commits they name. A shallow checkout carries neither,
          # and a dispatcher naming a release would be told it does not exist.
          fetch-depth: 0

      - uses: ./.github/actions/setup-infra
        with:
          stages: ${{ inputs.stage }}
          stage-config: ${{ vars.BOXLITE_MSTAGE_BOXLITE_APP_CONFIG }}

      # Both names become commits here and nowhere else. The image is verified
      # in this job and installed in the next one; resolving in each would be
      # two answers to "which commit", and a tag that moved between them would
      # verify one image and deploy another.
      - id: image
        uses: ./.github/actions/resolve-ref
        with:
          ref: ${{ inputs.image_tag }}
          fallback: ${{ github.sha }}

      # No fallback: an empty input is a release-mode deploy, which addresses a
      # version rather than a commit and needs no ref at all.
      - id: runner
        if: inputs.runner_ref != ''
        uses: ./.github/actions/resolve-ref
        with:
          ref: ${{ inputs.runner_ref }}

      - name: Address the commit the image ref names
        shell: bash
        run: printf 'BOXLITE_IMAGE_TAG=%s\n' '${{ steps.image.outputs.sha }}' >> "$GITHUB_ENV"

      # ----------------------------------------------------------- 1/5
      # Which cloud this stage deploys to, and where in it. One file says both,
      # and nothing after this point knows the answer in advance.
      - name: Resolve the stage
        id: config
        working-directory: apps/infra
        run: |
          set -Eeuo pipefail
          if ! output="$(npm run --silent mbuild inspect -- --stage "${{ inputs.stage }}" 2>&1)"; then
            echo "::error title=stage::$output"
            exit 1
          fi
          echo "$output"
          echo "$output" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------- 2/5
      # An identity for that cloud. GitHub's OIDC token is the only thing this
      # runner can prove, so federation goes through the provider's own action;
      # mstage cannot mint a session it holds no token for.
      - name: Federate an AWS identity
        if: steps.config.outputs.kind == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Composed from the stage's AWS_ACCOUNT_ID, not a stored role ARN: the
          # role name is fixed per stage (bootstrap/environment.ts's
          # githubDeployRoleName, the same name bootstrap/aws.ts creates the role
          # under), so only the account id has to be configured. Every other
          # deploy workflow in this repository composes it the same way.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/boxlite-${{ inputs.stage }}-github-deploy
          aws-region: ${{ steps.config.outputs.region }}
          role-session-name: mdeploy-${{ github.run_id }}

      - name: Federate a GCP identity
        if: steps.config.outputs.kind == 'artifact-registry'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}

      # ----------------------------------------------------------- 3/5
      # A read, so a transient failure says nothing about the answer: retried.
      - name: Verify the session through mstage
        working-directory: apps/infra
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if npm run --silent mstage login; then exit 0; fi
            echo "mstage reports no usable session (attempt $attempt/3); retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error title=mstage::No usable session for ${{ steps.config.outputs.kind }} after 3 attempts"
          exit 1

      # Both of these answer about the stage's own contents, so a second ask
      # returns the same answer: neither is retried.
      - name: Verify the stage configuration still matches its own fingerprint
        working-directory: apps/infra
        run: npm run --silent mstage env digest -- --stage "${{ inputs.stage }}"

      # ----------------------------------------------------------- 4/5
      # Does this stage hold this commit yet? mbuild answers, because mbuild
      # composes the address the deploy resolves — a check that built its own
      # string could pass against an address nothing pulls.
      #
      # A deploy dispatched while its commit is still being published used to
      # fail minutes in, on a task that could not pull, after the apply had
      # already created resources.
      - name: Verify the images
        working-directory: apps/infra
        run: npm run --silent mbuild verify -- --tag "$BOXLITE_IMAGE_TAG" --stage "${{ inputs.stage }}"

      # ----------------------------------------------------------- 5/5
      # Read through mstage's own loader, out of the declaration setup-infra
      # restored — the same reader mdeploy refuses on (src/run.ts's
      # `scope.protect`). The point of asking here is when rather than whether:
      # a refusal in the job that applies comes after this one has federated an
      # identity and taken the stage's concurrency group.
      - name: Confirm a protected stage
        working-directory: apps/infra
        env:
          STAGE: ${{ inputs.stage }}
          CONFIRMED: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          protected="$(node -e "
            const { loadConfig, stageIn } = require('mstage/config');
            process.stdout.write(String(Boolean(stageIn(loadConfig(), process.env.STAGE).protect)))
          ")"
          if [ "$protected" = 'true' ] && [ "$CONFIRMED" != 'true' ]; then
            echo "::error title=protected::$STAGE is protected; re-dispatch with confirm"
            exit 1
          fi

  deploy:
    name: ${{ inputs.apply && 'deploy' || 'preview' }} ${{ inputs.stage }}
    needs: preflight
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    # What this job deploys, as commits rather than as the names it was given.
    # The workflow-level BOXLITE_IMAGE_TAG still holds the raw input, which may
    # be a tag; taking preflight's answer is what makes the image this job
    # deploys the image preflight verified.
    env:
      BOXLITE_IMAGE_TAG: ${{ needs.preflight.outputs.image_tag }}
      # A staged binary is addressed by the commit it was produced from; without
      # one the stage installs the published release, which is the default the
      # tool already applies. Both are named here so the mode is readable in the
      # run rather than inferred from an absence.
      RUNNER_ARTIFACT_SOURCE: ${{ needs.preflight.outputs.runner_ref != '' && 'build' || 'release' }}
      RUNNER_ARTIFACT_REF: ${{ needs.preflight.outputs.runner_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-infra
        with:
          stages: ${{ inputs.stage }}
          stage-config: ${{ vars.BOXLITE_MSTAGE_BOXLITE_APP_CONFIG }}

      - name: Federate an AWS identity
        if: needs.preflight.outputs.kind == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Composed from the stage's AWS_ACCOUNT_ID, not a stored role ARN: the
          # role name is fixed per stage (bootstrap/environment.ts's
          # githubDeployRoleName, the same name bootstrap/aws.ts creates the role
          # under), so only the account id has to be configured. Every other
          # deploy workflow in this repository composes it the same way.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/boxlite-${{ inputs.stage }}-github-deploy
          aws-region: ${{ needs.preflight.outputs.region }}
          role-session-name: mdeploy-${{ github.run_id }}

      - name: Federate a GCP identity
        if: needs.preflight.outputs.kind == 'artifact-registry'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}

      # The apply asks Certificate Manager what this project already holds
      # before it changes anything (`src/dns-authorization.ts`), and it asks
      # through the CLI — which the federation above writes a credential for but
      # does not install. Without it the check reports that it could not read
      # and lets the apply through, which is the guard never running at all.
      - name: Install gcloud
        if: needs.preflight.outputs.kind == 'artifact-registry'
        uses: google-github-actions/setup-gcloud@v2

      # Never retried. A run killed mid-apply can leave the per-stage lock held,
      # and a second attempt then fails on the lock rather than on the cause
      # worth reading. Clearing it by hand is a first-class command:
      # `npm run mstage state unlock -- --stage <stage>`.
      - name: Apply
        working-directory: apps/infra
        run: |
          set -Eeuo pipefail
          if [ "${{ inputs.apply }}" = "true" ]; then
            npm run mdeploy -- --stage "${{ inputs.stage }}" ${{ inputs.confirm && '--confirm' || '' }}
          else
            npm run mdeploy -- --stage "${{ inputs.stage }}" --diff
          fi

      - name: Report
        if: always()
        run: |
          set -Eeuo pipefail
          {
            echo "### mdeploy ${{ inputs.stage }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$BOXLITE_IMAGE_TAG\` |"
            echo "| cloud | \`${{ needs.preflight.outputs.kind == 'ecr' && 'aws' || 'gcp' }}\` in \`${{ needs.preflight.outputs.region }}\` |"
            echo "| intent | \`${{ inputs.apply && 'apply' || 'preview' }}\` |"
            echo "| result | \`${{ job.status }}\` |"
            echo
            echo "From a checkout:"
            echo
            echo '```'
            echo "npm run mdeploy -- --stage ${{ inputs.stage }} --diff"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
