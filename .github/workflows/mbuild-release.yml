# Simulation for the release workflow.
name: mbuild-release
run-name: '[SHADOW] publish ${{ inputs.tag }} to GHCR${{ !inputs[''build-only''] && '' · dev acceptance · prod review'' || '''' }}'
'on':
  workflow_dispatch:
    inputs:
      command:
        description: Publish release images to GHCR
        required: true
        default: publish
        type: choice
        options:
          - publish
      tag:
        description: Release tag v<X.Y.Z>, naming a commit on main
        required: true
        type: string
      build-only:
        description: Build and upload only; skip deployment, E2E and Slack reporting
        required: true
        default: false
        type: boolean
concurrency:
  group: shadow-mbuild-release-${{ inputs.tag }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  resolve:
    name: resolve ${{ inputs.tag }}
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-ci' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      artifacts: ${{ steps.artifacts.outputs.names }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a released version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -Eeuo pipefail
          # A commit refused by name rather than by shape. It would fail the
          # version check below anyway, but "must be v<X.Y.Z>" tells an operator
          # who pasted a SHA nothing about what they actually did wrong: this
          # workflow releases a tagged version, and resolves the commit itself.
          if [[ "$TAG" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error title=tag::'$TAG' looks like a commit. This workflow releases a tagged version — give the v<X.Y.Z> tag, and use mdeploy-all's commit path to deploy bare bytes."
            exit 1
          fi
          # `v` and a stable X.Y.Z, which is how this repository spells a release
          # tag. The same shape mbuild's RELEASE_VERSION accepts, so what passes
          # here is what `--version` will take below.
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=tag::tag must be a release tag of the form v<X.Y.Z>, with no pre-release suffix (got '$TAG')"
            exit 1
          fi
          # Fully qualified, and asserted here rather than left to the resolve
          # below. `refs/tags/` is what refuses a branch of the same name —
          # `git rev-parse v1.2.3` answers for either — and a version nobody
          # tagged has to be refused before a registry is asked about bytes that
          # were never built.
          ref="refs/tags/${TAG}"
          if ! git rev-parse --verify --quiet "${ref}^{commit}" >/dev/null; then
            near="$(git tag --list "${TAG%%.*}.*" | sort -V | tail -n 3 | tr '\n' ' ')"
            echo "::error title=tag::no tag ${ref} in this repository; cut the release first${near:+ (this repository has: ${near})}"
            exit 1
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - id: ref
        uses: ./.github/actions/resolve-ref
        with:
          ref: ${{ steps.version.outputs.ref }}
          branch: ${{ github.ref_name }}
      - name: Read the artifacts this release declares
        id: artifacts
        shell: bash
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -Eeuo pipefail
          declaration="$(git show "${SHA}:apps/infra/mstage.env.json")"
          names="$(printf '%s' "$declaration" | jq -c '.artifacts | keys')"
          if [ "$names" = '[]' ]; then
            echo "::error title=artifacts::${SHA} declares no artifacts in apps/infra/mstage.env.json"
            exit 1
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "$SHA declares $names"
  publish:
    name: publish ${{ inputs.tag }} · ${{ matrix.artifact }}
    needs:
      - resolve
    if: ${{ inputs.command == 'publish' && github.ref == 'refs/heads/codex/shadow-release-ci' }}
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJSON(needs.resolve.outputs.artifacts) }}
    steps:
      - name: Simulate GHCR image publication
        run: 'echo "SHADOW: GHCR image publication"'
  check:
    name: Check release assets
    needs:
      - resolve
      - publish
    if: ${{ !inputs['build-only'] && github.ref == 'refs/heads/codex/shadow-release-ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate optional release webhook and require release assets
        env:
          TAG: ${{ inputs.tag }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node apps/infra/scripts/release-pipeline.mjs assets
  dev:
    name: Dev deployment and acceptance
    needs:
      - resolve
      - check
    if: ${{ !inputs['build-only'] && github.ref == 'refs/heads/codex/shadow-release-ci' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/mdeploy-all.yml
    with:
      stage: dev
      ref: ${{ inputs.tag }}
      release_sha: ${{ needs.resolve.outputs.sha }}
      components: api+runner
      apply: true
      confirm: true
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  prod:
    name: Production deployment
    needs:
      - resolve
      - dev
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-ci' && !inputs['build-only'] && needs.dev.outputs.accepted_attempt != '' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/mdeploy-all.yml
    with:
      stage: prod
      ref: ${{ inputs.tag }}
      release_sha: ${{ needs.resolve.outputs.sha }}
      accepted_attempt: ${{ needs.dev.outputs.accepted_attempt }}
      components: api+runner
      apply: true
      confirm: true
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  report:
    name: Report release failure
    needs:
      - resolve
      - publish
      - check
      - dev
    if: ${{ always() && !inputs['build-only'] && github.ref == 'refs/heads/codex/shadow-release-ci' && needs.dev.result != 'success' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Report release failure to Slack
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_RESULTS: ${{ toJSON(needs) }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node apps/infra/scripts/release-pipeline.mjs report
