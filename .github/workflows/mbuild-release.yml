# Shadow rehearsal: real approvals and marked Slack notifications, with simulated build, upload and deployment steps.
name: mbuild-release
run-name: '[SHADOW] release ${{ inputs.tag }} to GHCR${{ !inputs[''build-only''] && '' · dev acceptance · prod review'' || '''' }}'
'on':
  workflow_dispatch:
    inputs:
      command:
        description: Run the release or republish an accepted component
        required: true
        default: publish
        type: choice
        options:
          - publish
          - repair-runtime
          - repair-wheels
          - repair-node
          - repair-c
      candidate-id:
        description: For repair, the Actions artifact ID of the dev-accepted release candidate
        type: string
      tag:
        description: Release tag v<X.Y.Z>, naming a commit on main
        required: true
        type: string
      build-only:
        description: Build and upload only; skip deployment, E2E and Slack reporting
        required: true
        default: false
        type: boolean
      simulate-failure:
        description: Fixture outcome to inspect
        type: choice
        default: none
        options:
          - none
          - check
          - dev-deploy
          - e2e
          - publish
          - prod-deploy
concurrency:
  group: shadow-v2-mbuild-release-${{ inputs.tag }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    name: resolve ${{ inputs.tag }}
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      artifacts: ${{ steps.artifacts.outputs.names }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate repair inputs
        if: inputs.command != 'publish'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Require a released version
        id: version
        shell: bash
        run: |-
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          {
            echo "ref=refs/tags/$TAG"
          } >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
      - name: ./.github/actions/resolve-ref
        id: ref
        shell: bash
        run: |-
          {
            echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Create or select the release draft
        id: draft
        if: ${{ !inputs['build-only'] }}
        shell: bash
        run: |-
          {
            echo "id=1"
          } >> "$GITHUB_OUTPUT"
      - name: Read the artifacts this release declares
        id: artifacts
        shell: bash
        run: |-
          names=$(jq -c ".artifacts | keys" apps/infra/mstage.env.json)
          {
            echo "names=$names"
          } >> "$GITHUB_OUTPUT"
  build-runtime:
    needs: resolve
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' && !inputs['build-only'] }}
    uses: ./.github/workflows/build-runtime.yml
    permissions:
      contents: read
      actions: read
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      tag: ${{ inputs.tag }}
  build-wheels:
    needs: resolve
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' && !inputs['build-only'] }}
    uses: ./.github/workflows/build-wheels.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read
      actions: read
  build-node:
    needs: resolve
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' && !inputs['build-only'] }}
    uses: ./.github/workflows/build-node.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read
      actions: read
  build-c:
    needs: resolve
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' }}
    uses: ./.github/workflows/build-c.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read
      actions: read
  build-go:
    needs:
      - resolve
      - build-c
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' && !inputs['build-only'] }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/build-go.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
  build-runner-binary:
    needs:
      - resolve
      - build-c
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' }}
    uses: ./.github/workflows/build-runner-binary.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      libboxlite_source: artifact
      release_tag: ${{ inputs.tag }}
    permissions:
      contents: read
      actions: read
  publish:
    name: publish ${{ inputs.tag }} · ${{ matrix.artifact }}
    needs:
      - resolve
    if: ${{ inputs.command == 'publish' && github.ref == 'refs/heads/codex/shadow-release-3069-v2' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJSON(needs.resolve.outputs.artifacts) }}
    steps:
      - name: actions/checkout@v5
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: actions/checkout@v5
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/setup-infra
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Keep registry credentials out of HOME
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Build and upload
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: actions/upload-artifact@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Report
        if: always()
        shell: bash
        run: printf '%s\n' 'Simulated'
  publish-runner:
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' }}
    name: Publish Runner archive to GHCR
    needs:
      - resolve
      - build-runner-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: actions/download-artifact@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Push the exact Runner archive
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: actions/upload-artifact@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
  check:
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && !inputs['build-only'] }}
    name: Verify deployment image and Runner digests
    needs:
      - resolve
      - publish
      - publish-runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.stage.outputs.digest }}
      registry_digests: ${{ steps.stage.outputs.pins }}
    steps:
      - name: actions/checkout@v5
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: actions/download-artifact@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Validate the candidate
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FAIL" != check ]] || exit 1
          pins=$(jq -cn --arg tag "$TAG" --arg sha "$GITHUB_SHA" --arg pin "$PIN" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{tag:$tag,sha:$sha,attempt:$attempt,images:{api:$pin},runner:{manifest:$pin,archive:$pin}}')
          digest=$(printf '%s' "$pins" | sha256sum | cut -d' ' -f1)
          printf 'digest=sha256:%s\npins=%s\n' "$digest" "$pins" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
          PIN: sha256:1111111111111111111111111111111111111111111111111111111111111111
          FAIL: ${{ inputs['simulate-failure'] }}
      - name: actions/upload-artifact@v4
        id: upload
        shell: bash
        run: |-
          {
            echo "artifact-id=$((GITHUB_RUN_ATTEMPT*2))"
          } >> "$GITHUB_OUTPUT"
  distribution:
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && !inputs['build-only'] }}
    name: Verify complete release distribution
    needs:
      - resolve
      - publish
      - publish-runner
      - build-runtime
      - build-wheels
      - build-node
      - build-c
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.stage.outputs.digest }}
    steps:
      - name: actions/checkout@v5
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: actions/download-artifact@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Validate the candidate
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          :
          pins=$(jq -cn --arg tag "$TAG" --arg sha "$GITHUB_SHA" --arg pin "$PIN" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{tag:$tag,sha:$sha,attempt:$attempt,images:{api:$pin},runner:{manifest:$pin,archive:$pin}}')
          digest=$(printf '%s' "$pins" | sha256sum | cut -d' ' -f1)
          printf 'digest=sha256:%s\npins=%s\n' "$digest" "$pins" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
          PIN: sha256:1111111111111111111111111111111111111111111111111111111111111111
          FAIL: ${{ inputs['simulate-failure'] }}
      - name: actions/upload-artifact@v4
        id: upload
        shell: bash
        run: |-
          {
            echo "artifact-id=$((GITHUB_RUN_ATTEMPT*2+1))"
          } >> "$GITHUB_OUTPUT"
  dev:
    name: Dev deployment and acceptance
    needs:
      - resolve
      - check
    if: ${{ !inputs['build-only'] && github.ref == 'refs/heads/codex/shadow-release-3069-v2' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/mdeploy-all.yml
    with:
      stage: dev
      ref: ${{ inputs.tag }}
      release_sha: ${{ needs.resolve.outputs.sha }}
      candidate_id: ${{ needs.check.outputs.candidate_id }}
      candidate_digest: ${{ needs.check.outputs.digest }}
      registry_digests: ${{ needs.check.outputs.registry_digests }}
      components: api+runner
      apply: true
      confirm: true
      shadow_failure: ${{ inputs['simulate-failure'] }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  accepted-candidate:
    name: Locate the previously accepted candidate
    needs: resolve
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command != 'publish' && !inputs['build-only'] }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      id: ${{ steps.receipt.outputs.id }}
      run: ${{ steps.receipt.outputs.run }}
      digest: ${{ steps.receipt.outputs.digest }}
    steps:
      - name: Run receipt
        id: receipt
        shell: bash
        run: |-
          [[ "$ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          {
            echo "id=$ID"
            echo "run=$GITHUB_RUN_ID"
            echo "digest=sha256:1111111111111111111111111111111111111111111111111111111111111111"
          } >> "$GITHUB_OUTPUT"
        env:
          ID: ${{ inputs['candidate-id'] }}
  attach:
    name: Record dev acceptance and attach verified files
    needs:
      - resolve
      - check
      - distribution
      - build-go
      - dev
      - accepted-candidate
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/codex/shadow-release-3069-v2' && ((needs.dev.outputs.accepted_attempt != '' && needs.distribution.result == 'success' &&
      needs.build-go.result == 'success') || needs.accepted-candidate.result == 'success') }}
    outputs:
      candidate: ${{ needs.distribution.outputs.candidate_id || needs.accepted-candidate.outputs.id }}
      digest: ${{ needs.distribution.outputs.digest || needs.accepted-candidate.outputs.digest }}
      run: ${{ needs.accepted-candidate.outputs.run || github.run_id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: actions/checkout@v5
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/release-candidate
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Match release files to the client bytes accepted by dev
        if: inputs.command == 'publish'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Record the exact candidate accepted by dev
        if: inputs.command == 'publish'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: actions/upload-artifact@v4
        if: inputs.command == 'publish'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Verify every draft attachment
        shell: bash
        run: printf '%s\n' 'Simulated'
  npm:
    if: >-
      ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && contains(fromJSON('["publish","repair-node"]'), inputs.command) &&
      !cancelled() && needs.attach.result == 'success' }}
    name: Publish accepted npm packages
    needs:
      - resolve
      - attach
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: actions/checkout@v5
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/release-candidate
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: actions/setup-node@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Publish platform packages before the main package
        shell: bash
        run: test "$FAIL" != publish
        env:
          FAIL: ${{ inputs['simulate-failure'] }}
  pypi:
    if: >-
      ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && contains(fromJSON('["publish","repair-wheels"]'), inputs.command) &&
      !cancelled() && needs.attach.result == 'success' }}
    name: Publish to PyPI
    needs:
      - resolve
      - attach
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: actions/checkout@v5
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/release-candidate
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Select accepted wheels
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Check existing PyPI wheels before uploading
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Publish to PyPI
        shell: bash
        run: test "$FAIL" != publish
        env:
          FAIL: ${{ inputs['simulate-failure'] }}
      - name: Verify PyPI recorded the accepted wheel hashes
        shell: bash
        run: printf '%s\n' 'Simulated'
  tag-go-module:
    if: >-
      ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' &&
      !cancelled() && needs.attach.result == 'success' }}
    name: Tag Go Module
    needs:
      - resolve
      - attach
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: actions/checkout@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Create Go module tag
        shell: bash
        run: printf '%s\n' 'Simulated'
  publish_crates:
    if: >-
      ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' &&
      !cancelled() && needs.finalize.result == 'success' }}
    name: Publish to crates.io
    needs:
      - resolve
      - finalize
    runs-on: ubuntu-latest
    steps:
      - name: actions/checkout@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/setup-rust
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Install protoc
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Publish leaf crates (Tier 1)
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Wait for crates.io indexing
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Publish boxlite (Tier 2)
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Wait for boxlite indexing
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Publish boxlite-cli (Tier 3)
        shell: bash
        run: printf '%s\n' 'Simulated'
    permissions:
      contents: read
      actions: read
  finalize:
    if: >-
      ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' &&
      !cancelled() && needs.npm.result == 'success' &&
      needs.pypi.result == 'success' && needs.tag-go-module.result == 'success' }}
    name: Publish the verified GitHub Release
    needs:
      - resolve
      - distribution
      - attach
      - pypi
      - npm
      - tag-go-module
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: actions/checkout@v5
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/release-candidate
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Recheck release attachments and publish
        shell: bash
        run: printf '%s\n' 'Simulated'
  prod:
    name: Production deployment
    needs:
      - resolve
      - check
      - dev
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && !inputs['build-only'] && needs.dev.outputs.accepted_attempt != '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/mdeploy-all.yml
    with:
      stage: prod
      ref: ${{ inputs.tag }}
      release_sha: ${{ needs.resolve.outputs.sha }}
      candidate_id: ${{ needs.check.outputs.candidate_id }}
      candidate_digest: ${{ needs.check.outputs.digest }}
      registry_digests: ${{ needs.check.outputs.registry_digests }}
      accepted_attempt: ${{ needs.dev.outputs.accepted_attempt }}
      components: api+runner
      apply: true
      confirm: true
      shadow_failure: ${{ inputs['simulate-failure'] }}
      shadow_receipt: ${{ needs.dev.outputs.shadow_receipt }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  report:
    name: Report release failure
    needs:
      - resolve
      - build-runtime
      - build-wheels
      - build-node
      - build-c
      - build-go
      - build-runner-binary
      - publish
      - publish-runner
      - check
      - distribution
      - dev
      - accepted-candidate
      - attach
      - pypi
      - npm
      - tag-go-module
      - finalize
      - publish_crates
    if: >-
      ${{ always() && !inputs['build-only'] && github.ref == 'refs/heads/codex/shadow-release-3069-v2' && (contains(needs.*.result, 'failure') || contains(needs.*.result,
      'cancelled')) }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Report release failure to Slack
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_RESULTS: ${{ toJSON(needs) }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node apps/infra/scripts/release-pipeline.mjs report
    env:
      GH_TOKEN: ${{ github.token }}
