name: BoxLite plugin GHCR smoke test

on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    if: github.repository == 'boxlite-ai/boxlite' && github.ref == 'refs/heads/ci/boxlite-plugin-ghcr-smoke-44687482044'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: 14615636411
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 44687482044
          path: packages
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6
      - name: Push the preview artifact to the smoke package and verify its bytes
        working-directory: packages
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=ghcr.io/boxlite-ai/boxlite-plugin-smoke
          tag="smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          layout="$RUNNER_TEMP/plugin-oci:$tag"
          config="$RUNNER_TEMP/plugin-smoke-registry.json"
          download="$RUNNER_TEMP/plugin-smoke-download"
          trap 'oras logout ghcr.io --registry-config "$config" >/dev/null 2>&1 || true' EXIT

          sha256sum --strict --check SHA256SUMS boxlite-review-kit-0.2.0.zip.sha256
          oras push --oci-layout --artifact-type application/vnd.boxlite.plugin.v1 \
            --annotation org.opencontainers.image.revision=f0d350824bc89ae2d91fb48f3132d2db9e47a515 \
            --annotation org.opencontainers.image.version=0.2.0 \
            --annotation org.opencontainers.image.url=https://github.com/boxlite-ai/boxlite \
            "$layout" boxlite-0.2.0.zip:application/zip \
            boxlite-marketplace-0.2.0.zip:application/zip SHA256SUMS:text/plain \
            boxlite-review-kit-0.2.0.zip:application/zip boxlite-review-kit-0.2.0.zip.sha256:text/plain
          digest="$(oras resolve --oci-layout "$layout")"
          printf '%s\n' "$GHCR_TOKEN" |
            oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin --registry-config "$config"
          oras cp --from-oci-layout --to-registry-config "$config" "$layout" "$image:$tag"
          test "$(oras resolve --registry-config "$config" "$image:$tag")" = "$digest"
          oras manifest fetch --registry-config "$config" "$image@$digest" |
            jq -e '.artifactType == "application/vnd.boxlite.plugin.v1" and (.layers | length) == 5'
          oras pull --registry-config "$config" --output "$download" "$image@$digest"
          cd "$download"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 5
          sha256sum --strict --check SHA256SUMS boxlite-review-kit-0.2.0.zip.sha256
          printf 'Verified %s:%s at %s\n' "$image" "$tag" "$digest" | tee -a "$GITHUB_STEP_SUMMARY"
