# Release publication is independent of deployment environments and cloud registries.
name: mbuild-release
run-name: publish ${{ inputs.tag }} to GHCR

on:
  workflow_dispatch:
    inputs:
      command:
        description: Publish release images to GHCR
        required: true
        default: publish
        type: choice
        options: [publish]
      tag:
        description: 'Release tag v<X.Y.Z>, naming a commit on main'
        required: true
        type: string

concurrency:
  group: mbuild-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  resolve:
    name: resolve ${{ inputs.tag }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      artifacts: ${{ steps.artifacts.outputs.names }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Tags and the commits they name, and main, which the containment
          # check below compares against. A shallow checkout carries neither.
          fetch-depth: 0

      - name: Require a released version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -Eeuo pipefail
          # A commit refused by name rather than by shape. It would fail the
          # version check below anyway, but "must be v<X.Y.Z>" tells an operator
          # who pasted a SHA nothing about what they actually did wrong: this
          # workflow releases a tagged version, and resolves the commit itself.
          if [[ "$TAG" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error title=tag::'$TAG' looks like a commit. This workflow releases a tagged version — give the v<X.Y.Z> tag, and use mdeploy-all's commit path to deploy bare bytes."
            exit 1
          fi
          # `v` and a stable X.Y.Z, which is how this repository spells a release
          # tag. The same shape mbuild's RELEASE_VERSION accepts, so what passes
          # here is what `--version` will take below.
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=tag::tag must be a release tag of the form v<X.Y.Z>, with no pre-release suffix (got '$TAG')"
            exit 1
          fi
          # Fully qualified, and asserted here rather than left to the resolve
          # below. `refs/tags/` is what refuses a branch of the same name —
          # `git rev-parse v1.2.3` answers for either — and a version nobody
          # tagged has to be refused before a registry is asked about bytes that
          # were never built.
          ref="refs/tags/${TAG}"
          if ! git rev-parse --verify --quiet "${ref}^{commit}" >/dev/null; then
            near="$(git tag --list "${TAG%%.*}.*" | sort -V | tail -n 3 | tr '\n' ' ')"
            echo "::error title=tag::no tag ${ref} in this repository; cut the release first${near:+ (this repository has: ${near})}"
            exit 1
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      # `branch` is what refuses a tag whose commit main does not contain — the
      # release's bytes and the branch that produces them, checked together.
      - id: ref
        uses: ./.github/actions/resolve-ref
        with:
          ref: ${{ steps.version.outputs.ref }}
          branch: ${{ github.ref_name }}

      # Read out of the released commit with `git show` rather than a second
      # checkout: one file is wanted, and the working tree is still main's.
      - name: Read the artifacts this release declares
        id: artifacts
        shell: bash
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -Eeuo pipefail
          declaration="$(git show "${SHA}:apps/infra/mstage.env.json")"
          names="$(printf '%s' "$declaration" | jq -c '.artifacts | keys')"
          if [ "$names" = '[]' ]; then
            echo "::error title=artifacts::${SHA} declares no artifacts in apps/infra/mstage.env.json"
            exit 1
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "$SHA declares $names"

  publish:
    name: publish ${{ inputs.tag }} · ${{ matrix.artifact }}
    needs: [resolve]
    if: ${{ inputs.command == 'publish' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJSON(needs.resolve.outputs.artifacts) }}
    env:
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      # Keep current publication tooling; old releases need only their build context.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
          path: release-source
      - uses: ./.github/actions/setup-infra

      - name: Keep registry credentials out of HOME
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - name: Build and upload
        working-directory: apps/infra
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ inputs.tag }}
          ARTIFACT: ${{ matrix.artifact }}
          GHCR_REPOSITORY: ${{ github.repository }}
          MSTAGE_ENV_CONFIG: ${{ github.workspace }}/release-source/apps/infra/mstage.env.json
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            npm run --silent mbuild publish -- --tag "$SHA" --ghcr "$GHCR_REPOSITORY" --artifact "$ARTIFACT" --version "$TAG" && exit 0
            status=$?
            if [ "$status" -eq 65 ]; then
              echo "::error title=publish::$ARTIFACT at $SHA failed the dependency audit; details are above"
              exit 1
            fi
            if [ "$status" -eq 78 ]; then
              echo "::error title=publish::$ARTIFACT at $SHA was refused by the image scan gate; findings are above"
              exit 1
            fi
            echo "Publish failed (attempt $attempt/3, exit $status); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error title=publish::Could not publish $ARTIFACT for $TAG to GHCR after 3 attempts"
          exit 1

      - name: Report
        if: always()
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ inputs.tag }}
          ARTIFACT: ${{ matrix.artifact }}
          REPOSITORY: ${{ github.repository }}
          RESULT: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          {
            echo "### mbuild-release $TAG · $ARTIFACT"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| image | ghcr.io/${REPOSITORY,,}/$ARTIFACT:$TAG-$SHA |"
            echo "| result | $RESULT |"
            echo
            echo 'Manifest digests are printed by the publication step.'
            echo 'Image scanning runs after import into the deployment stage.'
          } >> "$GITHUB_STEP_SUMMARY"
