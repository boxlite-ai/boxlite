# Shadow rehearsal: fixtures only, with real GitHub Environment approvals and Slack.
name: mbuild-release
run-name: '[SHADOW] release ${{ inputs.tag }} to GHCR${{ !inputs[''build-only''] && '' · dev acceptance · prod review'' || '''' }}'
'on':
  workflow_dispatch:
    inputs:
      command:
        description: Run the release or republish an accepted component
        required: true
        default: publish
        type: choice
        options:
          - publish
      tag:
        description: Release tag v<X.Y.Z>, naming a commit on main
        required: true
        type: string
      build-only:
        description: Simulate the build jobs only
        required: true
        default: false
        type: boolean
      simulate-failure:
        description: Fixture outcome to inspect
        type: choice
        default: none
        options:
          - none
          - check
          - dev-deploy
          - e2e
          - publish
          - prod-deploy
concurrency:
  group: shadow-v2-mbuild-release-${{ inputs.tag }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  resolve:
    name: resolve ${{ inputs.tag }}
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      release_id: ${{ steps.ref.outputs.release_id }}
      artifacts: ${{ steps.ref.outputs.artifacts }}
    steps:
      - id: ref
        name: Select synthetic release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |-
          set -eu
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'sha=%s\nrelease_id=1\nartifacts=%s\n' "$GITHUB_SHA" '["api","proxy","otel-collector","registry-proxy"]' >> "$GITHUB_OUTPUT"
  build-runtime:
    needs: resolve
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' && !inputs['build-only'] }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate build-runtime
        shell: bash
        run: echo "Simulated $GITHUB_JOB"
  build-wheels:
    needs: resolve
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' && !inputs['build-only'] }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate build-wheels
        shell: bash
        run: echo "Simulated $GITHUB_JOB"
  build-node:
    needs: resolve
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' && !inputs['build-only'] }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate build-node
        shell: bash
        run: echo "Simulated $GITHUB_JOB"
  build-c:
    needs: resolve
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate build-c
        shell: bash
        run: echo "Simulated $GITHUB_JOB"
  build-go:
    needs:
      - resolve
      - build-c
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' && !inputs['build-only'] }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate build-go
        shell: bash
        run: echo "Simulated $GITHUB_JOB"
  build-runner-binary:
    needs:
      - resolve
      - build-c
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate build-runner-binary
        shell: bash
        run: echo "Simulated $GITHUB_JOB"
  publish:
    name: publish ${{ inputs.tag }} · ${{ matrix.artifact }}
    needs:
      - resolve
    if: ${{ inputs.command == 'publish' && github.ref == 'refs/heads/codex/shadow-release-3069-v2' }}
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJSON(needs.resolve.outputs.artifacts) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate publish
        shell: bash
        run: echo "Simulated $GITHUB_JOB"
  publish-runner:
    name: Publish Runner archive to GHCR
    needs:
      - resolve
      - build-runner-binary
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate publish-runner
        shell: bash
        run: echo "Simulated $GITHUB_JOB"
  check:
    name: Verify release candidate
    needs:
      - resolve
      - publish
      - publish-runner
      - build-runtime
      - build-wheels
      - build-node
      - build-c
      - build-go
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && !inputs['build-only'] }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_id: ${{ github.run_attempt }}
      digest: ${{ steps.stage.outputs.digest }}
      registry_digests: ${{ steps.stage.outputs.pins }}
    steps:
      - id: stage
        name: Write a local candidate fixture
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          PIN: sha256:1111111111111111111111111111111111111111111111111111111111111111
          FAIL: ${{ inputs['simulate-failure'] }}
        run: |
          set -euo pipefail
          [[ "$FAIL" != check ]]
          pins=$(jq -cn --arg tag "$TAG" --arg sha "$GITHUB_SHA" --arg pin "$PIN" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{tag:$tag,sha:$sha,attempt:$attempt,images:{api:$pin},runner:{manifest:$pin,archive:$pin}}')
          digest=$(printf '%s' "$pins" | sha256sum | cut -d' ' -f1)
          printf 'digest=sha256:%s\npins=%s\n' "$digest" "$pins" >> "$GITHUB_OUTPUT"
  dev:
    name: Dev deployment and acceptance
    needs:
      - resolve
      - check
    if: ${{ !inputs['build-only'] && github.ref == 'refs/heads/codex/shadow-release-3069-v2' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/mdeploy-all.yml
    with:
      stage: dev
      ref: ${{ inputs.tag }}
      release_sha: ${{ needs.resolve.outputs.sha }}
      candidate_id: ${{ needs.check.outputs.candidate_id }}
      candidate_digest: ${{ needs.check.outputs.digest }}
      registry_digests: ${{ needs.check.outputs.registry_digests }}
      components: api+runner
      apply: true
      confirm: true
      shadow_failure: ${{ inputs['simulate-failure'] }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  accepted-candidate:
    name: Locate the previously accepted candidate
    needs: resolve
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command != 'publish' && !inputs['build-only'] }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate accepted-candidate
        shell: bash
        run: echo "Simulated $GITHUB_JOB"
    outputs:
      id: unused
      run: unused
      digest: unused
  attach:
    name: Simulate attaching the dev-accepted candidate
    needs:
      - resolve
      - check
      - dev
      - accepted-candidate
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/codex/shadow-release-3069-v2' && (needs.dev.outputs.accepted_attempt != '' ||
      needs.accepted-candidate.result == 'success') }}
    outputs:
      receipt: ${{ steps.acceptance.outputs.receipt }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Pass the dev acceptance receipt as a job output
        id: acceptance
        if: inputs.command == 'publish'
        env:
          CANDIDATE: ${{ needs.distribution.outputs.candidate_id }}
          DIGEST: ${{ needs.distribution.outputs.digest }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          ACCEPTED: ${{ needs.dev.outputs.accepted_attempt }}
        run: |
          set -euo pipefail
          receipt=$(jq -cn --argjson run "$GITHUB_RUN_ID" --argjson attempt "$ACCEPTED" --argjson id "$CANDIDATE" \
            --arg digest "$DIGEST" --arg tag "$TAG" --arg sha "$SHA" \
            '{run:$run,attempt:$attempt,candidate:$id,digest:$digest,tag:$tag,sha:$sha}')
          printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"
  npm:
    name: Publish accepted npm packages
    needs:
      - resolve
      - attach
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && contains(fromJSON('["publish","repair-node"]'), inputs.command) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate package publication
        shell: bash
        env:
          FAIL: ${{ inputs['simulate-failure'] }}
        run: test "$FAIL" != publish
  pypi:
    name: Publish to PyPI
    needs:
      - resolve
      - attach
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && contains(fromJSON('["publish","repair-wheels"]'), inputs.command) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate package publication
        shell: bash
        env:
          FAIL: ${{ inputs['simulate-failure'] }}
        run: test "$FAIL" != publish
  tag-go-module:
    name: Tag Go Module
    needs:
      - resolve
      - attach
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate tag-go-module
        shell: bash
        run: echo "Simulated $GITHUB_JOB"
  publish_crates:
    name: Publish to crates.io
    needs:
      - resolve
      - finalize
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate publish_crates
        shell: bash
        run: echo "Simulated $GITHUB_JOB"
  finalize:
    name: Publish the verified GitHub Release
    needs:
      - resolve
      - check
      - attach
      - pypi
      - npm
      - tag-go-module
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && inputs.command == 'publish' }}
    outputs:
      receipt: ${{ needs.attach.outputs.receipt }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate finalize
        shell: bash
        run: echo "Simulated $GITHUB_JOB"
  prod:
    name: Production deployment
    needs:
      - resolve
      - check
      - dev
      - finalize
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' && !inputs['build-only'] && needs.dev.outputs.accepted_attempt != '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/mdeploy-all.yml
    with:
      stage: prod
      ref: ${{ inputs.tag }}
      release_sha: ${{ needs.resolve.outputs.sha }}
      candidate_id: ${{ needs.check.outputs.candidate_id }}
      candidate_digest: ${{ needs.check.outputs.digest }}
      registry_digests: ${{ needs.check.outputs.registry_digests }}
      shadow_receipt: ${{ needs.finalize.outputs.receipt }}
      accepted_attempt: ${{ needs.dev.outputs.accepted_attempt }}
      components: api+runner
      apply: true
      confirm: true
      shadow_failure: ${{ inputs['simulate-failure'] }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  report:
    name: Report release failure
    needs:
      - resolve
      - build-runtime
      - build-wheels
      - build-node
      - build-c
      - build-go
      - build-runner-binary
      - publish
      - publish-runner
      - check
      - dev
      - accepted-candidate
      - attach
      - pypi
      - npm
      - tag-go-module
      - finalize
      - publish_crates
    if: >-
      ${{ always() && !inputs['build-only'] && github.ref == 'refs/heads/codex/shadow-release-3069-v2' && (contains(needs.*.result, 'failure') ||
      contains(needs.*.result, 'cancelled')) }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Report release failure to Slack
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_RESULTS: ${{ toJSON(needs) }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node apps/infra/scripts/release-pipeline.mjs report
