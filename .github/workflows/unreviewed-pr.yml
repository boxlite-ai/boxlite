name: Unreviewed PR

# Commits UNREVIEWED.md to a pull request that does not already carry that commit, converts
# the pull request to a draft, and fails until a person deletes the file after reading the
# diff and marks it ready. Draft blocks the merge on its own; making "Author reviewed the
# PR" a required check blocks it again for anyone who undrafts without reviewing. A PR
# merged without either brings the file onto the default branch, where it says so.
#
# A fork is the one head the step cannot mark, and at the pinned revision what it does about
# that turns on who opened the pull request: an owner, member or collaborator is refused, and
# anyone else passes. The rule lives with the step, in its header and in the agent-tooling
# ARCHITECTURE.md. What matters here is that this workflow does not cover the fork it lets
# through: requiring approvals on the base branch is what does.
#
# The step is pinned, not floated. This job holds write scopes, so the revision it executes
# has to be one a person chose: .agent-tooling/install.sh resolves the tip of agent-tooling
# at run time, which would put unreviewed upstream code behind those scopes. agent-tooling.yml
# may keep floating because it runs at contents: read. Bump AGENT_TOOLING_REV in a pull
# request to take an upstream fix, which is a one-line diff a reviewer can see.
#
# pull_request_target, and a checkout of the base commit alone: this job holds write scopes,
# so it must never run a pull request's own copy of the workflow or the step. Checking out
# the head, or switching back to pull_request, hands those scopes to the pull request.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  statuses: write
  pull-requests: write

concurrency:
  group: unreviewed-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  # boxlite-ai/agent-tooling, plugin 0.1.11 (#53)
  AGENT_TOOLING_REV: 8f6c409b9d0032ae1eb422ebc856dbaf5545c2b4

jobs:
  unreviewed-file:
    name: Author reviewed the PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check out the pinned agent-tooling revision
        uses: actions/checkout@v4
        with:
          repository: boxlite-ai/agent-tooling
          ref: ${{ env.AGENT_TOOLING_REV }}
          path: .agent-tooling-src
          persist-credentials: false
          fetch-depth: 1
      - name: Add or check UNREVIEWED.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .agent-tooling-src/plugins/boxlite-agent-tooling/scripts/pr-unreviewed-file.sh \
            "$GITHUB_EVENT_PATH"
