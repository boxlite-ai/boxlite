# Build the runner Go binary for Linux amd64.
#
# Self-contained workflow that downloads the prebuilt libboxlite.a from
# GitHub Releases, builds daemon + computer-use + runner with plain `go build`,
# and uploads the runner binary to GitHub Releases.
#
# The runner binary is fully self-contained: it links libboxlite.a (which
# auto-extracts the embedded runtime at startup) and embeds the daemon and
# computer-use binaries as static assets.
#
# Triggers:
# - workflow_run: After "Build C SDK" completes (ensures libboxlite.a exists)
# - workflow_dispatch: Manual trigger for testing
# - workflow_call:    Reusable from .github/workflows/e2e-cloud.yml — caller
#                     can switch `libboxlite_source` to `build` to compile
#                     libboxlite.a from THIS checkout's Rust source (needed
#                     when apps/runner references C symbols that the
#                     latest tagged release's libboxlite.a doesn't have).
name: Build Runner Binary

on:
  workflow_call:
    inputs:
      c_sdk_run_id:
        description: 'GHA run ID that uploaded the c-sdk-linux-x64-gnu artifact (contains libboxlite.{a,so} + boxlite.h). Caller (e2e-cloud.yml) typically passes its own github.run_id so the same run''s build_c artifact is consumed.'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      c_sdk_run_id:
        description: 'GHA run ID that uploaded the c-sdk-linux-x64-gnu artifact (e.g. a previous e2e-cloud or build-c run)'
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  config:
    uses: ./.github/workflows/config.yml

  build:
    name: Build Runner (linux-amd64)
    needs: config
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.config.outputs.go-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev

      - name: Determine version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ── libboxlite.a — download c-sdk artifact from caller's run ──
      # The c_sdk_run_id input identifies the GHA run whose build-c.yml
      # uploaded the c-sdk-linux-x64-gnu artifact. e2e-cloud.yml passes
      # ${{ github.run_id }} so the sibling build_c job's artifact (built
      # from THIS checkout's Rust source with proper manylinux container,
      # libseccomp.a cross-build, fix-go-symbols.sh) is consumed.
      #
      # Reusing that artifact avoids duplicating the libboxlite build chain
      # here (which would otherwise need musl-tools, gperf, llvm,
      # protobuf-compiler, libssl-dev, etc., AND diverge from how release
      # builds the .a).
      - name: Download c-sdk artifact
        uses: actions/download-artifact@v4
        with:
          name: c-sdk-linux-x64-gnu
          path: /tmp/c-sdk/
          run-id: ${{ inputs.c_sdk_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage libboxlite.a into sdks/go/
        run: |
          set -euo pipefail
          # The build-c.yml archive is `boxlite-c-v${VERSION}-linux-x64-gnu.tar.gz`
          # containing `boxlite-c-v${VERSION}-linux-x64-gnu/lib/libboxlite.a`.
          ARCHIVE=$(ls /tmp/c-sdk/boxlite-c-v*-linux-x64-gnu.tar.gz | head -1)
          [ -n "$ARCHIVE" ] || { echo "::error::No c-sdk archive in artifact"; exit 1; }
          tar xzf "$ARCHIVE" -C /tmp/c-sdk/
          A=$(find /tmp/c-sdk -name libboxlite.a | head -1)
          [ -n "$A" ] || { echo "::error::libboxlite.a not found in archive"; exit 1; }
          mkdir -p sdks/go
          cp "$A" sdks/go/libboxlite.a
          ls -lh sdks/go/libboxlite.a

      - name: Rewrite go.work for minimal modules
        run: |
          printf 'go 1.25.4\n\nuse (\n\t./runner\n\t./daemon\n\t./common-go\n\t./api-client-go\n\t./libs/computer-use\n\t../sdks/go\n)\n' > apps/go.work

      - name: Download Go dependencies
        run: |
          go -C apps/runner mod download
          go -C apps/daemon mod download
          go -C apps/common-go mod download
          go -C apps/api-client-go mod download
          go -C apps/libs/computer-use mod download

      - name: Build daemon
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C apps \
            -ldflags "-X 'github.com/boxlite-ai/daemon/internal.Version=${VERSION}'" \
            -o runner/pkg/daemon/static/daemon-amd64 \
            ./daemon/cmd/daemon/

      - name: Build computer-use
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -C apps \
            -o runner/pkg/daemon/static/boxlite-computer-use \
            ./libs/computer-use/

      - name: Build runner
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -C apps \
            -ldflags "-X 'github.com/boxlite-ai/runner/internal.Version=${VERSION}'" \
            -o /tmp/boxlite-runner \
            ./runner/cmd/runner/

      - name: Package runner binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar czf "boxlite-runner-v${VERSION}-linux-amd64.tar.gz" -C /tmp boxlite-runner
          # Integrity manifest the runner's user-data verifies before installing
          # the binary (apps/infra/sst.config.ts buildRunnerUserData).
          sha256sum "boxlite-runner-v${VERSION}-linux-amd64.tar.gz" > "boxlite-runner-v${VERSION}-linux-amd64.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-linux-amd64
          path: |
            boxlite-runner-v*-linux-amd64.tar.gz
            boxlite-runner-v*-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: ${{ needs.config.outputs.artifact-retention-days }}
