# Build the runner Go binary for Linux amd64.
#
# Builds against either the libboxlite.a published for a release or the Linux x64 C SDK artifact
# produced from the same commit in the current workflow run. The latter is the dev path: the
# Runner binary and its embedded runtime come from the exact checkout the API is deploying.
#
# The runner binary is fully self-contained: it links libboxlite.a, which
# auto-extracts the embedded runtime at startup.
#
# Triggers:
# - workflow_run: After "Build C SDK" completes (ensures libboxlite.a exists)
# - workflow_dispatch: Manual trigger for testing
# - workflow_call: A deploy building a selected commit (deploy-infra.yml)
name: Build Runner Binary

on:
  workflow_run:
    workflows: ["Build C SDK"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full commit SHA to build against its published C SDK version.'
        required: false
        type: string
  workflow_call:
    inputs:
      libboxlite_source:
        required: false
        default: release
        type: string
      ref:
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  config:
    uses: ./.github/workflows/config.yml

  resolve-ref:
    name: Resolve build commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate build commit
        id: ref
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          candidate="${INPUT_REF:-${WORKFLOW_RUN_SHA:-$GITHUB_SHA}}"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a full commit SHA" >&2; exit 1; }
          # fetch-depth: 0 above only brings THIS repo's own branches. A commit proposed by an
          # open pull request — same-repo or fork — isn't on any of them, so it isn't here yet;
          # fetch it directly by SHA. (Unlike a ref name, a bare SHA is only a "want" GitHub can
          # refuse, so this is a fallback, not the first attempt.)
          git cat-file -e "$candidate^{commit}" 2>/dev/null || git fetch origin "$candidate"
          git cat-file -e "$candidate^{commit}"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"

  build:
    name: Build Runner (linux-amd64)
    needs: [config, resolve-ref]
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.config.outputs.go-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev

      - name: Resolve artifact identity
        id: artifact
        shell: bash
        env:
          BUILD_SHA: ${{ needs.resolve-ref.outputs.sha }}
          INPUT_SOURCE: ${{ inputs.libboxlite_source }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          SOURCE="${INPUT_SOURCE:-release}"
          case "$SOURCE" in
            release)
              identity="$VERSION"
              archive="boxlite-runner-v${VERSION}-linux-amd64.tar.gz"
              ;;
            artifact)
              identity="${VERSION}+${BUILD_SHA}"
              archive="boxlite-runner-v${VERSION}-${BUILD_SHA}-linux-amd64.tar.gz"
              ;;
            *) echo "libboxlite_source must be release or artifact" >&2; exit 1 ;;
          esac
          {
            echo "version=$VERSION"
            echo "source=$SOURCE"
            echo "identity=$identity"
            echo "archive=$archive"
          } >> "$GITHUB_OUTPUT"

      - name: Download published libboxlite.a
        if: steps.artifact.outputs.source == 'release'
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARCHIVE="boxlite-c-v${VERSION}-linux-x64-gnu.tar.gz"
          URL="https://github.com/${GH_REPO}/releases/download/v${VERSION}/${ARCHIVE}"
          echo "Downloading $URL"
          curl -fsSL "$URL" | tar xz -C /tmp/
          cp "/tmp/boxlite-c-v${VERSION}-linux-x64-gnu/lib/libboxlite.a" sdks/go/libboxlite.a

      - name: Download commit libboxlite.a
        if: steps.artifact.outputs.source == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: c-sdk-linux-x64-gnu
          path: /tmp/c-sdk

      - name: Extract commit libboxlite.a
        if: steps.artifact.outputs.source == 'artifact'
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find /tmp/c-sdk -maxdepth 1 -name 'boxlite-c-v*-linux-x64-gnu.tar.gz' -print -quit)
          test -n "$archive"
          tar xzf "$archive" -C /tmp/
          # Derived, not searched. build-c.yml packages a single top-level directory named after
          # the archive, which is what the release branch above already assumes. Searching /tmp
          # instead walks root-owned siblings (snap-private-tmp, systemd-private-*), and find then
          # returns non-zero for the permission errors even when it matched — which under `set -e`
          # failed this step with the library sitting right there.
          cp "/tmp/$(basename "$archive" .tar.gz)/lib/libboxlite.a" sdks/go/libboxlite.a

      - name: Rewrite go.work for minimal modules
        run: |
          printf 'go 1.25.4\n\nuse (\n\t./runner\n\t./libs/common-go\n\t./libs/api-client-go\n\t../sdks/go\n)\n' > apps/go.work

      - name: Download Go dependencies
        run: |
          go -C apps/runner mod download
          go -C apps/libs/common-go mod download
          go -C apps/libs/api-client-go mod download

      - name: Build runner
        env:
          VERSION_IDENTITY: ${{ steps.artifact.outputs.identity }}
        run: |
          set -euo pipefail
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -C apps \
            -ldflags "-X 'github.com/boxlite-ai/runner/internal.Version=${VERSION_IDENTITY}'" \
            -o /tmp/boxlite-runner \
            ./runner/cmd/runner/

      - name: Package runner binary
        env:
          ARCHIVE: ${{ steps.artifact.outputs.archive }}
        run: |
          set -euo pipefail
          tar czf "$ARCHIVE" -C /tmp boxlite-runner
          # Integrity manifest both user-data and the in-place updater verify before installing.
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-linux-amd64
          path: |
            boxlite-runner-*-linux-amd64.tar.gz
            boxlite-runner-*-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: ${{ needs.config.outputs.artifact-retention-days }}

  upload-to-release:
    name: Upload to GitHub Release
    needs: [config, resolve-ref, build]
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Determine version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: runner-*
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            dist/boxlite-runner-v*.tar.gz
            dist/boxlite-runner-v*.tar.gz.sha256
          fail_on_unmatched_files: true
