# Shadow rehearsal: real approvals and marked Slack notifications, with simulated build, upload and deployment steps.
name: Build Runner Binary
'on':
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA to build with its matching C SDK.
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Product release whose runner is assembled from the same-run C artifact.
        required: false
        type: string
      libboxlite_source:
        description: Explicitly choose artifact for matching-commit deployments or release for published SDKs.
        required: true
        type: string
      ref:
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  config:
    uses: ./.github/workflows/config.yml
    permissions:
      contents: read
      actions: read
  resolve-ref:
    name: Resolve build commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: actions/checkout@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Validate build commit
        id: ref
        shell: bash
        run: |-
          {
            echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
    permissions:
      contents: read
      actions: read
  build-c:
    name: Build manual commit C SDK
    needs: resolve-ref
    if: github.event_name == 'workflow_dispatch' && !inputs.libboxlite_source
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/build-c.yml
    with:
      ref: ${{ needs['resolve-ref'].outputs.sha }}
      linux_x64_only: true
  build:
    name: Build Runner (linux-amd64)
    needs:
      - config
      - resolve-ref
      - build-c
    if: >-
      !cancelled() && needs.config.result == 'success' && needs['resolve-ref'].result == 'success' && (needs['build-c'].result == 'success' ||
      needs['build-c'].result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: actions/checkout@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/setup-go
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Install system dependencies
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Resolve artifact identity
        id: artifact
        shell: bash
        run: |-
          {
            echo "source=$SOURCE"
            echo "identity=$GITHUB_SHA"
            echo "archive=shadow.tar.gz"
          } >> "$GITHUB_OUTPUT"
        env:
          SOURCE: ${{ inputs.libboxlite_source }}
      - name: Download published libboxlite.a
        if: steps.artifact.outputs.source == 'release'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Download commit libboxlite.a
        if: steps.artifact.outputs.source == 'artifact'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Extract commit libboxlite.a
        if: steps.artifact.outputs.source == 'artifact'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Rewrite go.work for minimal modules
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Download Go dependencies
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Build runner
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Package runner binary
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Record build origin
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Upload artifact
        shell: bash
        run: printf '%s\n' 'Simulated'
