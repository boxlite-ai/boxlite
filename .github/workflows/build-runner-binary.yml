# Build the runner Go binary for Linux amd64.
#
# Consumes the Linux AMD64 C SDK artifact from the exact successful Build C SDK
# run, builds the runner with plain `go build`, and uploads the runner binary.
#
# The runner binary is fully self-contained: it links libboxlite.a, which
# auto-extracts the embedded runtime at startup.
#
# Triggers:
# - workflow_run: After "Build C SDK" completes
# - workflow_dispatch: Manual trigger using a successful Build C SDK run ID
name: Build Runner Binary

on:
  workflow_run:
    workflows: ["Build C SDK"]
    types: [completed]
  workflow_dispatch:
    inputs:
      c_sdk_run_id:
        description: Successful Build C SDK workflow run ID to consume
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  config:
    uses: ./.github/workflows/config.yml

  build:
    name: Build Runner (linux-amd64)
    needs: config
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      head-sha: ${{ steps.c-sdk-run.outputs.head-sha }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node-build-version }}

      - name: Test runner build artifact boundaries
        run: make test:ci:runner-build

      - name: Resolve C SDK artifact run
        id: c-sdk-run
        uses: actions/github-script@v7
        env:
          REQUESTED_RUN_ID: ${{ inputs.c_sdk_run_id }}
        with:
          script: |
            const path = require('node:path')
            const resolver = require(path.join(
              process.env.GITHUB_WORKSPACE,
              'scripts/ci/resolve-c-sdk-run.cjs',
            ))
            const runId = resolver.parseRunId(
              context.eventName === 'workflow_run'
                ? context.payload.workflow_run.id
                : process.env.REQUESTED_RUN_ID,
            )

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            })
            const { data: workflow } = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-c.yml',
            })
            const resolved = resolver.validateCSdkRun(
              run,
              `${context.repo.owner}/${context.repo.repo}`,
              workflow.id,
            )

            core.setOutput('run-id', resolved.runId)
            core.setOutput('head-sha', resolved.headSha)

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.c-sdk-run.outputs.head-sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.config.outputs.go-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev

      - name: Determine version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download C SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: c-sdk-linux-x64-gnu
          path: /tmp/boxlite-c-sdk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.c-sdk-run.outputs.run-id }}

      - name: Install libboxlite.a
        run: bash scripts/ci/install-c-sdk-artifact.sh /tmp/boxlite-c-sdk sdks/go/libboxlite.a

      - name: Rewrite go.work for minimal modules
        run: |
          printf 'go 1.25.4\n\nuse (\n\t./runner\n\t./libs/common-go\n\t./libs/api-client-go\n\t../sdks/go\n)\n' > apps/go.work

      - name: Download Go dependencies
        run: |
          go -C apps/runner mod download
          go -C apps/libs/common-go mod download
          go -C apps/libs/api-client-go mod download

      - name: Build runner
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -C apps \
            -ldflags "-X 'github.com/boxlite-ai/runner/internal.Version=${VERSION}'" \
            -o /tmp/boxlite-runner \
            ./runner/cmd/runner/

      - name: Package runner binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar czf "boxlite-runner-v${VERSION}-linux-amd64.tar.gz" -C /tmp boxlite-runner
          # Integrity manifest the runner's user-data verifies before installing
          # the binary (apps/infra/sst.config.ts buildRunnerUserData).
          sha256sum "boxlite-runner-v${VERSION}-linux-amd64.tar.gz" > "boxlite-runner-v${VERSION}-linux-amd64.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-linux-amd64
          path: |
            boxlite-runner-v*-linux-amd64.tar.gz
            boxlite-runner-v*-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: ${{ needs.config.outputs.artifact-retention-days }}

  upload-to-release:
    name: Upload to GitHub Release
    needs: [config, build]
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.head-sha }}

      - name: Validate release provenance
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [ "$RELEASE_TAG" = "v$VERSION" ] || {
            echo "Release tag $RELEASE_TAG does not match validated runner version v$VERSION" >&2
            exit 1
          }

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: runner-*
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: |
            dist/boxlite-runner-v*.tar.gz
            dist/boxlite-runner-v*.tar.gz.sha256
          fail_on_unmatched_files: true
