# Shadow rehearsal: real approvals and marked Slack notifications, with simulated build, upload and deployment steps.
name: Build Node.js
'on':
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  config:
    uses: ./.github/workflows/config.yml
    permissions:
      contents: read
      actions: read
  build:
    name: Build (${{ matrix.target }})
    needs: config
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.config.outputs.platforms) }}
    steps:
      - name: actions/checkout@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Set up Node.js
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/setup-rust
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/sccache
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/build-guest
        if: runner.os == 'Linux'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Build Node.js package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Build Node.js package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Create artifact tarball
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Upload artifacts
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Pack the native package and the Linux acceptance clients
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Stage platform npm packages
        shell: bash
        run: printf '%s\n' 'Simulated'
    permissions:
      contents: read
      actions: read
  test:
    name: Test (${{ matrix.platform.target }} / Node ${{ matrix.node-version }})
    needs:
      - config
      - build
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.config.outputs.platforms) }}
        node-version: ${{ fromJson(needs.config.outputs.node-versions) }}
    steps:
      - name: actions/checkout@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Set up Node.js
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Clean npm workspaces
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Download artifacts
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Extract artifacts
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Test package
        shell: bash
        run: printf '%s\n' 'Simulated'
    permissions:
      contents: read
      actions: read
  package:
    name: Pack npm distributions
    needs:
      - config
      - build
      - test
    runs-on: ubuntu-latest
    steps:
      - name: actions/checkout@v4
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Collect the packages built by each platform
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Assemble npm distributions without repacking
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Record build origin
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Stage npm distributions
        shell: bash
        run: printf '%s\n' 'Simulated'
    permissions:
      contents: read
      actions: read
