# Stages a runner binary for one commit, through `runner:build`.
#
# The third artifact, and the one that is not an image. A host installs it from
# the stage's own artifacts bucket under `runner/<commit>/`, which is the
# address `mdeploy/stack/runner-binary.ts` composes for the deploy — so what
# this stages is what a deploy in build mode reads, by construction rather than
# by agreement.
#
# Idempotent by the tool rather than by this file: `runner:build` proves the
# destination reachable, leaves a commit that is already published untouched,
# and refuses a half-published one rather than completing it. Rerunning is the
# normal way to answer "is it there?" — though a caller that has to decide
# whether to spend this job at all has `runner:build -- --check`, which reads
# the same answer without the checkout this job needs.
name: mrunner

on:
  workflow_dispatch:
    inputs:
      # A choice rather than free text: this value selects the job's deployment
      # Environment, and an Environment carries the secrets and the reviewers of
      # the stage it names. Enforced across every workflow by
      # apps/infra/deployment/release-safety.test.ts.
      stage:
        description: Stage whose artifacts bucket receives the binary
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      ref:
        description: Commit SHA, or a git tag naming one (defaults to this ref)
        required: false
      command:
        description: Build the binary here, or copy the one another stage serves
        required: true
        default: build
        type: choice
        options: [build, promote]
      from:
        description: Stage to promote from; ignored by build
        required: false
        type: choice
        options:
          - dev
          - prod
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ''
      command:
        required: false
        type: string
        default: build
      from:
        required: false
        type: string
        default: ''
    outputs:
      sha:
        description: The commit the binary was staged for.
        value: ${{ jobs.stage-runner.outputs.sha }}

concurrency:
  # One per stage. Two runs staging different commits would not collide — the
  # key carries the commit — but they would compete for the same bucket check
  # and the same minutes of libkrun, and a queue reads better than a race.
  group: mrunner-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # gh is installed on a runner but never signed in, and the stage declaration
  # names github a required provider — so every step that reaches mstage fails
  # on the session before it fails on anything worth reading. At the workflow
  # rather than on the check below: `runner:build` and `runner:promote` ask the
  # same question themselves, and a token only the check carries makes them
  # refuse a session the check just called usable.
  GH_TOKEN: ${{ github.token }}

jobs:
  # The source stage's declaration, read where it exists — `vars` resolves in
  # the environment a job binds to, and each stage's variable carries only its
  # own block. Same shape as mbuild.yml's, and for the same reason.
  declaration:
    name: read ${{ inputs.from }}
    if: github.ref == 'refs/heads/main' && inputs.command == 'promote'
    environment: ${{ inputs.from }}
    runs-on: ubuntu-latest
    outputs:
      config: ${{ vars.BOXLITE_MSTAGE_BOXLITE_APP_CONFIG }}
    steps:
      - run: echo "carrying ${{ inputs.from }}'s declaration to ${{ inputs.stage }}"

  stage-runner:
    name: ${{ inputs.command }} ${{ inputs.stage }}
    needs: [declaration]
    # The job that reaches a protected Environment reaches the cloud role behind
    # it, so it runs from main and nowhere else. `!failure()` rather than a bare
    # `needs`, because the job above is skipped for a build and a skipped
    # dependency would otherwise skip this one too.
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' }}
    environment: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Tags and the commits they name, so the step below can resolve one.
          fetch-depth: 0

      - id: ref
        uses: ./.github/actions/resolve-ref
        with:
          ref: ${{ inputs.ref }}
          fallback: ${{ github.sha }}

      # The tree the binary is built from, and the submodules it is built with:
      # `runner:build` refuses a checkout whose submodules are missing or do not
      # match the commit, because a commit-keyed object that held anything else
      # would claim bytes that commit does not produce.
      #
      # A build only. A promotion copies an object between buckets by the name
      # the source holds it under, so it needs no tree at all — and the
      # submodule fetch it would pay for is the expensive half of this job.
      - if: inputs.command == 'build'
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ steps.ref.outputs.sha }}
          submodules: recursive

      - uses: ./.github/actions/setup-infra
        with:
          # A promotion composes the source bucket's address as well, so it
          # restores both declarations.
          stages: ${{ inputs.command == 'promote' && format('{0} {1}', inputs.from, inputs.stage) || inputs.stage }}
          stage-config: ${{ vars.BOXLITE_MSTAGE_BOXLITE_APP_CONFIG }}
          stage-config-from: ${{ needs.declaration.outputs.config }}

      # Which cloud this stage's bucket lives in. Nothing below knows the answer
      # in advance, which is what keeps a stage on another cloud an edit to a
      # declaration rather than to this file.
      - name: Resolve the stage
        id: config
        working-directory: apps/infra
        run: |
          set -Eeuo pipefail
          if ! output="$(npm run --silent mbuild inspect -- --stage "${{ inputs.stage }}" 2>&1)"; then
            echo "::error title=stage::$output"
            exit 1
          fi
          echo "$output"
          echo "$output" >> "$GITHUB_OUTPUT"

      - name: Federate an AWS identity
        if: steps.config.outputs.kind == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/boxlite-${{ inputs.stage }}-github-deploy
          aws-region: ${{ steps.config.outputs.region }}
          role-session-name: mrunner-${{ github.run_id }}

      - name: Federate a GCP identity
        if: steps.config.outputs.kind == 'artifact-registry'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}

      # The one thing this job needs that a deploy does not: `runner:build`
      # reaches Cloud Storage through the CLI, and the federation above writes a
      # credential without installing one.
      - name: Install gcloud
        if: steps.config.outputs.kind == 'artifact-registry'
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify the session through mstage
        working-directory: apps/infra
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if npm run --silent mstage login; then exit 0; fi
            echo "mstage reports no usable session (attempt $attempt/3); retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error title=mstage::No usable session for ${{ steps.config.outputs.kind }} after 3 attempts"
          exit 1

      # Not retried. The destination is proved before anything is compiled, so
      # the failures left are the build itself and a refusal about what is
      # already in the bucket — and neither answer changes on a second ask.
      - name: Build the runner
        if: inputs.command == 'build'
        working-directory: apps/infra
        run: npm run runner:build -- --stage "${{ inputs.stage }}"

      # The bytes the source already serves, rather than a rebuild of the same
      # commit: a rebuild is not byte-identical, and version+commit is an
      # identity everything downstream compares without looking inside.
      - name: Promote the runner
        if: inputs.command == 'promote'
        working-directory: apps/infra
        run: |
          set -Eeuo pipefail
          npm run runner:promote -- --tag "${{ steps.ref.outputs.sha }}" \
            --from "${{ inputs.from }}" --to "${{ inputs.stage }}"

      - name: Report
        if: always()
        run: |
          set -Eeuo pipefail
          {
            echo "### mrunner ${{ inputs.stage }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ steps.ref.outputs.sha }}\` |"
            echo "| stage | \`${{ inputs.stage }}\` |"
            echo "| cloud | \`${{ steps.config.outputs.kind == 'ecr' && 'aws' || 'gcp' }}\` in \`${{ steps.config.outputs.region }}\` |"
            echo "| result | \`${{ job.status }}\` |"
            echo
            echo "Install it with:"
            echo
            echo '```'
            echo "npm run mdeploy -- --stage ${{ inputs.stage }}   # with runner_ref=${{ steps.ref.outputs.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
