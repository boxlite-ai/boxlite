# Shadow rehearsal: fixtures only, with real GitHub Environment approvals and Slack.
name: E2E cloud
run-name: E2E cloud against ${{ inputs.stage || 'dev' }}${{ inputs.tag && format(' using {0}', inputs.tag) || '' }}
'on':
  workflow_call:
    outputs:
      release_result:
        description: Outcome of the release acceptance suite
        value: ${{ jobs.e2e.outputs.release_result }}
    inputs:
      candidate_id:
        required: false
        type: string
      candidate_digest:
        required: false
        type: string
      shadow_pins:
        required: true
        type: string
      release_sha:
        description: Exact tagged commit deployed by release acceptance.
        required: false
        type: string
      deployment_attempt:
        description: Release dev apply attempt required for acceptance.
        required: false
        type: string
      ref:
        description: Full commit SHA to build the SDKs and CLI from.
        required: true
        type: string
      stage:
        description: 'Stage to test: dev, stage or prod.'
        required: false
        type: string
        default: dev
      tag:
        description: Release client tag, e.g. v0.13.1 (blank = build from source).
        required: false
        type: string
      sweep:
        description: Reclaim boxes earlier runs stranded (dev only).
        required: false
        type: boolean
        default: true
      shadow_failure:
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: shadow-v2-e2e-cloud-${{ inputs.stage || 'dev' }}
  cancel-in-progress: false
env:
  BOXLITE_DEPS_STUB: '1'
  STAGE: ${{ inputs.stage || 'dev' }}
  RELEASE_TAG: ${{ inputs.tag || '' }}
jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release_result: ${{ steps.acceptance.outputs.result }}
    steps:
      - name: Verify fixture outputs and simulate dev cloud E2E
        shell: bash
        env:
          FAIL: ${{ inputs.shadow_failure }}
          PINS: ${{ inputs.shadow_pins }}
          EXPECTED: ${{ inputs.candidate_digest }}
          ID: ${{ inputs.candidate_id }}
          SHA: ${{ inputs.release_sha }}
          APPLIED: ${{ inputs.deployment_attempt }}
        run: |
          set -euo pipefail
          [[ "$FAIL" != e2e && "$APPLIED" == "$GITHUB_RUN_ATTEMPT" ]] || exit 1
          digest=$(printf '%s' "$PINS" | sha256sum | cut -d' ' -f1)
          [[ "sha256:$digest" == "$EXPECTED" ]] || exit 1
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$SHA" --argjson id "$ID" \
            '.tag == $tag and .sha == $sha and .attempt == $id' <<< "$PINS" >/dev/null
      - id: acceptance
        if: always()
        name: Record simulated E2E outcome
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: echo "result=$RESULT" >> "$GITHUB_OUTPUT"
