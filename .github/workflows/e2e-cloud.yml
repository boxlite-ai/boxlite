# Simulation for the release workflow.
name: E2E cloud
run-name: E2E cloud against ${{ inputs.stage || 'dev' }}${{ inputs.tag && format(' using {0}', inputs.tag) || '' }}
'on':
  workflow_call:
    outputs:
      release_result:
        description: Outcome of the release acceptance suite
        value: ${{ jobs.e2e.outputs.release_result }}
    inputs:
      release_sha:
        description: Exact tagged commit deployed by release acceptance.
        required: false
        type: string
      deployment_attempt:
        description: Release dev apply attempt required for acceptance.
        required: false
        type: string
      ref:
        description: Full commit SHA to build the SDKs and CLI from.
        required: true
        type: string
      stage:
        description: 'Stage to test: dev, stage or prod.'
        required: false
        type: string
        default: dev
      tag:
        description: Release client tag, e.g. v0.13.1 (blank = build from source).
        required: false
        type: string
      sweep:
        description: Reclaim boxes earlier runs stranded (dev only).
        required: false
        type: boolean
        default: true
    secrets:
      BOXLITE_DEV_API_KEY:
        description: Dev-stack boxlite API key for profile p1.
        required: false
      BOXLITE_DEV_P2_API_KEY:
        description: Dev key for p2, in a different organization from p1. Required at runtime on dev.
        required: false
      BOXLITE_DEV_P2_READONLY_API_KEY:
        description: Dev read-only key in p2 organization. Required at runtime on dev.
        required: false
      BOXLITE_STAGE_API_KEY:
        description: Stage key for p1.
        required: false
      BOXLITE_STAGE_P2_API_KEY:
        description: Stage key for p2 in a different organization.
        required: false
      BOXLITE_STAGE_P2_READONLY_API_KEY:
        description: Stage read-only key in the p2 organization.
        required: false
      BOXLITE_PROD_API_KEY:
        description: Prod-stack boxlite API key for profile p1.
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release client tag, e.g. v0.13.1 (blank = build from source)
        required: false
        type: string
      stage:
        description: Stage to test
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stage
          - prod
      api_url:
        description: API base URL (blank = the stage default)
        type: string
        required: false
      image:
        description: Box image to run cases against (blank = apps/box-images/VERSION)
        type: string
        required: false
      sweep:
        description: Reclaim boxes earlier runs stranded (dev only)
        type: boolean
        required: true
        default: true
permissions:
  contents: read
concurrency:
  group: shadow-e2e-cloud-${{ inputs.stage || 'dev' }}
  cancel-in-progress: false
env:
  BOXLITE_DEPS_STUB: '1'
  STAGE: ${{ inputs.stage || 'dev' }}
  RELEASE_TAG: ${{ inputs.tag || '' }}
jobs:
  e2e:
    name: Simulated cloud E2E
    if: ${{ contains(fromJSON('["dev", "stage", "prod"]'), inputs.stage || 'dev') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    cache-mode: read
    outputs:
      release_result: ${{ steps.acceptance.outputs.result }}
    steps:
      - name: Resolve the published SDK commit
        id: release_commit
        if: inputs.deployment_attempt || (inputs.tag && (inputs.stage || 'dev') == 'dev')
        env:
          DEPLOYMENT_ATTEMPT: ${{ inputs.deployment_attempt }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/boxlite-ai/boxlite/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] ||
            { echo '::error::GitHub did not return a full release commit SHA'; exit 1; }
          if [[ -n "$DEPLOYMENT_ATTEMPT" ]]; then
            [[ "$DEPLOYMENT_ATTEMPT" == "$GITHUB_RUN_ATTEMPT" ]] ||
              { echo '::error::Repeat dev deployment before rerunning release E2E'; exit 1; }
            [[ "$sha" == "$RELEASE_SHA" ]] ||
              { echo '::error::Release tag differs from the dev deployment'; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Simulate cloud E2E
        run: 'echo "SHADOW: cloud E2E"'
      - name: Summarize release acceptance
        id: acceptance
        if: always() && inputs.deployment_attempt
        env:
          E2E_RESULT: ${{ job.status }}
        run: |
          echo "result=$E2E_RESULT" >> "$GITHUB_OUTPUT"
          echo "Dev cloud E2E for $RELEASE_TAG — $E2E_RESULT" >> "$GITHUB_STEP_SUMMARY"
