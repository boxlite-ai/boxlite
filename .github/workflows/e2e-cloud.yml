# Shadow rehearsal: fixtures only, with real GitHub Environment approvals and Slack.
name: E2E cloud
run-name: E2E cloud against ${{ inputs.stage || 'dev' }}${{ inputs.tag && format(' using {0}', inputs.tag) || '' }}
'on':
  workflow_call:
    outputs:
      release_result:
        description: Outcome of the release acceptance suite
        value: ${{ jobs.e2e.outputs.release_result }}
    inputs:
      candidate_id:
        required: false
        type: string
      candidate_digest:
        required: false
        type: string
      release_sha:
        description: Exact tagged commit deployed by release acceptance.
        required: false
        type: string
      deployment_attempt:
        description: Release dev apply attempt required for acceptance.
        required: false
        type: string
      ref:
        description: Full commit SHA to build the SDKs and CLI from.
        required: true
        type: string
      stage:
        description: 'Stage to test: dev, stage or prod.'
        required: false
        type: string
        default: dev
      tag:
        description: Release client tag, e.g. v0.13.1 (blank = build from source).
        required: false
        type: string
      sweep:
        description: Reclaim boxes earlier runs stranded (dev only).
        required: false
        type: boolean
        default: true
      shadow_failure:
        type: string
        required: false
    secrets:
      BOXLITE_DEV_API_KEY:
        description: Dev-stack boxlite API key for profile p1.
        required: false
      BOXLITE_DEV_P2_API_KEY:
        description: Dev key for p2, in a different organization from p1. Required at runtime on dev.
        required: false
      BOXLITE_DEV_P2_READONLY_API_KEY:
        description: Dev read-only key in p2 organization. Required at runtime on dev.
        required: false
      BOXLITE_STAGE_API_KEY:
        description: Stage key for p1.
        required: false
      BOXLITE_STAGE_P2_API_KEY:
        description: Stage key for p2 in a different organization.
        required: false
      BOXLITE_STAGE_P2_READONLY_API_KEY:
        description: Stage read-only key in the p2 organization.
        required: false
      BOXLITE_PROD_API_KEY:
        description: Prod-stack boxlite API key for profile p1.
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: e2e-cloud-${{ inputs.stage || 'dev' }}
  cancel-in-progress: false
env:
  BOXLITE_DEPS_STUB: '1'
  STAGE: ${{ inputs.stage || 'dev' }}
  RELEASE_TAG: ${{ inputs.tag || '' }}
jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release_result: ${{ steps.acceptance.outputs.result }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-candidate
        with:
          id: ${{ inputs.candidate_id }}
          digest: ${{ inputs.candidate_digest }}
          tag: ${{ inputs.tag }}
          sha: ${{ inputs.release_sha }}
      - name: Simulate dev cloud E2E
        shell: bash
        env:
          FAIL: ${{ inputs.shadow_failure }}
        run: test "$FAIL" != e2e
      - id: acceptance
        if: always()
        name: Record simulated E2E outcome
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: echo "result=$RESULT" >> "$GITHUB_OUTPUT"
