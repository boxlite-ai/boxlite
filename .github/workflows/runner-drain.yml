name: runner-drain
run-name: drain ${{ inputs.stage }} · ${{ inputs.runner_names }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage whose runners should start draining
        required: true
        type: choice
        default: dev
        options: [dev, prod]
      runner_names:
        description: Comma-separated control-plane runner names, e.g. default,runner-2
        required: true
        type: string
      confirm:
        description: Required for a stage whose declaration marks it protected
        required: true
        type: boolean
        default: false

# Serialize state requests with deployment; release the lock after the API accepts them.
concurrency:
  group: mdeploy-all-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  drain:
    if: ${{ github.ref == 'refs/heads/main' || inputs.stage == 'dev' }}
    environment: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-infra
        with:
          stages: ${{ inputs.stage }}
          stage-config: ${{ vars.BOXLITE_MSTAGE_BOXLITE_APP_CONFIG }}
      - name: Resolve the stage
        id: config
        working-directory: apps/infra
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          set -Eeuo pipefail
          output="$(npm run --silent mbuild inspect -- --stage "$STAGE")"
          echo "$output" >> "$GITHUB_OUTPUT"
      - name: Federate an AWS identity
        if: steps.config.outputs.kind == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/boxlite-${{ inputs.stage }}-github-deploy
          aws-region: ${{ steps.config.outputs.region }}
          role-session-name: runner-drain-${{ github.run_id }}
      - name: Federate a GCP identity
        if: steps.config.outputs.kind == 'artifact-registry'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - name: Install gcloud
        if: steps.config.outputs.kind == 'artifact-registry'
        uses: google-github-actions/setup-gcloud@v2
      - name: Request drain
        working-directory: apps/infra
        env:
          STAGE: ${{ inputs.stage }}
          RUNNER_NAMES: ${{ inputs.runner_names }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          args=(--stage "$STAGE" --runners "$RUNNER_NAMES")
          if [ "$CONFIRM" = 'true' ]; then args+=(--confirm); fi
          npm run --silent runner:drain -- "${args[@]}"
          printf 'Drain requested for %s in %s.\n\n' "$RUNNER_NAMES" "$STAGE" >> "$GITHUB_STEP_SUMMARY"
          echo 'API accepted draining=true. Migration completion and retirement require separate follow-up.' >> "$GITHUB_STEP_SUMMARY"
