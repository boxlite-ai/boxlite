# Integration-test the filestore volume path against a real NFS server.
#
# test.yml's Go job runs the runner's volume tests with the mount command and
# the mountpoint probe faked (seams installed by the unit tests). What those
# seams cannot observe is exactly what this workflow proves: a kernel NFS
# mount exists in /proc/mounts, the traffic crosses a real NFS boundary, the
# per-instance mount is shared rather than double-mounted, the reclaim tears
# it down, and the box's data survives server-side after the reclaim.
#
# The ganesha server runs in a container, not a `services:` block: services
# start before checkout, so bind-mounting the workspace's ganesha.conf and
# export directory would hand the container empty host paths. The image's
# default entrypoint also has to be overridden — it builds a loop-mounted disk
# image, which crashes unprivileged — so it runs ganesha.nfsd in the
# foreground directly.
name: Filestore Integration

on:
  push:
    branches: [main, feat/filestore-volume]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filestore-integration:
    name: Filestore NFS Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-go

      - name: Check out native dependency workspaces
        # Cargo's cache action reads the nested workspace metadata during setup.
        run: make setup:submodules

      - uses: ./.github/actions/setup-rust
        with:
          # test.yml takes this from its changes job's output, which the
          # ci-config action derives as "stable"; no config job here to ask.
          toolchain: stable
          cache-workspaces: |
            . -> target
            src/deps/libkrun-sys/vendor/libkrun -> target
          cache-workspace-crates: 'true'

      - name: Install build dependencies
        # Includes LLVM, whose llvm-objcopy the symbol-fixing step below needs.
        run: make setup:build

      - uses: ./.github/actions/sccache

      - name: Build the native library the runner's Go tests link
        # The same chain `make dev:go` runs locally: build boxlite-c, localize
        # the Go runtime symbols libgvproxy brings into libboxlite.a, then
        # stage the fixed archive next to the Go SDK. The boxlite_dev build
        # tag links the library from target/debug.
        run: |
          cargo build -p boxlite-c
          bash scripts/build/fix-go-symbols.sh target/debug/libboxlite.a
          cp target/debug/libboxlite.a sdks/go/

      - name: Install NFS client tools
        # mount.nfs for the kernel mount, mountpoint for the is-mounted probe,
        # umount for the reclaim teardown.
        run: sudo apt-get update && sudo apt-get install -y nfs-common

      - name: Create the server-side export directory
        # Bind-mounted into the ganesha container as /export; the
        # cross-boundary assertion after the test reads it from the host.
        run: mkdir -p filestore-export

      - name: Start nfs-ganesha
        # Entry point override is required (see the header comment). rpcbind
        # and statd run before ganesha — ganesha binds 2049 only after them in
        # this image — and dbus is deliberately skipped: `dbus-daemon --system
        # --fork` hangs in this container and ganesha runs fine without it.
        # NFSv4.1 serves everything over TCP 2049 — no mountd ports to publish.
        run: |
          docker run -d --name nfs-ganesha \
            --publish 2049:2049 \
            --volume "$PWD/.github/ci-config/filestore/ganesha.conf:/etc/ganesha/ganesha.conf:ro" \
            --volume "$PWD/filestore-export:/export" \
            --entrypoint /bin/sh \
            longhornio/nfs-ganesha \
            -c 'mkdir -p /run/rpcbind && rpcbind && rpc.statd -L; sleep 1; exec /usr/bin/ganesha.nfsd -F -f /etc/ganesha/ganesha.conf'

      - name: Wait for the NFS server to accept connections
        # The probe targets the container IP, not the published port: the
        # docker proxy binds the host port the moment the container starts,
        # so a 127.0.0.1 probe can report "open" while ganesha is still
        # initializing (verified false positive during local bring-up).
        run: |
          ip=$(docker inspect -f '{{.NetworkSettings.IPAddress}}' nfs-ganesha)
          deadline=$((SECONDS + 30))
          until (echo > /dev/tcp/$ip/2049) 2>/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "nfs-ganesha did not accept connections on $ip:2049 within 30s" >&2
              docker logs nfs-ganesha || true
              exit 1
            fi
            sleep 1
          done
          echo "nfs-ganesha is accepting connections on $ip:2049"

      - name: Run the filestore integration test
        # Mounting needs root; -E plus an explicit PATH keeps sudo on the
        # setup-go toolchain, and HOME=/root keeps root's Go caches out of the
        # runner user's home.
        working-directory: apps/runner
        env:
          FILESTORE_TEST_SERVER: 127.0.0.1
          FILESTORE_TEST_EXPORT: /export
        run: |
          sudo -E env "PATH=$PATH" "HOME=/root" go test -tags boxlite_dev,nfs_integration ./pkg/boxlite/ -run TestFilestoreIntegration -v -count=1

      - name: Assert the box's data survived on the server side
        # The test writes hello.txt through the kernel mount; after the
        # reclaim unmounts, the bytes must still be in the export the ganesha
        # container serves — destroy unbinds, never deletes data. This is the
        # cross-boundary half the in-process assertions cannot see.
        run: |
          test -f filestore-export/int-box-0/hello.txt
          cat filestore-export/int-box-0/hello.txt

      - name: Dump nfs-ganesha logs
        if: failure()
        run: docker logs nfs-ganesha || true
