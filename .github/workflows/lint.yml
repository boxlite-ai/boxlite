name: Lint and Format

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.rs'
      - '**/*.py'
      - '**/*.ts'
      - '**/*.c'
      - '**/*.h'
      - '**/*.go'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'sdks/python/**'
      - 'sdks/node/**'
      - 'sdks/c/**'
      - 'sdks/go/**'
      - 'make/quality.mk'
      - 'make/test.mk'
      - '.pre-commit-config.yaml'
      - '.github/workflows/lint.yml'
      - '.github/workflows/config.yml'
      - '.github/workflows/build-runtime.yml'
      - 'scripts/release/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.rs'
      - '**/*.py'
      - '**/*.ts'
      - '**/*.c'
      - '**/*.h'
      - '**/*.go'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'sdks/python/**'
      - 'sdks/node/**'
      - 'sdks/c/**'
      - 'sdks/go/**'
      - 'make/quality.mk'
      - 'make/test.mk'
      - '.pre-commit-config.yaml'
      - '.github/workflows/lint.yml'
      - '.github/workflows/config.yml'
      - '.github/workflows/build-runtime.yml'
      - 'scripts/release/**'

jobs:
  config:
    uses: ./.github/workflows/config.yml

  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      c: ${{ steps.filter.outputs.c }}
      go: ${{ steps.filter.outputs.go }}
      quality: ${{ steps.filter.outputs.quality }}
      install_script: ${{ steps.filter.outputs.install_script }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
            python:
              - 'sdks/python/**/*.py'
              - 'sdks/python/pyproject.toml'
            node:
              - 'sdks/node/**/*.ts'
              - 'sdks/node/package.json'
              - 'sdks/node/tsconfig.json'
            c:
              - 'sdks/c/**/*.c'
              - 'sdks/c/**/*.h'
              - 'sdks/c/tests/CMakeLists.txt'
            go:
              - 'sdks/go/**/*.go'
              - 'sdks/go/go.mod'
            quality:
              - 'make/quality.mk'
              - '.pre-commit-config.yaml'
              - '.github/workflows/lint.yml'
            install_script:
              - 'scripts/release/**'
              - '.github/workflows/build-runtime.yml'
              - 'make/test.mk'

  rustfmt:
    name: Check Rust formatting
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.quality == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: make fmt:check:rust

  clippy:
    name: Run Clippy on ${{ matrix.os }}
    needs: [config, changes]
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.quality == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.config.outputs.platforms) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          components: clippy

      - name: Install guest cross target (macOS)
        if: runner.os == 'macOS'
        run: rustup target add $(bash scripts/util.sh --target)

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools protobuf-compiler

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        continue-on-error: true

      - name: Export GHA cache env vars
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2 || '');
            core.exportVariable('CARGO_INCREMENTAL', '0');

      - name: Run clippy checks
        run: make clippy

  python:
    name: Python lint and format checks
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.quality == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run Python lint
        run: make lint:python

      - name: Check Python formatting
        run: make fmt:check:python

  node:
    name: Node.js lint and format checks
    needs: changes
    if: ${{ needs.changes.outputs.node == 'true' || needs.changes.outputs.quality == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: sdks/node
        run: npm install

      - name: Run Node lint
        run: make lint:node

      - name: Check Node formatting
        run: make fmt:check:node

      - name: Type check
        working-directory: sdks/node
        run: npx tsc --noEmit

  c:
    name: C SDK lint and format checks
    needs: changes
    if: ${{ needs.changes.outputs.c == 'true' || needs.changes.outputs.quality == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy

      - name: Run C lint
        run: make lint:c

      - name: Check C formatting
        run: make fmt:check:c

  go:
    name: Go lint and format checks
    needs: [config, changes]
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.quality == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24'

      - name: Check Go formatting
        run: make fmt:check:go

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: ${{ needs.config.outputs.rust-toolchain }}

      - name: Install build dependencies
        run: make setup:build

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        continue-on-error: true

      - name: Export GHA cache env vars
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2 || '');
            core.exportVariable('CARGO_INCREMENTAL', '0');

      - name: Build Go SDK
        run: make dev:go

      - name: Run Go vet
        run: make lint:go

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          working-directory: sdks/go
          args: --timeout=5m --build-tags boxlite_dev

  install_script:
    name: Installer script smoke test
    needs: changes
    if: ${{ needs.changes.outputs.install_script == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Run installer script smoke test
        run: make test:install-script