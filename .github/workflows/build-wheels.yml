name: Build Wheels

on:
  release:
    types: [ published ]
  workflow_dispatch:  # Allow manual triggering

env:
  SKIP_INSTALL_NODEJS: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  # Load shared configuration
  config:
    uses: ./.github/workflows/config.yml

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: config
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.config.outputs.platforms) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.config.outputs.rust-toolchain }}

      - uses: ./.github/actions/sccache

      - uses: ./.github/actions/build-guest
        if: runner.os == 'Linux'

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_BUILD_VERBOSITY: 0
        with:
          package-dir: sdks/python

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  # cibuildwheel verifies each installed wheel before build_wheels can succeed.
  publish:
    name: Publish to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  upload_to_release:
    name: Upload wheels to GitHub Release
    needs: build_wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write  # Required to upload to releases

    steps:
      # Before the download, not after: ./.github/actions/upload-to-release below is resolved from
      # the checked-out tree, and checkout cleans the workspace, which would take the wheels with
      # it if it ran second.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false # Only the action.yml is needed; nothing here runs git.

      - name: Download all wheels
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Upload wheels to release
        uses: ./.github/actions/upload-to-release
        with:
          files: dist/*.whl
