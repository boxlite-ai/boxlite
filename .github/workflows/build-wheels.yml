name: Build Wheels

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

env:
  SKIP_INSTALL_NODEJS: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  # Load shared configuration
  config:
    uses: ./.github/workflows/config.yml

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: config
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.config.outputs.platforms) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.config.outputs.rust-toolchain }}
          cache: ${{ runner.os != 'Linux' }}

      - uses: ./.github/actions/sccache

      - uses: ./.github/actions/build-guest
        if: runner.os == 'Linux'

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_BUILD_VERBOSITY: 0
          BOXLITE_HOST_SCCACHE_DIR: ${{ env.SCCACHE_DIR }}
          BOXLITE_HOST_SCCACHE_BIN: ${{ env.SCCACHE_PATH }}
        with:
          package-dir: sdks/python

      - name: Return container cache to the runner
        if: always() && runner.os == 'Linux'
        run: |
          if [ -d "$SCCACHE_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$SCCACHE_DIR"
          fi

      - name: Record build origin
        working-directory: wheelhouse
        run: |
          jq -n --arg sha "$(git rev-parse HEAD)" --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{sha: $sha, run: $run, attempt: $attempt}' > producer.json

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          if-no-files-found: error
          name: wheels-${{ matrix.os }}
          path: |
            ./wheelhouse/*.whl
            wheelhouse/producer.json
          retention-days: 7
