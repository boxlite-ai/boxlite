# Shadow rehearsal: real approvals and marked Slack notifications, with simulated build, upload and deployment steps.
name: Build Wheels
'on':
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
jobs:
  config:
    uses: ./.github/workflows/config.yml
    permissions:
      contents: read
      actions: read
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: config
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.config.outputs.platforms) }}
    steps:
      - name: Checkout code
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/setup-rust
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/sccache
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: ./.github/actions/build-guest
        if: runner.os == 'Linux'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Build wheels
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Return container cache to the runner
        if: always() && runner.os == 'Linux'
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Record build origin
        shell: bash
        run: printf '%s\n' 'Simulated'
      - name: Upload wheels as artifacts
        shell: bash
        run: printf '%s\n' 'Simulated'
    permissions:
      contents: read
      actions: read
permissions:
  contents: read
  actions: read
