# Shadow rehearsal: fixtures only, with real GitHub Environment approvals and Slack.
name: mdeploy-all
run-name: '[SHADOW] release deployment ${{ inputs.stage }}'
'on':
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      ref:
        required: true
        type: string
      candidate_id:
        required: false
        type: string
      candidate_digest:
        required: false
        type: string
      registry_digests:
        required: false
        type: string
      release_sha:
        required: true
        type: string
      accepted_attempt:
        required: false
        type: string
      components:
        required: true
        type: string
      apply:
        required: true
        type: boolean
      confirm:
        required: true
        type: boolean
      shadow_failure:
        type: string
        required: false
    secrets:
      SLACK_WEBHOOK_URL:
        required: false
      SLACK_DEV_DEPLOYMENT_WEBHOOK_URL:
        required: false
      BOXLITE_DEV_API_KEY:
        required: false
      BOXLITE_DEV_P2_API_KEY:
        required: false
      BOXLITE_DEV_P2_READONLY_API_KEY:
        required: false
    outputs:
      accepted_attempt:
        description: Release deployment attempt that passed cloud acceptance
        value: ${{ jobs.e2e.outputs.release_result == 'success' && jobs.plan.outputs.deployment_attempt || '' }}
      e2e_result:
        description: Dev cloud acceptance outcome for release failure reporting
        value: ${{ jobs.e2e.outputs.release_result }}
concurrency:
  group: shadow-v2-mdeploy-all-${{ inputs.stage }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  resolve:
    name: resolve ${{ inputs.ref || github.sha }}
    if: ${{ github.ref == 'refs/heads/codex/shadow-release-3069-v2' || inputs.stage == 'dev' || inputs.stage == 'stage' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.fixture.outputs.sha }}
      version: ${{ steps.fixture.outputs.version }}
      prepare_components: ${{ steps.fixture.outputs.prepare_components }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: fixture
        name: Select shadow deployment
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
          TAG: ${{ inputs.ref }}
          SHA: ${{ inputs.release_sha }}
        run: |-
          set -euo pipefail
          [[ "$STAGE" == dev || "$STAGE" == prod ]]
          printf 'sha=%s\nversion=%s\nprepare_components=["release"]\n' "$SHA" "$TAG" >> "$GITHUB_OUTPUT"
      - &verify-dev-acceptance
        name: Verify dev acceptance for the production candidate
        if: inputs.release_sha && inputs.stage == 'prod'
        env:
          ACCEPTED_ATTEMPT: ${{ inputs.accepted_attempt }}
          CANDIDATE: ${{ inputs.candidate_id }}
          DIGEST: ${{ inputs.candidate_digest }}
          TAG: ${{ inputs.ref }}
          SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[1-9][0-9]*$ && "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$ACCEPTED_ATTEMPT" =~ ^[1-9][0-9]*$ && "$ACCEPTED_ATTEMPT" -le "$GITHUB_RUN_ATTEMPT" ]]
          receipt=$(mktemp -d "$RUNNER_TEMP/acceptance.XXXXXX")
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "dev-accepted-$CANDIDATE" --dir "$receipt"
          jq -e --argjson run "$GITHUB_RUN_ID" --argjson id "$CANDIDATE" --argjson attempt "$ACCEPTED_ATTEMPT" \
            --arg digest "$DIGEST" --arg tag "$TAG" --arg sha "$SHA" \
            '.run == $run and .candidate == $id and .attempt == $attempt and .digest == $digest and .tag == $tag and .sha == $sha' \
            "$receipt/acceptance.json" >/dev/null

      - name: Notify dev reviewers
        if: inputs.apply && inputs.stage == 'dev' && !inputs.release_sha
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEV_DEPLOYMENT_WEBHOOK_URL }}
          DEPLOY_ENVIRONMENT: ${{ inputs.stage }}
          APPROVAL_PHASE: Release deployment approval
        run: node apps/infra/scripts/release-pipeline.mjs approval
      - name: Notify release reviewers
        if: inputs.apply && (inputs.stage == 'prod' || (inputs.stage == 'dev' && inputs.release_sha))
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_ENVIRONMENT: ${{ inputs.stage }}
          APPROVAL_PHASE: Release deployment approval
          ACCEPTED_TAG: ${{ inputs.stage == 'prod' && inputs.accepted_attempt && inputs.ref || '' }}
        run: node apps/infra/scripts/release-pipeline.mjs approval
  plan:
    name: ${{ matrix.component == 'release' && 'deploy release' || format('plan and build {0}', matrix.component) }} ${{ inputs.stage }}
    needs:
      - resolve
    if: ${{ !cancelled() && !failure() && (github.ref == 'refs/heads/codex/shadow-release-3069-v2' || inputs.stage == 'dev' || inputs.stage == 'stage') }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        component: ${{ fromJSON(needs.resolve.outputs.prepare_components) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      deployment_attempt: ${{ steps.applied.outputs.attempt }}
    environment: ${{ inputs.stage }}
    concurrency:
      group: shadow-v2-plan-${{ inputs.stage }}
      cancel-in-progress: false
    steps:
      - *verify-dev-acceptance
      - name: Simulate the approved apply
        shell: bash
        env:
          FAIL: ${{ inputs.shadow_failure }}
          STAGE: ${{ inputs.stage }}
        run: test "$FAIL" != "$STAGE-deploy"
      - name: Record the approved dev apply
        id: applied
        if: inputs.release_sha && inputs.stage == 'dev'
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  notify-deploy:
    name: Notify reviewers of the commit deployment
    continue-on-error: true
    needs:
      - resolve
      - plan
    if: inputs.apply && inputs.stage == 'dev' && needs.resolve.outputs.version == '' && needs.plan.result == 'success'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Notify reviewers
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEV_DEPLOYMENT_WEBHOOK_URL }}
          DEPLOY_ENVIRONMENT: ${{ inputs.stage }}
          APPROVAL_PHASE: Commit deployment approval
        run: node apps/infra/scripts/release-pipeline.mjs approval
  deploy:
    name: ${{ inputs.apply && 'deploy' || 'preview' }} ${{ inputs.stage }}
    needs:
      - resolve
      - plan
      - notify-deploy
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success' && needs.plan.result == 'success' && needs.resolve.outputs.version == '' && (github.ref ==
      'refs/heads/codex/shadow-release-3069-v2' || inputs.stage == 'dev' || inputs.stage == 'stage') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Simulate standalone commit apply
        shell: bash
        run: echo "simulated apply"
  result:
    name: Notify deployment result
    needs:
      - resolve
      - plan
      - deploy
    if: ${{ always() && !cancelled() && inputs.apply && needs.resolve.result != 'skipped' && contains(fromJSON('["dev","stage","prod"]'), inputs.stage) }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.stage }}
      DEPLOY_REF: ${{ inputs.ref || github.sha }}
      DEPLOY_RESULT: >-
        ${{ needs.resolve.result == 'success' && needs.plan.result == 'success' && (needs.resolve.outputs.version || needs.deploy.result == 'success') &&
        'success' || 'failure' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Send release deployment outcome
        if: inputs.release_sha || inputs.stage == 'prod'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node apps/infra/scripts/release-pipeline.mjs result
      - name: Send standalone dev or stage deployment outcome
        if: ${{ !inputs.release_sha && inputs.stage != 'prod' }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEV_DEPLOYMENT_WEBHOOK_URL }}
        run: node apps/infra/scripts/release-pipeline.mjs result
  e2e:
    name: Dev release E2E
    needs:
      - resolve
      - plan
    if: inputs.release_sha && inputs.stage == 'dev'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/e2e-cloud.yml
    with:
      stage: dev
      ref: ${{ github.sha }}
      release_sha: ${{ needs.resolve.outputs.sha }}
      tag: ${{ inputs.ref }}
      candidate_id: ${{ inputs.candidate_id }}
      candidate_digest: ${{ inputs.candidate_digest }}
      deployment_attempt: ${{ needs.plan.outputs.deployment_attempt || 'missing' }}
      shadow_failure: ${{ inputs.shadow_failure }}
