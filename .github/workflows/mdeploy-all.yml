# Build commits for dev/stage; import existing GHCR releases for dev/prod.
# Stage treats a stable tag as a commit reference and builds SHA-tagged artifacts.
name: mdeploy-all

# Everything a person scanning the Actions list needs to tell two runs apart:
# what it does, to which stage, from which ref, and how much of the stage it
# touches. The ref is shown as typed, because its shape is what decided the
# rest — `v1.2.3`, `#1570` and a SHA each read as the line they select.
#
# The title is rendered before any job starts, so it can only use `inputs`.
# `resolve` writes the same thing in words, once it has read them.
run-name: >-
  ${{ inputs.apply && 'deploy' || 'preview' }} ${{ inputs.stage }} ·
  ${{ inputs.ref || github.sha }} · ${{ inputs.components }}${{ inputs.requested_by != '' && inputs.request_id != '' && format(' · @{0} · {1}', inputs.requested_by, inputs.request_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      requested_by:
        description: Public GitHub username of the requester
        required: false
        type: string
      request_id:
        description: Opaque request ID for run attribution
        required: false
        type: string
      # A choice rather than free text: this value selects the deployment
      # Environment of every job below, and an Environment carries the secrets
      # and the reviewers of the stage it names. Enforced across every workflow
      # by apps/infra/deployment/release-safety.test.ts.
      stage:
        description: Stage to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stage
          - prod
      components:
        description: Components to deploy
        required: true
        default: api+runner
        type: choice
        options:
          - api+runner
          - api
          - runner
      ref:
        description: >-
          A stable tag (v<X.Y.Z>); a full commit SHA or pull request (#<number>)
          for dev/stage. Stage builds the commit named by a tag. Empty uses this dispatch's own commit.
        required: false
      apply:
        description: Apply the change. Off previews it and stops.
        required: true
        type: boolean
        default: false
      confirm:
        description: Required for a stage whose declaration marks it protected
        required: true
        type: boolean
        default: false

concurrency:
  # One of these per stage. The image workflows it calls hold their own groups —
  # a publish per stage — and the apply is this workflow's own job, so without a
  # group here two dispatches would interleave their halves rather than queue,
  # and two applies against one stage would read and write the same checkpoint.
  group: mdeploy-all-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # gh ships on a runner and is never signed in, and the stage declaration names
  # github a required provider — so every step that reaches mstage fails on the
  # session before it fails on anything worth reading. `resolve` needs it for a
  # second reason: it asks the Releases API whether a version was ever cut.
  GH_TOKEN: ${{ github.token }}

jobs:
  # What this run is about, resolved once and refused early.
  #
  # No Environment. Every refusal here is about this repository's own refs and
  # releases, so none of it needs a stage's secrets — and a job that bound one
  # would cost an approval before the run could tell the operator their ref was
  # a typo.
  resolve:
    name: resolve ${{ inputs.ref || github.sha }}
    # Dev and stage can exercise candidate workflow branches. Other stages
    # retain the main-only guard; release refs are checked separately below.
    if: ${{ github.ref == 'refs/heads/main' || inputs.stage == 'dev' || inputs.stage == 'stage' }}
    # A job-level block replaces the workflow-level one rather than merging with
    # it, so `contents: read` is restated. `pull-requests: read` is what lets a
    # request's merge resolve below, and it is granted here rather than at
    # workflow level so the jobs that reach a cloud role never carry it — this
    # is the only job that reads the API, and it binds no Environment.
    # `id-token` is not restated: nothing here federates.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.classify.outputs.version }}
      image_tag: ${{ steps.tag.outputs.image }}
      line: ${{ steps.classify.outputs.line }}
      prepare_components: ${{ steps.tag.outputs.prepare_components }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Tags, the commits they name, and the branch the containment check
          # below compares against. A shallow checkout carries none of them.
          fetch-depth: 0

      # Which of the two paths this run is on, and whether this stage allows it.
      - name: Classify the ref
        id: classify
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          FALLBACK: ${{ github.sha }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -Eeuo pipefail
          candidate="${REF:-$FALLBACK}"
          version=''
          pr=''
          case "$STAGE" in
            dev|stage|prod) ;;
            *) echo "::error title=stage::unknown deployment stage '$STAGE'"; exit 1 ;;
          esac
          # Three shapes, told apart here and nowhere else, so every job below
          # reads a decision rather than re-parsing the input.
          #
          # `v` and a stable X.Y.Z is how this repository spells a release tag,
          # and the same shape mbuild's RELEASE_VERSION accepts. `#` and digits
          # is a pull request, written the way GitHub writes one — a bare
          # number would be a valid abbreviated SHA in a repository that has
          # one, and the sigil keeps the operator's intent explicit rather than
          # letting the shape guess it.
          if [[ "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            # Stage uses the tag only to identify a commit, not release artifacts.
            if [ "$STAGE" != 'stage' ]; then version="$candidate"; fi
          elif [[ "$candidate" =~ ^#[1-9][0-9]*$ ]]; then
            pr="${candidate#\#}"
          elif [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=ref::'$candidate' is none of a release tag (v<X.Y.Z>), a pull request (#<number>), or a full lowercase commit SHA"
            exit 1
          fi
          # Explicit commit destinations keep prod release-only and fail closed
          # if another stage is added without its own admission decision.
          if [ "$STAGE" != 'dev' ] && [ "$STAGE" != 'stage' ] && [ -z "$version" ]; then
            echo "::error title=ref::$STAGE deploys released versions only; give a release tag (v<X.Y.Z>) rather than a commit or a pull request"
            exit 1
          fi
          # Release rollouts keep the protected main workflow definition.
          if [ -n "$version" ] && [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "::error title=ref::a release rollout runs from main; $GITHUB_REF can deploy dev from a commit instead"
            exit 1
          fi
          # What this run is, in words, decided here with everything else that
          # reads the ref's shape. The run title cannot use it — GitHub renders
          # that before any job starts — so the title carries the raw input and
          # this carries the reading of it.
          line="commit ${candidate:0:12}"
          [ -z "$version" ] || line="release $version"
          [ -z "$pr" ] || line="pull request #$pr"

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'pr=%s\n' "$pr" >> "$GITHUB_OUTPUT"
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'line=%s\n' "$line" >> "$GITHUB_OUTPUT"
          echo "${STAGE}: ${line}"

      # A pull request becomes the commit it would merge to, not its head.
      #
      # `refs/pull/N/merge` is the request's own base plus the request, which
      # is the tree that would land. A head is the same work missing whatever
      # its base gained since it was branched, so shaking one out on a stage
      # answers about a tree nobody will ever merge — and the older the branch,
      # the further that answer is from the one being asked for.
      #
      # It buys no ordering against this file. The definition running here came
      # from the ref the run was dispatched at, and on the dev path that need
      # not be the request's base at all; the merge can sit behind it. What the
      # merge is guaranteed against is the request's base, which is the
      # comparison that matters for "would this land cleanly and work".
      # Same API call as `deploy-infra.yml`'s own resolve, which states the
      # stronger version of this because it runs from main alone.
      #
      # The number rather than a SHA: asking the API which PR a commit belongs
      # to returns nothing for a fork's head, so a SHA-first lookup can never
      # accept a fork. A known number works for both.
      #
      # This replaces the branch check rather than skipping it. A merge commit
      # sits on no branch, so `--is-ancestor` could only ever refuse it — what
      # is proved instead is stronger for this purpose: the pull request is open
      # right now and merges cleanly, and GitHub recomputes the ref whenever
      # either side moves.
      - name: Resolve a pull request to the commit it would merge
        id: pr
        if: steps.classify.outputs.pr != ''
        shell: bash
        env:
          PR: ${{ steps.classify.outputs.pr }}
        run: |
          set -Eeuo pipefail
          fields=state,headRefOid,isCrossRepository,mergeable,potentialMergeCommit
          if ! pr_json="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json "$fields" 2>&1)"; then
            echo "::error title=pull request::no pull request #$PR in this repository ($pr_json)"
            exit 1
          fi
          # Mergeability is computed lazily, so UNKNOWN is a "not yet" rather
          # than a verdict. There is no event to await — the answer only exists
          # once GitHub recomputes it — so this polls rather than failing a
          # dispatch on a cold cache.
          #
          # Every field is read inside the loop, so the verdict below is about
          # the pull request as it stands when the loop leaves rather than as
          # the first response found it: one closed while this waited is not a
          # request to roll out, whatever the first response said.
          for attempt in 1 2 3 4 5; do
            state="$(jq -r '.state' <<<"$pr_json")"
            mergeable="$(jq -r '.mergeable' <<<"$pr_json")"
            sha="$(jq -r '.potentialMergeCommit.oid // empty' <<<"$pr_json")"
            if [ "$state" != 'OPEN' ]; then break; fi
            if [ "$mergeable" != 'UNKNOWN' ] && [ -n "$sha" ]; then break; fi
            if [ "$attempt" -eq 5 ]; then break; fi
            sleep 5
            pr_json="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json "$fields")"
          done
          if [ "$state" != 'OPEN' ]; then
            echo "::error title=pull request::#$PR is $state, not open; a closed pull request names no live ref"
            exit 1
          fi
          if [ "$mergeable" = 'CONFLICTING' ]; then
            echo "::error title=pull request::#$PR conflicts with its base, so it has no merge commit to deploy; resolve and re-dispatch"
            exit 1
          fi
          # MERGEABLE, not "anything but CONFLICTING": UNKNOWN can arrive
          # beside a merge commit computed before the last push, and rolling
          # that out installs a tree neither side of the request has.
          if [ "$mergeable" != 'MERGEABLE' ] || [ -z "$sha" ]; then
            echo "::error title=pull request::#$PR has no merge commit this run can trust (mergeable=$mergeable, merge commit ${sha:-none}) after 5 attempts; open it once to force the computation, then re-dispatch"
            exit 1
          fi
          # Logged, never gated on. Dispatching this workflow already needs
          # write access, and every job that reaches a cloud role sits behind
          # its stage's Environment — a fork's merge reaches those no more
          # easily than a same-repo one. What an approver should know is that
          # Runner and image build steps compile this tree, so the
          # approval that releases them is what stands between a fork's build
          # code and this stage's credentials. It is a person unblocking a
          # run, not a reading of the diff; `apps/infra/mdeploy/README.md`
          # says what that is and is not worth.
          fork="$(jq -r '.isCrossRepository' <<<"$pr_json")"
          head="$(jq -r '.headRefOid' <<<"$pr_json")"
          echo "#$PR ($([ "$fork" = 'true' ] && echo fork || echo same-repo)) head is $head; deploying merge $sha"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      # A tag is not a release. The runner binary a release-path deploy installs
      # is an asset on the GitHub Release — `stack/runner-binary.ts:270` composes
      # that URL — so a tag that was pushed but never released, or released
      # before its build finished, resolves to a download that 404s on the host
      # at boot. Both halves are asked here, where the answer costs one API read
      # instead of a rolled-out fleet that cannot start.
      - name: Require the release this tag names
        if: steps.classify.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ steps.classify.outputs.version }}
          COMPONENTS: ${{ inputs.components }}
        run: |
          set -Eeuo pipefail
          if ! release="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>&1)"; then
            echo "::error title=release::$VERSION has no GitHub Release; cut one before deploying it${release:+ ($release)}"
            exit 1
          fi
          if [ "$(printf '%s' "$release" | jq -r '.isDraft')" = 'true' ]; then
            echo "::error title=release::$VERSION is still a draft release; publishing it is what starts its builds"
            exit 1
          fi
          # API-only updates do not install a Runner binary.
          if [ "$COMPONENTS" = 'api' ]; then exit 0; fi
          # The names are `build-runner-binary.yml`'s and `runnerArtifactFor`'s.
          # Asked by name rather than by count, because a release carries the
          # SDK archives too.
          tarball="boxlite-runner-${VERSION}-linux-amd64.tar.gz"
          for asset in "$tarball" "${tarball}.sha256"; do
            held="$(printf '%s' "$release" | jq -r --arg name "$asset" '[.assets[] | select(.name == $name)] | length')"
            if [ "$held" = '0' ]; then
              echo "::error title=release::$VERSION carries no $asset; the runner build for that release has not finished or did not succeed"
              exit 1
            fi
          done
          echo "$VERSION carries $tarball and its checksum"

      # A tag or a commit becomes a commit here. A pull request took the step
      # above instead, because its merge commit sits on no branch and this
      # check could only refuse it.
      #
      # Every job below addresses these bytes rather than the name they were
      # given: a tag that moved between two resolutions would build one commit
      # and deploy another. `branch` refuses a commit the dispatched branch
      # does not contain — existing is not enough, because a commit on a
      # force-pushed branch still resolves and still names bytes.
      - id: ref
        if: steps.classify.outputs.pr == ''
        uses: ./.github/actions/resolve-ref
        with:
          ref: ${{ steps.classify.outputs.candidate }}
          branch: ${{ github.ref_name }}

      # The one commit this run is about, and the image address's tag, composed
      # once. Exactly one of the two steps above ran, and this is the only place
      # that has to know which. The release line and the commit line are two
      # addresses on purpose: prod can be narrowed to released bytes only
      # because they are not the same name.
      - name: Address the images
        id: tag
        shell: bash
        env:
          VERSION: ${{ steps.classify.outputs.version }}
          RESOLVED: ${{ steps.ref.outputs.sha }}
          MERGED: ${{ steps.pr.outputs.sha }}
          COMPONENTS: ${{ inputs.components }}
        run: |
          set -Eeuo pipefail
          sha="${RESOLVED:-$MERGED}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=ref::nothing resolved this dispatch to a commit"
            exit 1
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "${VERSION:+${VERSION}-}${sha}" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then
            echo 'prepare_components=["release"]' >> "$GITHUB_OUTPUT"
          else
            case "$COMPONENTS" in
              api+runner) echo 'prepare_components=["api","runner"]' >> "$GITHUB_OUTPUT" ;;
              api|runner) printf 'prepare_components=["%s"]\n' "$COMPONENTS" >> "$GITHUB_OUTPUT" ;;
              *) echo '::error title=components::Unsupported artifact selection'; exit 1 ;;
            esac
          fi

  # Each commit artifact plans/builds on its own runner; releases use one apply leg.
  plan:
    name: ${{ matrix.component == 'release' && 'deploy release' || format('plan and build {0}', matrix.component) }} ${{ inputs.stage }}
    permissions:
      contents: read
      id-token: write
      packages: read
    needs: [resolve]
    if: ${{ !cancelled() && !failure() && (github.ref == 'refs/heads/main' || inputs.stage == 'dev' || inputs.stage == 'stage') }}
    environment: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        component: ${{ fromJSON(needs.resolve.outputs.prepare_components) }}
    concurrency:
      group: ${{ matrix.component == 'runner' && 'runner-build' || 'mbuild-publish' }}-${{ inputs.stage }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-infra
        with:
          stages: ${{ inputs.stage }}
          stage-config: ${{ vars.BOXLITE_MSTAGE_BOXLITE_APP_CONFIG }}

      - name: Resolve the stage
        id: config
        working-directory: apps/infra
        run: |
          set -Eeuo pipefail
          output="$(npm run --silent mbuild inspect -- --stage "${{ inputs.stage }}")"
          echo "$output" >> "$GITHUB_OUTPUT"

      - name: Federate an AWS identity
        if: steps.config.outputs.kind == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PULUMI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.config.outputs.region }}
          role-session-name: mdeploy-all-plan-${{ github.run_id }}

      - name: Federate a GCP identity
        if: steps.config.outputs.kind == 'artifact-registry'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}

      - name: Install gcloud
        if: steps.config.outputs.kind == 'artifact-registry'
        uses: google-github-actions/setup-gcloud@v2

      # Two answers, and every input to them is a read. The runner's answer is
      # shorter than it used to be: on the release path there is nothing to
      # decide, because the binary is an asset on the Release and the stack
      # downloads it at boot rather than this run staging it anywhere.
      - name: Decide
        id: plan
        working-directory: apps/infra
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          LINE: ${{ needs.resolve.outputs.line }}
          STAGE: ${{ inputs.stage }}
          COMPONENTS: ${{ matrix.component == 'release' && inputs.components || matrix.component }}
          GHCR_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          api=skip
          runner=skip

          case "$COMPONENTS" in
            *api*)
              held=0
              if [ -n "$VERSION" ]; then
                npm run --silent mbuild verify -- --tag "$SHA" --ghcr "$GHCR_REPOSITORY" --version "$VERSION" || held=$?
                if [ "$held" -eq 66 ]; then
                  echo "::error title=missing release::GHCR is missing images for $IMAGE_TAG. Run manually: gh workflow run mbuild-release.yml --repo $GITHUB_REPOSITORY --ref main -f command=publish -f tag=$VERSION"
                  exit 1
                elif [ "$held" -ne 0 ]; then
                  echo "::error title=registry::could not read GHCR images for $IMAGE_TAG; mbuild verify exited $held"
                  exit 1
                fi
                api=release-import
              else
                npm run --silent mbuild verify -- --tag "$IMAGE_TAG" --stage "$STAGE" || held=$?
                if [ "$held" -eq 0 ]; then
                  echo "$STAGE already holds the images for $IMAGE_TAG"
                elif [ "$held" -ne 66 ]; then
                  echo "::error title=registry::could not tell whether $STAGE holds the images for $IMAGE_TAG; mbuild verify exited $held"
                  exit 1
                else
                  api=build
                fi
              fi
              ;;
          esac

          case "$COMPONENTS" in
            *runner*)
              if [ -n "$VERSION" ]; then
                # Nothing to do here. `stack/runner-binary.ts` addresses the
                # GitHub Release asset directly, and `resolve` already proved it
                # is attached.
                echo "$VERSION installs the runner tarball from its GitHub Release"
              else
                # `--check` reads the same answer the build itself would, without
                # the checkout and the compile behind it. `--tag "$SHA"` because
                # this job checks out the branch tip and the deploy installs the
                # commit `resolve` named.
                staged="$(npm run --silent runner:build -- --stage "$STAGE" --check --tag "$SHA" | sed -n 's/^staged=//p')"
                if [ "$staged" = 'complete' ]; then
                  echo "$STAGE already holds a runner binary for $SHA"
                else
                  runner=build
                fi
              fi
              ;;
          esac

          printf 'api=%s\n' "$api" >> "$GITHUB_OUTPUT"
          printf 'runner=%s\n' "$runner" >> "$GITHUB_OUTPUT"
          # Written before the jobs it decides, so the reviewer holding this
          # stage's approval reads what is about to run rather than inferring
          # it from four job names.
          {
            echo "### plan $STAGE · $LINE"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| resolved | \`$LINE\` |"
            echo "| images | \`$IMAGE_TAG\` → \`$api\` |"
            echo "| runner | \`$runner\` |"
            echo "| components | \`$COMPONENTS\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and upload missing images
        if: steps.plan.outputs.api == 'build'
        uses: ./.github/actions/mbuild
        with:
          stage-config: ${{ vars.BOXLITE_MSTAGE_BOXLITE_APP_CONFIG }}
          aws-pulumi-deploy-role-arn: ${{ vars.AWS_PULUMI_DEPLOY_ROLE_ARN }}
          gcp-workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-image-publisher: ${{ vars.GCP_IMAGE_PUBLISHER }}
          command: publish
          tag: ${{ needs.resolve.outputs.sha }}
          stage: ${{ inputs.stage }}

      - name: Build and upload the missing Runner
        if: steps.plan.outputs.runner == 'build'
        uses: ./.github/actions/build-staged-runner
        with:
          stage-config: ${{ vars.BOXLITE_MSTAGE_BOXLITE_APP_CONFIG }}
          aws-pulumi-deploy-role-arn: ${{ vars.AWS_PULUMI_DEPLOY_ROLE_ARN }}
          gcp-workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-deployer: ${{ vars.GCP_DEPLOYER }}
          stage: ${{ inputs.stage }}
          sha: ${{ needs.resolve.outputs.sha }}

      - name: Deploy the released version
        if: needs.resolve.outputs.version != ''
        uses: ./.github/actions/mdeploy
        with:
          stage-config: ${{ vars.BOXLITE_MSTAGE_BOXLITE_APP_CONFIG }}
          aws-pulumi-deploy-role-arn: ${{ vars.AWS_PULUMI_DEPLOY_ROLE_ARN }}
          gcp-workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-deployer: ${{ vars.GCP_DEPLOYER }}
          gcp-image-publisher: ${{ vars.GCP_IMAGE_PUBLISHER }}
          ref: ${{ inputs.ref }}
          stage: ${{ inputs.stage }}
          sha: ${{ needs.resolve.outputs.sha }}
          version: ${{ needs.resolve.outputs.version }}
          image-tag: ${{ needs.resolve.outputs.image_tag }}
          line: ${{ needs.resolve.outputs.line }}
          components: ${{ inputs.components }}
          api-route: ${{ steps.plan.outputs.api }}
          apply: ${{ inputs.apply }}
          confirm: ${{ inputs.confirm }}

  deploy:
    name: ${{ inputs.apply && 'deploy' || 'preview' }} ${{ inputs.stage }}
    permissions:
      contents: read
      id-token: write
      packages: read
    needs: [resolve, plan]
    if: >-
      ${{ !cancelled() && !failure() && needs.plan.result == 'success' && needs.resolve.outputs.version == ''
      && (github.ref == 'refs/heads/main' || inputs.stage == 'dev' || inputs.stage == 'stage') }}
    environment: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/mdeploy
        with:
          stage-config: ${{ vars.BOXLITE_MSTAGE_BOXLITE_APP_CONFIG }}
          aws-pulumi-deploy-role-arn: ${{ vars.AWS_PULUMI_DEPLOY_ROLE_ARN }}
          gcp-workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-deployer: ${{ vars.GCP_DEPLOYER }}
          gcp-image-publisher: ${{ vars.GCP_IMAGE_PUBLISHER }}
          ref: ${{ inputs.ref }}
          stage: ${{ inputs.stage }}
          sha: ${{ needs.resolve.outputs.sha }}
          version: ${{ needs.resolve.outputs.version }}
          image-tag: ${{ needs.resolve.outputs.image_tag }}
          line: ${{ needs.resolve.outputs.line }}
          components: ${{ inputs.components }}
          api-route: skip
          apply: ${{ inputs.apply }}
          confirm: ${{ inputs.confirm }}
