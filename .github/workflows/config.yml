# Release workflows need configuration before expanding their build matrix.
# PR workflows load the same action inside their existing changes job.
name: Config

on:
  workflow_call:
    outputs:
      # === Platform/Matrix Configuration ===
      platforms:
        description: 'JSON array of platform configurations (os and target)'
        value: ${{ jobs.config.outputs.platforms }}

      # === Version Configuration ===
      python-versions:
        description: 'JSON array of Python versions to test'
        value: ${{ jobs.config.outputs.python-versions }}
      node-versions:
        description: 'JSON array of Node.js versions to test'
        value: ${{ jobs.config.outputs.node-versions }}
      node-build-version:
        description: 'Node.js version for building'
        value: ${{ jobs.config.outputs.node-build-version }}
      go-version:
        description: 'Go version for building and testing'
        value: ${{ jobs.config.outputs.go-version }}
      rust-toolchain:
        description: 'Rust toolchain version'
        value: ${{ jobs.config.outputs.rust-toolchain }}

      # === Artifact Configuration ===
      artifact-retention-days:
        description: 'Number of days to retain artifacts'
        value: ${{ jobs.config.outputs.artifact-retention-days }}

jobs:
  config:
    name: Load configuration
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.config.outputs.platforms }}
      python-versions: ${{ steps.config.outputs.python-versions }}
      node-versions: ${{ steps.config.outputs.node-versions }}
      node-build-version: ${{ steps.config.outputs.node-build-version }}
      go-version: ${{ steps.config.outputs.go-version }}
      rust-toolchain: ${{ steps.config.outputs.rust-toolchain }}
      artifact-retention-days: ${{ steps.config.outputs.artifact-retention-days }}

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-config
        id: config
