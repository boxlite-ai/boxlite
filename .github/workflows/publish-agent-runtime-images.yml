name: Publish Agent Runtime Images

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'apps/daemon/**'
      - 'images/agent-runtime/**'
      - 'scripts/images/build-agent-runtime.sh'
      - '.github/workflows/publish-agent-runtime-images.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish, with or without leading v. Defaults to Cargo.toml version.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-agent-runtime-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish agent runtime images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/go.work

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          fi

          if ! echo "$version" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "Invalid version '$version'; expected MAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish images
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PUSH: '1'
          PLATFORMS: linux/amd64,linux/arm64
        run: bash scripts/images/build-agent-runtime.sh
