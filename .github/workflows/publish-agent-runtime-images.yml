name: Publish Agent Runtime Images

on:
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - 'apps/common-go/**'
      - 'apps/daemon/**'
      - 'apps/go.work'
      - 'apps/go.work.sum'
      - 'images/agent-runtime/VERSION'
      - 'images/agent-runtime/**'
      - 'scripts/images/build-agent-runtime.sh'
      - '.github/workflows/publish-agent-runtime-images.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish, with or without leading v. Defaults to images/agent-runtime/VERSION.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-agent-runtime-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish agent runtime images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: apps/go.work

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="$(tr -d '[:space:]' < images/agent-runtime/VERSION)"
          fi

          if ! echo "$version" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "Invalid version '$version'; expected MAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish images
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PUSH: '1'
          PLATFORMS: linux/amd64,linux/arm64
        run: bash scripts/images/build-agent-runtime.sh
