# Requirement: ./.github/actions/setup-rust and ./.github/actions/sccache should both be run before
# this. They are not nested here on purpose — sccache is job-scoped, not guest-scoped: the manylinux
# container step later in these same jobs mounts the sccache binary and reads the ACTIONS_* vars
# this action's siblings exported, so folding the setup in here would hide a job-wide prerequisite
# inside one of its several consumers.
#
# Callers keep `if: runner.os == 'Linux'` on the step — it is the caller's condition, not this
# action's, and a reader of the job should see it without opening this file.

name: Build guest rootfs
description: >-
  Builds the complete minimal guest rootfs on the host and stages it under .cache/<target>/release/,
  then reclaims the build tree.

  On the host and before the container, deliberately: manylinux (AlmaLinux/RHEL)
  has no musl packages in its repos and building musl-cross-make from source takes
  ~15 minutes, where the Ubuntu host has musl-tools via apt in ~30 seconds. The
  guest binaries are static musl binaries so they need none of the container's glibc
  compatibility, while the shim and libkrun do — they need glibc 2.28 — and must be
  built inside it.

  Only the finished rootfs is staged rather than the complete target directory,
  and the tree is removed afterwards to reclaim runner disk. Nothing needs the
  intermediates: every caller restores .cache/<target> and sets SKIP_GUEST_ROOTFS_BUILD=1
  inside its container, so the rootfs is never rebuilt there and no incremental
  compilation state has to survive. Four callers get that from
  ./.github/actions/run-in-manylinux's prologue; build-wheels.yml gets it from
  cibuildwheel instead (sdks/python/pyproject.toml, before-all and environment).
  sccache keeps its own compilation cache separately, so this costs nothing on the
  next run either.

inputs:
  show-sccache-stats:
    description: >-
      Print sccache statistics after the build. warm-caches.yml sets this because
      the numbers are its actual output; ordinary builds leave them out of the log.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SHOW_SCCACHE_STATS: ${{ inputs.show-sccache-stats }}
      run: |
        make setup:build guest

        if [ "$SHOW_SCCACHE_STATS" = 'true' ]; then
          sccache --show-stats
        fi

        GUEST_TARGET=$(scripts/util.sh --target)
        mkdir -p ".cache/$GUEST_TARGET/release"
        cp -a "target/$GUEST_TARGET/release/guest-rootfs" ".cache/$GUEST_TARGET/release/"

        rm -rf target ~/.rustup ~/.cargo
        mkdir -p target
