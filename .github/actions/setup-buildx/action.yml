name: Set up Docker Buildx
description: >-
  Prepares the multi-architecture image build: QEMU for cross-arch emulation, then
  Buildx, which multi-arch images require.

  The two travel together — neither box-images workflow wants one without the
  other — and both are pinned by commit SHA, so keeping them in one file is what
  makes the pins move together.

runs:
  using: composite
  steps:
    - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # Enable cross-arch build emulation.
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # Buildx is required for multi-arch images.
