# Requirement: ./.github/actions/sccache should be run after this, in any job that compiles.
# The two are deliberately separate — see that action's header for why.

name: Set up Rust
description: >-
  Installs the Rust toolchain a job compiles with. Cargo caching defaults to on;
  Linux distribution jobs disable it because they discard the host build tree
  and toolchain before compiling in a container. Other upstream defaults remain unchanged.

inputs:
  toolchain:
    description: >-
      Toolchain specification to install. Defaults to the same value config.yml
      publishes as its rust-toolchain output, so a job with no config dependency
      can say nothing rather than grow a needs: edge just to spell "stable".
    required: false
    default: stable
  components:
    description: >-
      Comma-separated rustup components to add, e.g. "rustfmt" or "clippy".
      Empty installs none — an absent input and an empty one reach the upstream
      action identically, so this is the same as omitting it.
    required: false
    default: ''
  cache:
    description: >-
      Restore and save Cargo's host registry and target directory. Disable when
      the job removes that state before building in a container; sccache is separate.
    required: false
    default: 'true'
  cache-workspaces:
    description: >-
      Cargo workspaces and their target directories, one workspace -> target
      pair per line. Native Go builds also compile the vendored libkrun workspace.
    required: false
    default: '. -> target'
  cache-workspace-crates:
    description: >-
      Retain workspace compilation outputs as well as dependencies. Cargo still
      checks source freshness and rebuilds commit-dependent code on every invocation.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        cache: ${{ inputs.cache }}
        cache-workspaces: ${{ inputs.cache-workspaces }}
        cache-workspace-crates: ${{ inputs.cache-workspace-crates }}
