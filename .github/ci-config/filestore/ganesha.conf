# nfs-ganesha stand-in for the filestore integration test. Verified against
# the longhornio/nfs-ganesha image (ganesha 3.3) in a Linux container; three
# gotchas are pinned here so a future edit does not rediscover them:
#
# - EXPORT.Protocols takes MAJOR versions in ganesha 3.3. Writing "4.1" makes
#   the whole export fail to load and mounts answer "No such file or
#   directory"; NFSv4.1 is negotiated within major version 4.
# - NFS_CORE_PARAM has no "Transports" parameter on this version (warning:
#   unknown parameter) — it is dropped rather than carried as dead weight.
# - NFSV4.Graceless skips the ~90s grace period that would otherwise block
#   the test's first write right after the server starts.

NFS_CORE_PARAM {
    NFS_Protocols = 4;
}
NFSV4 { Graceless = true; }

EXPORT {
    Export_Id = 77;
    Path = /export;
    Pseudo = /export;
    Access_Type = RW;
    Disable_ACL = true;
    Squash = No_Root_Squash;
    Protocols = 4;
    FSAL {
        Name = VFS;
    }
}

EXPORT_DEFAULTS {
    SecType = sys;
}
