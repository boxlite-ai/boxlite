[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static", "-C", "link-arg=-no-pie", "-C", "link-arg=-Wl,-z,stack-size=2097152"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static", "-C", "link-arg=-no-pie", "-C", "link-arg=-Wl,-z,stack-size=2097152"]
