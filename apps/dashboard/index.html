<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxLite</title>
    <link rel="preload" href="/fonts/InterVariable-4.001.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/CommitMono-1.143.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Pre-paint theme to avoid a flash. Mirrors ThemeContext (key 'boxlite-theme',
      // default dark to match the design's out-of-box appearance).
      try {
        var t = localStorage.getItem('boxlite-theme') || 'dark'
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
