<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Strip the short-lived consent challenge before analytics or external assets load.
      if (window.location.pathname === '/mcp/consent') {
        var policy = document.createElement('meta')
        policy.name = 'referrer'
        policy.content = 'no-referrer'
        document.head.appendChild(policy)
        try {
          var consentParams = new URLSearchParams(window.location.search)
          if (consentParams.has('challenge') && consentParams.has('state')) {
            sessionStorage.setItem(
              'boxlite-mcp-consent',
              JSON.stringify({
                challenge: consentParams.get('challenge'),
                state: consentParams.get('state'),
                received: Date.now(),
              }),
            )
          }
        } finally {
          window.history.replaceState({}, '', '/mcp/consent')
        }
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxLite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Pre-paint theme to avoid a flash. Mirrors ThemeContext (key 'boxlite-theme',
      // default dark to match the design's out-of-box appearance).
      try {
        var t = localStorage.getItem('boxlite-theme') || 'dark'
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
