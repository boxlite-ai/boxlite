[package]
name = "boxlite-proxy"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "BoxLite preview proxy: routes <port>-<boxId>.<domain> to a port inside a box"
publish = false

# Standalone workspace: apps/ ships independently of the root Rust workspace.
[workspace]

[lib]
name = "boxlite_proxy"
path = "src/lib.rs"

[[bin]]
name = "boxlite-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "signal",
    "sync",
] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server",
    "client",
    "client-legacy",
    "http1",
] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "ring",
    "native-tokio",
    "tls12",
    "logging",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
http = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
] }
redis = { version = "1", features = [
    "tokio-comp",
    "tokio-rustls-comp",
    "connection-manager",
] }
moka = { version = "0.12", features = ["future"] }
cookie = { version = "0.18", features = ["percent-encode"] }

dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "logs",
    "http-proto",
    # Blocking client, not the async one: opentelemetry_sdk 0.32 runs batch
    # processors on dedicated OS threads with no Tokio reactor, and the async
    # reqwest exporter panics there. The blocking client carries its own.
    "reqwest-blocking-client",
] }
# opentelemetry-otlp 0.32 depends on reqwest 0.13 with default features off, so
# its HTTP client ships with no TLS and an https:// collector fails at connect.
# This entry exists only to turn TLS on for that copy: 0.13 is a different crate
# from the 0.12 the rest of this code uses, so features do not unify between
# them. "no-provider" reuses the ring provider installed at startup rather than
# pulling in aws-lc-rs, which reqwest's own "rustls" feature would do.
#
# telemetry.rs hands the exporters a client built from this entry, so the two
# majors are a compile-time constraint: if opentelemetry-otlp moves to a major
# this no longer unifies with, the build fails rather than silently losing TLS.
# tests/otlp_tls.rs additionally catches the features being dropped.
otlp-tls = { package = "reqwest", version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "blocking",
] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry-appender-tracing = "0.32"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
