[package]
name = "boxlite-proxy"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "BoxLite preview proxy: routes <port>-<boxId>.<domain> to a port inside a box"
publish = false

# Standalone workspace: apps/ ships independently of the root Rust workspace.
[workspace]

[lib]
name = "boxlite_proxy"
path = "src/lib.rs"

[[bin]]
name = "boxlite-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "signal",
    "sync",
] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server",
    "client",
    "client-legacy",
    "http1",
] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "ring",
    "native-tokio",
    "tls12",
    "logging",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
http = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
] }
redis = { version = "1", features = [
    "tokio-comp",
    "tokio-rustls-comp",
    "connection-manager",
] }
moka = { version = "0.12", features = ["future"] }
cookie = { version = "0.18", features = ["percent-encode"] }

dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
