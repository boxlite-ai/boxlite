name: ${COMPOSE_PROJECT_NAME:-boxlite-e2e}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?}
    environment:
      POSTGRES_USER: boxlite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: boxlite_e2e
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-35432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boxlite -d boxlite_e2e"]
      interval: 2s
      timeout: 3s
      retries: 60

  redis:
    image: ${REDIS_IMAGE:?}
    ports:
      - "127.0.0.1:${REDIS_PORT:-36379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 60

  registry:
    image: ${REGISTRY_IMAGE:?}
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-35000}:5000"
    volumes:
      - registry:/var/lib/registry

  rauthy:
    image: ${RAUTHY_IMAGE:?}
    command: ["serve", "--config-file", "/rauthy/config.toml"]
    environment:
      PUB_URL: localhost:${RAUTHY_PORT:-35556}
      RP_ORIGIN: http://localhost:${RAUTHY_PORT:-35556}
      ENC_KEYS: ${RAUTHY_ENC_KEYS:?}
      ENC_KEY_ACTIVE: local
      HQL_SECRET_RAFT: ${RAUTHY_SECRET:?}
      HQL_SECRET_API: ${RAUTHY_SECRET:?}
    ports:
      - "127.0.0.1:${RAUTHY_PORT:-35556}:8080"
    volumes:
      - ${RAUTHY_CONFIG_DIR:?}:/rauthy:ro

  rustfs:
    image: ${RUSTFS_IMAGE:?}
    command: ["/data"]
    user: "0:0"
    environment:
      RUSTFS_ACCESS_KEY: e2eadmin
      RUSTFS_SECRET_KEY: ${RUSTFS_PASSWORD:?}
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-39000}:9000"
    volumes:
      - rustfs:/data

volumes:
  postgres:
  registry:
  rustfs:
