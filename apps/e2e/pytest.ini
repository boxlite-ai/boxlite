[pytest]
testpaths = cases
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
# One line per marker: pytest reads `markers` as a newline linelist, so a
# wrapped description would register its continuation lines as marker names.
markers =
    e2e: tests that hit the full SDK→API→Runner→VM path
    smoke: safe against a paying stage — one box at a time, no quota probing, no deliberate error storms; selected by the prod leg of .github/workflows/e2e-cloud.yml
