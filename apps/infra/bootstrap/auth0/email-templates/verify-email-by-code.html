<!DOCTYPE html>
<html lang="en">
  <head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
    <title>{{ code | escape }} is your BoxLite code</title>
  </head>
  <body>
    <p>Your BoxLite verification code is {{ code | escape }}</p>
    <p style="font-family:'Commit Mono',SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:40px;line-height:48px;font-weight:600;letter-spacing:0.15em;margin:8px 0 16px 0">{{ code | escape }}</p>
    <p>Enter this code in the browser where you started signing up.<br />It expires in 5 minutes.</p>
    <p>Didn&#x27;t request it? Ignore this email.</p>
    <p>&mdash; BoxLite</p>
  </body>
</html>
