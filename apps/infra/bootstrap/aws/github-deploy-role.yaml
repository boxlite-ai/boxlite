AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC role for BoxLite SST deployments

Parameters:
  GitHubRepository:
    Type: String
    Default: boxlite-ai/boxlite
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
  GitHubEnvironment:
    Type: String
    Default: dev
    MinLength: 1
    MaxLength: 32
    AllowedPattern: '^[a-z0-9][a-z0-9-]*$'

Resources:
  # Artifact stores belong to the stage's deployment bootstrap, not to the SST stack that
  # consumes them. CI has to push an API image or Runner tarball *before* a release/build deploy
  # starts, so making the deploy create its own input would be circular on a fresh stage.
  ApiImagesRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # <app>-<workload>-<stage>-<name>, the grammar awsResourceName composes.
      # This side declares the name; apiImageRepository resolves it. Both are pinned by tests.
      RepositoryName: !Sub boxlite-app-${GitHubEnvironment}-api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  RunnerArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Same grammar; the account id is the attribute S3's global namespace requires.
      BucketName: !Sub boxlite-app-${GitHubEnvironment}-artifacts-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Superseded versions only. buildRunnerUserData re-fetches the tarball and its checksum
          # on EVERY instance launch under `set -euo pipefail`, and the launch template keeps the
          # commit-keyed URL, so expiring current objects would make any replacement after the
          # window fail to boot — including for the stage that is currently deployed. A lifecycle
          # rule cannot tell which key is live, so it must not delete live ones.
          #
          # Two consequences, both deliberate. Staged builds accumulate: roughly 30MB per deployed
          # commit, to be pruned by hand when a stage is retired. And because staging is write-once
          # on both paths, a noncurrent version only appears if someone deletes and re-uploads a
          # key, so this rule is a backstop for that case rather than routine garbage collection.
          - Id: expire-superseded-runner-builds
            Prefix: runner/
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  BoxLiteRuntimePermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub boxlite-${GitHubEnvironment}-runtime-boundary
      Description: Maximum data-plane permissions for roles created by the BoxLite SST stack
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RuntimeAccountWideControlChannels
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
              - logs:FilterLogEvents
              - logs:PutLogEvents
              - ssm:DescribeAssociation
              - ssm:GetDeployablePatchSnapshotForInstance
              - ssm:GetDocument
              - ssm:GetManifest
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:ListAssociations
              - ssm:ListInstanceAssociations
              - ssm:PutComplianceItems
              - ssm:PutConfigurePackageResult
              - ssm:PutInventory
              - ssm:UpdateAssociationStatus
              - ssm:UpdateInstanceAssociationStatus
              - ssm:UpdateInstanceInformation
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
              - ec2messages:AcknowledgeMessage
              - ec2messages:DeleteMessage
              - ec2messages:FailMessage
              - ec2messages:GetEndpoint
              - ec2messages:GetMessages
              - ec2messages:SendReply
            Resource: '*'
          - Sid: BoxLiteStageSecrets
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:boxlite-${GitHubEnvironment}-*
          - Sid: BoxLiteStageKmsKeys
            Effect: Allow
            Action: kms:Decrypt
            Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
            Condition:
              ForAnyValue:StringLike:
                kms:ResourceAliases: !Sub alias/boxlite-${GitHubEnvironment}-*
          - Sid: BoxLiteBuckets
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:GetBucketLocation
              - s3:ListBucket
              - s3:ListBucketVersions
              - s3:PutBucketTagging
            Resource:
              # Both the legacy boxlite-<stage>-* shape and the boxlite-app-<stage>-* grammar
              # awsResourceName composes. The boundary intersects with every identity
              # policy, so a bucket outside these prefixes is denied no matter what SST grants —
              # which is how a rename escapes the boundary silently.
              - !Sub arn:${AWS::Partition}:s3:::boxlite-${GitHubEnvironment}-*
              - !Sub arn:${AWS::Partition}:s3:::boxlite-app-${GitHubEnvironment}-*
              - !Sub arn:${AWS::Partition}:s3:::boxlite-volume-*
          - Sid: BoxLiteBucketObjects
            Effect: Allow
            Action:
              - s3:AbortMultipartUpload
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:GetObject
              - s3:PutObject
            Resource:
              # The Runner reads its own binary from boxlite-app-<stage>-artifacts-<acct>/runner/*
              # under the instance profile, at boot and on every SSM upgrade.
              - !Sub arn:${AWS::Partition}:s3:::boxlite-${GitHubEnvironment}-*/*
              - !Sub arn:${AWS::Partition}:s3:::boxlite-app-${GitHubEnvironment}-*/*
              - !Sub arn:${AWS::Partition}:s3:::boxlite-volume-*/*
          - Sid: PublicStatusHealthReads
            Effect: Allow
            Action:
              - tag:GetResources
              - ecs:DescribeServices
              - elasticloadbalancing:DescribeTargetHealth
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
              - cloudwatch:GetMetricData
            Resource: '*'
          - Sid: PublicStatusRunnerHeartbeat
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: '*'
            Condition:
              StringEquals:
                cloudwatch:namespace: BoxLite/PublicStatus
          - Sid: AssumeBoxLiteRuntimeRoles
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/boxlite-${GitHubEnvironment}-*

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub boxlite-${GitHubEnvironment}-github-deploy
      Description: Short-lived role used only by the guarded BoxLite GitHub deployment environment
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: boxlite-sst-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BoxLiteAwsControlPlane
                Effect: Allow
                Action:
                  - acm:*
                  - application-autoscaling:*
                  - autoscaling:*
                  - cloudfront:*
                  # Separate IAM service prefix, so `cloudfront:*` does not
                  # reach it — a wildcard never crosses the `service:` colon.
                  # sst.aws.Router keeps its route table in a CloudFront
                  # KeyValueStore, so every apply calls DescribeKeyValueStore
                  # and then the key writes. A preview never touches it, which
                  # is why `apply=false` passes without this.
                  - cloudfront-keyvaluestore:*
                  - cloudwatch:*
                  - ec2:*
                  - ecr:*
                  - ecs:*
                  - elasticache:*
                  - elasticloadbalancing:*
                  - kms:DescribeKey
                  - lambda:*
                  - logs:*
                  - rds:*
                  # The two secretsmanager calls that take no resource, so IAM cannot scope them.
                  # Everything else this service offers is stage-scoped — see SecretsForThisStage.
                  - secretsmanager:ListSecrets
                  - secretsmanager:GetRandomPassword
                  - servicediscovery:*
                  # s3, ssm and the rest of secretsmanager are deliberately absent. All three reach
                  # another stage's data: s3 and ssm through the SST backing store, which holds every
                  # stage's state and secrets under one bucket and one parameter tree — the live bucket
                  # carries secret/boxlite/dev.json beside secret/boxlite/prod.json — and secretsmanager
                  # through secrets whose names carry the stage. Granted account-wide, a job bound to
                  # the dev Environment could read prod's. Scoped below instead.
                  - tag:GetResources
                  - tag:GetTagKeys
                  - tag:GetTagValues
                Resource: '*'
              # The stage's own secrets, and no other stage's — the same scope the runtime boundary
              # already admits. Two things have to hold for that to cover what the stack creates, and
              # both were checked rather than assumed (.sst/platform/src/components/component.ts):
              # a secret is stage-prefixed only if it is in SST's namingRules (:295, it is) AND is a
              # component's child, because the renaming transform is registered in the Component
              # constructor. DatabaseProxySecret and CacheProxySecret qualify on both counts — they
              # are children of sst.aws.Postgres/Redis, and live as boxlite-dev-DatabaseProxySecret-*.
              # GhcrPullToken (stack/runners.ts) is declared at stack root, so it would autoname out
              # of this pattern; it carries an explicit name for exactly that reason.
              - Sid: SecretsForThisStage
                Effect: Allow
                Action: secretsmanager:*
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:boxlite-${GitHubEnvironment}-*
              # The SST backing store, scoped to this stage. Every prefix SST writes is
              # `<kind>/<app>/<stage>`; the five that exist in the live bucket were read from it, and
              # lock/ and summary/ came from sst v4.6.11 pkg/project/provider/provider.go because a
              # lock exists only while an update runs — `list-objects` cannot see one, and a policy
              # built from a listing fails at the moment a deploy takes its lock.
              - Sid: SstStateForThisStage
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetBucketLocation
                Resource:
                  # Bucket scope, because SST enumerates before it reads. That reveals other stages'
                  # key NAMES but not their contents; the object grants below are per stage.
                  - !Sub arn:${AWS::Partition}:s3:::sst-state-*
                  - !Sub arn:${AWS::Partition}:s3:::sst-asset-*
              - Sid: SstStateObjectsForThisStage
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::sst-state-*/app/boxlite/${GitHubEnvironment}.json
                  - !Sub arn:${AWS::Partition}:s3:::sst-state-*/secret/boxlite/${GitHubEnvironment}.json
                  - !Sub arn:${AWS::Partition}:s3:::sst-state-*/eventlog/boxlite/${GitHubEnvironment}/*
                  - !Sub arn:${AWS::Partition}:s3:::sst-state-*/snapshot/boxlite/${GitHubEnvironment}/*
                  - !Sub arn:${AWS::Partition}:s3:::sst-state-*/update/boxlite/${GitHubEnvironment}/*
                  - !Sub arn:${AWS::Partition}:s3:::sst-state-*/lock/boxlite/${GitHubEnvironment}
                  - !Sub arn:${AWS::Partition}:s3:::sst-state-*/lock/boxlite/${GitHubEnvironment}.json
                  - !Sub arn:${AWS::Partition}:s3:::sst-state-*/summary/boxlite/${GitHubEnvironment}/*
                  # Deployment assets are content-addressed and carry no stage in the key, so this is
                  # the one object grant that is NOT stage-scoped and cannot be: SST derives the key
                  # from the content hash and every stage writes into the same bucket. A write is
                  # therefore idempotent — same bytes, same key — but a DELETE is not bounded that way,
                  # so a stage could remove an object another stage's next update expects to find. It
                  # stays because `sst remove` needs it; the blast radius is a redeploy, since assets
                  # are rebuilt from the checkout rather than recovered from the bucket.
                  - !Sub arn:${AWS::Partition}:s3:::sst-asset-*/*
              # `sst secret set --fallback` stores under the literal stage `_fallback`, which every
              # stage of the app reads. It cannot be stage-scoped, so it gets READ access only: a
              # deploy consumes a fallback, setting one is a deliberate operator action.
              - Sid: SstFallbackSecretsRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::sst-state-*/secret/boxlite/_fallback.json
              # The buckets this stack owns. Same prefixes the runtime boundary allows, so a rename has
              # to widen both together — see awsResourceName in deployment/environment.ts.
              #
              # Four of the six prefixes are stage-scoped and two are not: boxlite-volume-* carries no
              # stage in its name, so this grants s3:* over every stage's volume buckets, not just this
              # one. That is the naming, not an oversight here — the runtime boundary allows the same
              # unscoped prefix — but it means "the buckets this stack owns" is true only of the
              # boxlite-<stage>-* and boxlite-app-<stage>-* pairs. Scoping it needs the bucket name to
              # carry the stage first, which is a rename across the boundary, the stack, and buckets
              # that already exist.
              - Sid: BoxLiteStageBuckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::boxlite-${GitHubEnvironment}-*
                  - !Sub arn:${AWS::Partition}:s3:::boxlite-${GitHubEnvironment}-*/*
                  - !Sub arn:${AWS::Partition}:s3:::boxlite-app-${GitHubEnvironment}-*
                  - !Sub arn:${AWS::Partition}:s3:::boxlite-app-${GitHubEnvironment}-*/*
                  - !Sub arn:${AWS::Partition}:s3:::boxlite-volume-*
                  - !Sub arn:${AWS::Partition}:s3:::boxlite-volume-*/*
              # /sst/bootstrap is account-wide by construction: it names the buckets every stage shares
              # and SST reads it before it knows which stage it is running. That makes it the one
              # parameter here a stage must not be able to WRITE — rewriting it repoints every other
              # stage's state, deleting it breaks them all — so it gets a read-only statement of its
              # own. Creating it is a bootstrap action, done by an operator with admin credentials
              # before CI ever deploys.
              - Sid: SstSharedBootstrapRead
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sst/bootstrap
              # The passphrase decrypts this stage's state, so that is the one that must not be shared.
              - Sid: SstParametersForThisStage
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                  - ssm:ListTagsForResource
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sst/passphrase/boxlite/${GitHubEnvironment}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/boxlite/${GitHubEnvironment}/*
              - Sid: SstFallbackPassphraseRead
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sst/passphrase/boxlite/_fallback
              # Outbound mail (stack/mail.ts): the SES domain identity and its configuration set,
              # over the create/read/update/delete calls the two sesv2 resources make. The
              # configuration set is stage-scoped because stack/mail.ts names it boxlite-<stage>-mail
              # rather than letting Pulumi autoname it. The identity cannot be: its ARN carries the
              # sender domain and nothing else, so scoping it would mean teaching this template the
              # stage's MAIL_DOMAIN. Recorded in docs/security.md instead.
              #
              # `ses:*` is deliberately NOT in BoxLiteAwsControlPlane above: that wildcard would carry
              # SendEmail and SendRawEmail for every identity in the account, letting a deploy job send
              # mail as the product. Sending is not the deploy's job — it belongs to the send-only IAM
              # user bootstrap provisions, whose policy is pinned to one From address.
              - Sid: BoxLiteMailIdentity
                Effect: Allow
                Action:
                  - ses:CreateEmailIdentity
                  - ses:DeleteEmailIdentity
                  - ses:GetEmailIdentity
                  - ses:PutEmailIdentityConfigurationSetAttributes
                  - ses:PutEmailIdentityDkimSigningAttributes
                  - ses:CreateConfigurationSet
                  - ses:DeleteConfigurationSet
                  - ses:GetConfigurationSet
                  - ses:PutConfigurationSetDeliveryOptions
                  - ses:PutConfigurationSetReputationOptions
                  - ses:PutConfigurationSetSendingOptions
                  - ses:PutConfigurationSetSuppressionOptions
                  - ses:PutConfigurationSetTrackingOptions
                  - ses:PutConfigurationSetVdmOptions
                  - ses:ListTagsForResource
                  - ses:TagResource
                  - ses:UntagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/boxlite-${GitHubEnvironment}-*
              # The deploy blocks until SES reports the domain verified, and that poll runs on the
              # classic API, whose verification read takes no resource ARN.
              - Sid: ReadMailIdentityVerification
                Effect: Allow
                Action:
                  - ses:GetIdentityVerificationAttributes
                Resource: '*'
              # Runner binary upgrades run as SSM commands against the stage's instances
              # (runner/update.ts). SendCommand takes instance and document ARNs; the describe and
              # invocation reads are list-shaped and have no resource of their own.
              #
              # instance/* is account-wide, and unscoped only because there is no way to scope it here:
              # an instance ARN carries no stage, so narrowing this means a Condition on an instance tag
              # the stack sets — a change to what the Runner launch template tags, verifiable only
              # against real instances. Until then this is the widest grant the deploy role holds: a job
              # bound to one stage can run a shell command on any instance in the account, which is more
              # than reading another stage's configuration. Stated in docs/security.md rather than left
              # to read as stage-scoped.
              - Sid: RunnerCommandChannel
                Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Sid: RunnerCommandStatus
                Effect: Allow
                Action:
                  - ssm:DescribeInstanceInformation
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:ListCommands
                  - ssm:DescribeParameters
                Resource: '*'
              - Sid: ReadIamAndAccountMetadata
                Effect: Allow
                Action:
                  - iam:GetInstanceProfile
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListPolicyVersions
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - sts:GetCallerIdentity
                Resource: '*'
              - Sid: CreateBoundedBoxLiteRoles
                Effect: Allow
                Action: iam:CreateRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/boxlite-${GitHubEnvironment}-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref BoxLiteRuntimePermissionsBoundary
              # Two escalation paths, both closed the same way, because an IAM Allow cannot express
              # "every boxlite-<stage>-* resource except this one" — only a Deny can.
              #
              # First: this role is itself named boxlite-<stage>-github-deploy, so it matches the
              # role/boxlite-${GitHubEnvironment}-* resource of the IAM grants below — narrowing those
              # to this stage does not exclude this role, it is this stage's. iam:PutRolePolicy aimed at itself
              # writes it any permission at all, with nothing to stop it — the runtime boundary
              # constrains the roles SST creates, not this role's own inline policy.
              #
              # Second, and less obvious: the boundary IS a managed policy named
              # boxlite-<stage>-runtime-boundary, which matches the policy/boxlite-${GitHubEnvironment}-*
              # resource of ManageBoxLitePolicies. Widening it, then creating a bounded role under the widened
              # version and passing it to a service, reaches anything the widened boundary allows. So
              # the boundary policy is denied mutation too.
              #
              # Neither is something a deploy does: both this role and the boundary are created by
              # `cloudformation deploy` under an operator's admin credentials, never by SST.
              - Sid: DenySelfPrivilegeEscalation
                Effect: Deny
                Action:
                  - iam:AttachRolePolicy
                  - iam:DeleteRole
                  - iam:DeleteRolePermissionsBoundary
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePermissionsBoundary
                  - iam:PutRolePolicy
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicy
                  - iam:DeletePolicyVersion
                  - iam:SetDefaultPolicyVersion
                Resource:
                  # Every stage's, not just this one's. The Allows above are now scoped to this
                  # stage, but this Deny deliberately is not: it is the backstop if one ever widens
                  # again, and a dev-bound job must never rewrite prod's trust policy and assume it.
                  # No deploy ever modifies one of these — they are CloudFormation resources an
                  # operator creates — so denying all of them costs nothing.
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/boxlite-*-github-deploy
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/boxlite-*-runtime-boundary
              - Sid: ManageBoxLiteRoles
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:TagRole
                  - iam:UntagInstanceProfile
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/boxlite-${GitHubEnvironment}-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/boxlite-${GitHubEnvironment}-*
              - Sid: SetBoxLiteRoleBoundary
                Effect: Allow
                Action: iam:PutRolePermissionsBoundary
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/boxlite-${GitHubEnvironment}-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref BoxLiteRuntimePermissionsBoundary
              - Sid: ManageBoxLitePolicies
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicy
                  - iam:DeletePolicyVersion
                  - iam:SetDefaultPolicyVersion
                  - iam:TagPolicy
                  - iam:UntagPolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/boxlite-${GitHubEnvironment}-*
              - Sid: CreateRequiredServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub arn:${AWS::Partition}:iam::*:role/aws-service-role/*
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - autoscaling.amazonaws.com
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - rds.amazonaws.com

Outputs:
  RoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  RuntimePermissionsBoundaryArn:
    Value: !Ref BoxLiteRuntimePermissionsBoundary
  ApiImagesRepositoryUri:
    Value: !GetAtt ApiImagesRepository.RepositoryUri
  RunnerArtifactsBucketName:
    Value: !Ref RunnerArtifactsBucket
