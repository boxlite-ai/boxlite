AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC role for BoxLite SST deployments

Parameters:
  GitHubRepository:
    Type: String
    Default: boxlite-ai/boxlite
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
  GitHubEnvironment:
    Type: String
    Default: dev
    MinLength: 1
    MaxLength: 20
    AllowedPattern: '^[a-z0-9]{1,20}$'
  RunnerCommandTagGateEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  RuntimeSecretInitializationEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

Conditions:
  RunnerCommandTagGateIsEnabled:
    Fn::Equals:
      - Ref: RunnerCommandTagGateEnabled
      - 'true'
  RuntimeSecretInitializationIsEnabled:
    Fn::Equals:
      - Ref: RuntimeSecretInitializationEnabled
      - 'true'

Resources:
  # Artifact stores belong to the stage's deployment bootstrap, not to the SST stack that
  # consumes them. CI has to push an API image or Runner tarball *before* a release/build deploy
  # starts, so making the deploy create its own input would be circular on a fresh stage.
  ApiImagesRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # <namespace>-<workload>-<stage>-<name>, the grammar scripts/resource-name.mjs composes.
      # This side declares the name; apiImageRepository resolves it. Both are pinned by tests.
      RepositoryName: !Sub boxlite-app-${GitHubEnvironment}-api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  RunnerArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Same grammar; the account id is the attribute S3's global namespace requires.
      BucketName: !Sub boxlite-app-${GitHubEnvironment}-artifacts-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Superseded versions only. buildRunnerUserData re-fetches the tarball and its checksum
          # on EVERY instance launch under `set -euo pipefail`, and the launch template keeps the
          # commit-keyed URL, so expiring current objects would make any replacement after the
          # window fail to boot — including for the stage that is currently deployed. A lifecycle
          # rule cannot tell which key is live, so it must not delete live ones.
          #
          # Two consequences, both deliberate. Staged builds accumulate: roughly 30MB per deployed
          # commit, to be pruned by hand when a stage is retired. And because staging is write-once
          # on both paths, a noncurrent version only appears if someone deletes and re-uploads a
          # key, so this rule is a backstop for that case rather than routine garbage collection.
          - Id: expire-superseded-runner-builds
            Prefix: runner/
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  BoxLiteRuntimePermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub boxlite-${GitHubEnvironment}-runtime-boundary
      Description: Maximum data-plane permissions for roles created by the BoxLite SST stack
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RuntimeAccountWideControlChannels
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
              - logs:FilterLogEvents
              - logs:PutLogEvents
              - ssm:DescribeAssociation
              - ssm:GetDeployablePatchSnapshotForInstance
              - ssm:GetDocument
              - ssm:GetManifest
              - ssm:ListAssociations
              - ssm:ListInstanceAssociations
              - ssm:PutComplianceItems
              - ssm:PutConfigurePackageResult
              - ssm:PutInventory
              - ssm:UpdateAssociationStatus
              - ssm:UpdateInstanceAssociationStatus
              - ssm:UpdateInstanceInformation
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
              - ec2messages:AcknowledgeMessage
              - ec2messages:DeleteMessage
              - ec2messages:FailMessage
              - ec2messages:GetEndpoint
              - ec2messages:GetMessages
              - ec2messages:SendReply
            Resource: '*'
          - Sid: BoxLiteStageSecrets
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:boxlite-${GitHubEnvironment}-*
          - Sid: BoxLiteStageKmsKeys
            Effect: Allow
            Action: kms:Decrypt
            Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
            Condition:
              ForAnyValue:StringLike:
                kms:ResourceAliases: !Sub alias/boxlite-${GitHubEnvironment}-*
          - Sid: BoxLiteBuckets
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:GetBucketLocation
              - s3:ListBucket
              - s3:ListBucketVersions
              - s3:PutBucketTagging
            Resource:
              # Both the legacy boxlite-<stage>-* shape and the boxlite-app-<stage>-* grammar
              # scripts/resource-name.mjs composes. The boundary intersects with every identity
              # policy, so a bucket outside these prefixes is denied no matter what SST grants —
              # which is how a rename escapes the boundary silently.
              - !Sub arn:${AWS::Partition}:s3:::boxlite-${GitHubEnvironment}-*
              - !Sub arn:${AWS::Partition}:s3:::boxlite-app-${GitHubEnvironment}-*
              - !Sub arn:${AWS::Partition}:s3:::boxlite-volume-*
          - Sid: BoxLiteBucketObjects
            Effect: Allow
            Action:
              - s3:AbortMultipartUpload
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:GetObject
              - s3:PutObject
            Resource:
              # The Runner reads its own binary from boxlite-app-<stage>-artifacts-<acct>/runner/*
              # under the instance profile, at boot and on every SSM upgrade.
              - !Sub arn:${AWS::Partition}:s3:::boxlite-${GitHubEnvironment}-*/*
              - !Sub arn:${AWS::Partition}:s3:::boxlite-app-${GitHubEnvironment}-*/*
              - !Sub arn:${AWS::Partition}:s3:::boxlite-volume-*/*
          - Sid: AssumeBoxLiteRuntimeRoles
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/boxlite-${GitHubEnvironment}-s3-access

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub boxlite-${GitHubEnvironment}-github-deploy
      Description: Short-lived role used only by the guarded BoxLite GitHub deployment environment
      MaxSessionDuration: 7200
      Tags:
        - Key: boxlite:deploy-policy-contract
          Value: v1
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: boxlite-sst-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BoxLiteAwsControlPlane
                Effect: Allow
                Action:
                  - acm:*
                  - application-autoscaling:*
                  - autoscaling:*
                  - cloudfront:*
                  # Separate IAM service prefix, so `cloudfront:*` does not
                  # reach it — a wildcard never crosses the `service:` colon.
                  # sst.aws.Router keeps its route table in a CloudFront
                  # KeyValueStore, so every apply calls DescribeKeyValueStore
                  # and then the key writes. A preview never touches it, which
                  # is why `apply=false` passes without this.
                  - cloudfront-keyvaluestore:*
                  - cloudwatch:*
                  - ec2:*
                  - ecr:*
                  - ecs:*
                  - elasticache:*
                  - elasticloadbalancing:*
                  - kms:DescribeKey
                  - lambda:*
                  - logs:*
                  - rds:*
                  - s3:*
                  - servicediscovery:*
                  - tag:GetResources
                  - tag:GetTagKeys
                  - tag:GetTagValues
                Resource: '*'
              # Parameter Store is intentionally absent from the broad control-plane grant. The
              # deploy identity may read only the selected stage's provider/config state, mutate
              # only its operation lock and names-only SST status markers, and use SSM commands
              # for Runner reconciliation. This deny also contains permissions added elsewhere.
              - Sid: DenyOtherParameterMutation
                Effect: Deny
                Action:
                  - ssm:AddTagsToResource
                  - ssm:DeleteParameter
                  - ssm:DeleteParameters
                  - ssm:LabelParameterVersion
                  - ssm:PutParameter
                  - ssm:RemoveTagsFromResource
                  - ssm:UnlabelParameterVersion
                NotResource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/boxlite/${GitHubEnvironment}/deployment-operation-lock
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/boxlite/${GitHubEnvironment}/sst-secret-status/*
              - Sid: DenyParameterResourcePolicyMutation
                Effect: Deny
                Action:
                  - ssm:DeleteResourcePolicy
                  - ssm:PutResourcePolicy
                Resource: '*'
              - Sid: ReadCloudflareProviderCredentials
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/boxlite/${GitHubEnvironment}/cloudflare-api-token
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/boxlite/${GitHubEnvironment}/cloudflare-account-id
              - Sid: UseBoxLiteSstSecretStatus
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/boxlite/${GitHubEnvironment}/sst-secret-status/*
              - Sid: UseRunnerCommandDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Fn::If:
                  - RunnerCommandTagGateIsEnabled
                  - Sid: SendSelectedStageRunnerCommand
                    Effect: Allow
                    Action: ssm:SendCommand
                    Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                    Condition:
                      StringEquals:
                        ssm:resourceTag/boxlite:stage: !Sub '${GitHubEnvironment}'
                        ssm:resourceTag/boxlite:ssm-role: runner
                  - Sid: SendLegacyRunnerCommand
                    Effect: Allow
                    Action: ssm:SendCommand
                    Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
              - Fn::If:
                  - RunnerCommandTagGateIsEnabled
                  - Sid: DenyRunnerCommandAuthorizationTagMutation
                    Effect: Deny
                    Action:
                      - ec2:CreateTags
                      - ec2:DeleteTags
                    Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                    Condition:
                      ForAnyValue:StringEqualsIgnoreCase:
                        aws:TagKeys:
                          - boxlite:stage
                          - boxlite:ssm-role
                      StringNotEqualsIfExists:
                        ec2:CreateAction: RunInstances
                  - Ref: AWS::NoValue
              - Sid: ReadSystemsManagerCommandResult
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
              # Bootstrap owns the stable runtime namespace. Routine deployments may read it,
              # and may install only a generated first version during the explicit expand gate.
              - Sid: ReadSelectedStageRuntimeSecrets
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:boxlite-${GitHubEnvironment}-runtime/*
              - Fn::If:
                  - RuntimeSecretInitializationIsEnabled
                  - Sid: InitializeGeneratedPendingRuntimeSecrets
                    Effect: Allow
                    Action: secretsmanager:PutSecretValue
                    Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:boxlite-${GitHubEnvironment}-runtime/*
                    Condition:
                      StringEquals:
                        secretsmanager:ResourceTag/boxlite:initial-value: generated
                        secretsmanager:ResourceTag/boxlite:initialization: pending
                  - Ref: AWS::NoValue
              - Fn::If:
                  - RuntimeSecretInitializationIsEnabled
                  - Ref: AWS::NoValue
                  - Sid: DenyRuntimeSecretInitialization
                    Effect: Deny
                    Action: secretsmanager:PutSecretValue
                    Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:boxlite-${GitHubEnvironment}-runtime/*
              - Sid: DenyRuntimeSecretLifecycleMutation
                Effect: Deny
                NotAction:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:boxlite-${GitHubEnvironment}-runtime/*
              # SST owns exactly these component-created stage secrets. Keep the lifecycle list
              # explicit so it cannot reach bootstrap-owned runtime containers or another stage.
              - Sid: ManageSelectedStageStackSecrets
                Effect: Allow
                Action:
                  - secretsmanager:CancelRotateSecret
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:GetSecretValue
                  - secretsmanager:ListSecretVersionIds
                  - secretsmanager:PutSecretValue
                  - secretsmanager:RestoreSecret
                  - secretsmanager:RotateSecret
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                  - secretsmanager:UpdateSecret
                  - secretsmanager:UpdateSecretVersionStage
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:boxlite-${GitHubEnvironment}-DatabaseProxySecret-*
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:boxlite-${GitHubEnvironment}-CacheProxySecret-*
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:boxlite-${GitHubEnvironment}-GhcrPullToken-*
              - Sid: DenyBoxLiteSecretResourcePolicyMutation
                Effect: Deny
                Action:
                  - secretsmanager:DeleteResourcePolicy
                  - secretsmanager:PutResourcePolicy
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:boxlite-*
              # Deployment configuration is published and activated only by the bootstrap/operator
              # identity. The deploy role resolves `current` once and subsequently reads one exact
              # immutable release. A different stage is not readable by this role.
              - Sid: ReadBoxLiteDeploymentConfig
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/boxlite/${GitHubEnvironment}/deploy-config/*
              # No deploy identity may publish, activate, tag, share, or delete any stage's
              # immutable configuration. NotAction keeps this closed when SSM adds new operations.
              - Sid: DenyBoxLiteDeploymentConfigMutation
                Effect: Deny
                NotAction: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/boxlite/*/deploy-config/*
              # Bootstrap, config activation, preview, and apply serialize on this one stage-scoped
              # parameter. It is deliberately outside deploy-config/* so the immutable-config deny
              # does not prevent the routine deploy role from acquiring and owner-safely releasing it.
              - Sid: UseBoxLiteDeploymentOperationLock
                Effect: Allow
                Action:
                  - ssm:DeleteParameter
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/boxlite/${GitHubEnvironment}/deployment-operation-lock
              - Sid: DenyOtherBoxLiteDeploymentOperationLockActions
                Effect: Deny
                NotAction:
                  - ssm:DeleteParameter
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/boxlite/${GitHubEnvironment}/deployment-operation-lock
              - Sid: ReadIamAndAccountMetadata
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - iam:GetInstanceProfile
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListPolicyVersions
                  - iam:ListRoles
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - sts:GetCallerIdentity
                Resource: '*'
              - Sid: CreateBoundedBoxLiteRoles
                Effect: Allow
                Action: iam:CreateRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/boxlite-${GitHubEnvironment}-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref BoxLiteRuntimePermissionsBoundary
              # This inline deny is self-protecting: PutRolePolicy/DeleteRolePolicy cannot replace
              # or remove it, and no stage deploy can mutate, pass, or re-bound any GitHub deploy
              # role. Read-only inspection remains available for bootstrap verification.
              - Sid: DenyGitHubDeployRoleMutation
                Effect: Deny
                NotAction:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/boxlite-*-github-deploy
              - Sid: ManageBoxLiteRoles
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:TagRole
                  - iam:UntagInstanceProfile
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/boxlite-${GitHubEnvironment}-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/boxlite-${GitHubEnvironment}-*
              - Sid: PassSelectedStageRuntimeRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/boxlite-${GitHubEnvironment}-*
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ec2.amazonaws.com
                      - ecs-tasks.amazonaws.com
              - Sid: SetBoxLiteRoleBoundary
                Effect: Allow
                Action: iam:PutRolePermissionsBoundary
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/boxlite-${GitHubEnvironment}-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref BoxLiteRuntimePermissionsBoundary
              # The deploy role can create and pass bounded helpers, so allowing it to rewrite the
              # boundary would turn that ceiling into an escalation path. Boundary changes remain
              # an operator/bootstrap action for every stage.
              - Sid: DenyRuntimeBoundaryMutation
                Effect: Deny
                NotAction:
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListEntitiesForPolicy
                  - iam:ListPolicyTags
                  - iam:ListPolicyVersions
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/boxlite-*-runtime-boundary
              - Sid: ManageBoxLitePolicies
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicy
                  - iam:DeletePolicyVersion
                  - iam:SetDefaultPolicyVersion
                  - iam:TagPolicy
                  - iam:UntagPolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/boxlite-${GitHubEnvironment}-*
              - Sid: CreateRequiredServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub arn:${AWS::Partition}:iam::*:role/aws-service-role/*
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - autoscaling.amazonaws.com
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - rds.amazonaws.com

Outputs:
  RoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  RuntimePermissionsBoundaryArn:
    Value: !Ref BoxLiteRuntimePermissionsBoundary
  ApiImagesRepositoryUri:
    Value: !GetAtt ApiImagesRepository.RepositoryUri
  RunnerArtifactsBucketName:
    Value: !Ref RunnerArtifactsBucket
