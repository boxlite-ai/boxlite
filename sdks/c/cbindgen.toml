# cbindgen configuration for boxlite-c
# See: https://github.com/mozilla/cbindgen/blob/master/docs.md

language = "C"
include_guard = "BOXLITE_H"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "c99"
sys_includes = ["sys/socket.h"]

# Style settings
style = "both"
usize_is_size_t = true

[parse]
parse_deps = false

# Keep these enums in the header even though the ABI carries them as int32_t
# (`CDomainTarget.type` and agent send mode):
# C callers use the enum constants with the integer fields and parameters, so
# the names must remain exported.
[export]
include = ["BoxliteDomainTargetType", "CAgentSendMode"]
exclude = ["sockaddr_storage", "boxlite_test_agents_new", "boxlite_test_agents_wait_pending", "boxlite_test_agents_wait_queue", "boxlite_test_agents_free_counts", "boxlite_test_agents_event_frees", "boxlite_test_agents_barrier", "boxlite_test_agents_install"]

[export.rename]
sockaddr_storage = "struct sockaddr_storage"
