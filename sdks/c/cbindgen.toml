# cbindgen configuration for boxlite-c
# See: https://github.com/mozilla/cbindgen/blob/master/docs.md

language = "C"
include_guard = "BOXLITE_H"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "c99"
sys_includes = ["sys/socket.h"]

# Style settings
style = "both"
usize_is_size_t = true

[parse]
parse_deps = false

# Keep the copy-in source-kind enum in the header even though the function
# parameter is an int32_t: C callers cast the enum constants to the integer
# the ABI expects, so the names must remain exported.
[export]
include = ["BoxliteCopySourceKind"]
exclude = ["sockaddr_storage"]

[export.rename]
sockaddr_storage = "struct sockaddr_storage"
