# cbindgen configuration for boxlite-c
# See: https://github.com/mozilla/cbindgen/blob/master/docs.md

language = "C"
include_guard = "BOXLITE_H"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "c99"

# Style settings
style = "both"
usize_is_size_t = true

[parse]
parse_deps = false

[export]
# Private bridge symbols the Go binding reaches through its own header
# (sdks/go/bridge.h). They exist because the Go SDK wraps the Rust core over
# the same cdylib, not because the C SDK offers the feature — keeping them out
# of include/boxlite.h is what stops them becoming public C API by accident.
exclude = [
  # SSH is a Hosted-API concern; the C SDK exposes no SSH surface.
  "boxlite_go_options_set_guest_ssh_trust",
]
