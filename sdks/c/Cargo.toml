[package]
name = "boxlite-c"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "C SDK for BoxLite"

[lib]
name = "boxlite"
crate-type = ["cdylib", "staticlib"]

[features]
default = []

[dependencies]
boxlite = { workspace = true, features = ["rest"] }
futures = "0.3"
tokio = { version = "1.37", features = ["io-util", "net", "rt", "rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
boxlite = { workspace = true, features = ["rest", "test-support"] }
# Server side of the loopback attach tests; the same release the REST client uses.
tungstenite = "0.24"

[build-dependencies]
cbindgen = "0.29"
