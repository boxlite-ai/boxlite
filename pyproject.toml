# Workspace-level Python tooling config.
#
# Not a Python package itself -- the SDK's package metadata lives at
# sdks/python/pyproject.toml. This file exists so pylint (invoked by the
# `lint:apps` -> `yarn lint:py` chain) picks up consistent settings when run
# from the repo root. Disable list mirrors upstream `daytonaio/daytona`.

[tool.pylint]
max-line-length = 120
disable = [
    "C0111",  # missing-docstring
    "R0903",  # too-few-public-methods
    "R0902",  # too-many-instance-attributes
    "W0702",  # no-exception-type-specified (bare-except)
    "W0719",  # broad-exception-raised
    "W0718",  # broad-exception-caught
    "R0913",  # too-many-arguments
    "R0917",  # too-many-positional-arguments
    "R0801",  # duplicate-code
    "R0911",  # too-many-return-statements
    "R0915",  # too-many-statements
    "R0914",  # too-many-locals
    "C0414",  # useless-import-alias
    "E1121",  # too-many-function-args
    "W1203",  # logging-fstring-interpolation
    "W1514",  # unspecified-encoding
    "W0640",  # cell-var-from-loop
    "R0912",  # too-many-branches
    "R1702",  # too-many-nested-blocks
    "R0916",  # too-many-boolean-expressions
    "C0302",  # too-many-lines
    "R0904",  # too-many-public-methods
    "E0402",  # relative-beyond-top-level
    "W0212",  # protected-access
]
const-rgx = "(([A-Z_][A-Z0-9_]*)|([a-z_][a-z0-9_]*))"
allowed-redefined-builtins = ["id"]
ignore-paths = [
    "^.venv/.*$",
    "^.*/\\.venv/.*$",
    "^.*/build/.*$",
    "^node_modules/.*$",
    "^.*/node_modules/.*$",
]
