# Codecov configuration for BoxLite
# Docs: https://docs.codecov.io/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        informational: true
        if_ci_failed: error
    patch:
      default:
        target: 90%
        threshold: 0%
        if_ci_failed: error
        if_not_found: failure

comment:
  layout: "condensed_header, diff, flags, components"
  behavior: default
  require_changes: true   # Only comment if coverage changed

# Path-filtered jobs do not all run on every commit. Preserve unchanged
# components so a partial upload cannot shrink the project's denominator.
flags:
  rust-unit:
    carryforward: true
  python:
    carryforward: true
  node:
    carryforward: true
  go:
    carryforward: true
  api:
    carryforward: true

ignore:
  - "src/deps/**/vendor/**" # Third-party sources, not BoxLite's networking bridge
  # Test sources themselves. A changed test file that matches none of these is one
  # Codecov calls testable, which makes it reject the empty upload test.yml sends
  # when no coverage job ran. Directories first, then the naming conventions in
  # tree: the `.test.`/`.spec.` infix, Go's `_test.go`, a `test_` prefix, and the
  # `tests.rs` module.
  - "**/tests/**"
  - "**/test/**"
  # The whole app is the end-to-end suite, so no naming convention marks its
  # fixtures, conftest and per-SDK drivers as tests.
  - "apps/e2e/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.go"
  - "**/test_*.*"
  - "**/tests.rs"
  - "src/test-utils/**"   # Test scaffolding pulled in by the core crate's tests
  # `coverage:go` measures the whole runner module with -coverpkg=./..., and
  # this package is generated. Codecov resolves the module's import paths back
  # to repo-relative ones, which is what the glob matches.
  - "apps/runner/pkg/api/docs/**" # swaggo/swag output, "DO NOT EDIT"
