AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Read-only IAM role for connecting the BoxLite AWS account to the SST Console
  (console.sst.dev) for VISUALIZATION only (resources, logs, deploy history).

  This REPLACES the default SST Console connect template, which grants the
  connection role `AdministratorAccess`. That default is unacceptable here for
  two reasons:
    1. Security: a 3rd-party SaaS must not hold AdministratorAccess in account
       064212132677. We grant the minimum read set the Console needs.
    2. Account guardrails: in this account every IAM role MUST be named
       `boxlite-*` AND carry the developer permissions boundary, otherwise role
       creation is denied (the boundary's NotAction:iam:* trap). A vanilla
       `SSTRole` with AdministratorAccess and no boundary cannot be created by a
       developer SSO principal here.

  Deploy this stack in us-east-1 (SST Console requirement), NOT ap-southeast-1.

  SCOPE: read-only. This does NOT enable the Console's "Issues" (needs
  logs:PutSubscriptionFilter) or "Autodeploy" (needs CodeBuild + iam write).
  Add those later in a separate, reviewed change if/when adopted.

Parameters:
  SSTConsoleAccountId:
    Type: String
    Description: >
      The AWS account ID that console.sst.dev assumes FROM. You get this from
      the Console connect flow (Workspace > add AWS account) — it shows the
      principal + ExternalId. Do NOT guess it; copy it from the connect screen.
    AllowedPattern: "^[0-9]{12}$"
  SSTConsoleExternalId:
    Type: String
    Description: >
      The ExternalId the Console connect flow gives you (per-workspace secret
      that prevents the confused-deputy problem). Copy it from the connect screen.
    NoEcho: true
  PermissionsBoundaryArn:
    Type: String
    Description: >
      The developer permissions boundary that every boxlite-* role in this
      account must carry. As of 2026-06-22 this is boxlite-role-boundary.
      VERIFY the current name before applying (it has been renamed before).
    Default: "arn:aws:iam::064212132677:policy/boxlite-role-boundary"

Resources:
  BoxliteSstConsoleReaderRole:
    Type: AWS::IAM::Role
    Properties:
      # boxlite-* name so a developer SSO principal can create it under the
      # account's IAM delegation (which scopes role create/manage to boxlite-*).
      RoleName: boxlite-sst-console-reader
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${SSTConsoleAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref SSTConsoleExternalId
      Policies:
        - PolicyName: boxlite-sst-console-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ---- Resource + stack inspection (the "Resources"/"Updates" view) ----
              - Sid: ReadCloudFormationAndCompute
                Effect: Allow
                Action:
                  - "cloudformation:DescribeStacks"
                  - "cloudformation:DescribeStackResources"
                  - "cloudformation:ListStacks"
                  - "cloudformation:GetTemplate"
                  - "lambda:GetFunction"
                  - "lambda:GetFunctionConfiguration"
                  - "lambda:ListFunctions"
                  - "ec2:DescribeRegions"
                Resource: "*"
              # ---- Logs (the "Logs" view; read-only, no subscriptions) ----
              - Sid: ReadLogs
                Effect: Allow
                Action:
                  - "logs:DescribeLogGroups"
                  - "logs:DescribeLogStreams"
                  - "logs:FilterLogEvents"
                  - "logs:GetLogEvents"
                  - "logs:StartQuery"
                  - "logs:StopQuery"
                  - "logs:GetQueryResults"
                Resource: "*"
              # ---- Metrics (resource health) ----
              - Sid: ReadMetrics
                Effect: Allow
                Action:
                  - "cloudwatch:GetMetricData"
                  - "cloudwatch:GetMetricStatistics"
                  - "cloudwatch:ListMetrics"
                Resource: "*"
              # ---- S3: SST stores deploy state/assets in a bootstrap bucket;
              #      the Console reads stack outputs/state. List+Get only. ----
              - Sid: ReadSstStateBuckets
                Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:ListBucket"
                  - "s3:GetBucketLocation"
                Resource:
                  - "arn:aws:s3:::sst-*"
                  - "arn:aws:s3:::sst-*/*"
      Tags:
        - Key: ManagedBy
          Value: boxlite-ops
        - Key: Purpose
          Value: sst-console-readonly-visualization

Outputs:
  RoleArn:
    Description: Paste this ARN back into the SST Console connect flow.
    Value: !GetAtt BoxliteSstConsoleReaderRole.Arn
